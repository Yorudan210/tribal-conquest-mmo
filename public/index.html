<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Conquête Tribale — jeu de stratégie navigateur</title>
<!-- Capture le plus tôt possible l'évènement d'installabilité PWA (Chrome/Edge desktop et Android
     -- jamais Safari/iOS, qui n'a pas cette API et reste sur la procédure manuelle "Partager > Sur
     l'écran d'accueil" décrite dans l'onglet Informations). e.preventDefault() empêche la mini-
     infobulle native du navigateur pour la remplacer par le bouton "Installer" de l'onglet
     Informations (voir InformationTab.jsx/HelpBox), qui rejoue cet évènement au clic via .prompt().
     Placé avant tout autre script pour ne rater l'évènement sous aucun prétexte. -->
<script>
window.__pwaDeferredPrompt = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  window.__pwaDeferredPrompt = e;
  window.dispatchEvent(new Event("pwa-install-available"));
});
window.addEventListener("appinstalled", () => {
  window.__pwaDeferredPrompt = null;
  window.dispatchEvent(new Event("pwa-install-available"));
});
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%B0%3C/text%3E%3C/svg%3E">
<!-- PWA (installation sur écran d'accueil mobile) : manifest + icônes + service worker (voir
     public/manifest.json et public/sw.js). Le service worker ne met en cache QUE la coquille
     statique (JS/CSS/vendor/icônes), jamais /api/ -- l'état du jeu reste toujours en temps réel. -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#241a10">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Conquête Tribale">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/app/styles.css">
</head>
<body>
<div id="root"></div>

<!-- React/ReactDOM en scripts classiques (variante UMD, vendorisée dans public/vendor/ : ce dépôt
     n'a pas accès au registre npm, voir scripts/build-client.js) : posent window.React/window.ReactDOM
     AVANT que le module ci-dessous ne s'exécute (un script classique s'exécute pendant l'analyse du
     HTML, avant tout <script type="module">, qui est toujours différé). -->
<script src="/vendor/react.production.min.js"></script>
<script src="/vendor/react-dom.production.min.js"></script>

<!-- Fait correspondre les spécificateurs "react"/"react-dom/client" (utilisés tels quels dans le
     code applicatif, comme avec un vrai bundler) vers ces deux petits ponts qui relisent les
     globales UMD posées ci-dessus -- voir public/vendor/react-shim.js. -->
<script type="importmap">
{ "imports": { "react": "/vendor/react-shim.js", "react-dom/client": "/vendor/react-dom-client-shim.js" } }
</script>

<script type="module" src="/app/main.jsx"></script>

<!-- Enregistrement du service worker (voir /sw.js) : après le chargement pour ne jamais retarder
     le premier rendu. Échec silencieux (ex. navigateur sans support, ou file:// en local) --
     l'app reste pleinement jouable sans, seule l'installation "écran d'accueil" est indisponible. -->
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load", () => { navigator.serviceWorker.register("/sw.js").catch(()=>{}); });
}
</script>
</body>
</html>
