<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conquête Tribale — jeu de stratégie navigateur</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%B0%3C/text%3E%3C/svg%3E">
<!-- Polices du thème alternatif "Parchemin" (voir body.theme-maquette plus bas) — sans effet tant
     que ce thème n'est pas activé, chargées ici pour éviter tout flash de police au premier bascule. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#ecdcae; --bg2:#241a10; --panel:#2e2417; --panel2:#3c2f1c;
    --border:#6b5333; --text:#f2e6c8; --text-dim:#bfa878; --gold:#c1793e;
    --green:#6bab5e; --red:#c15b46; --blue:#5b93b0;
    --shadow-sm:0 2px 6px rgba(30,17,6,.32);
    --shadow-md:0 4px 16px rgba(30,17,6,.4);
    --shadow-lg:0 8px 28px rgba(30,17,6,.5);
    --ring:0 0 0 3px rgba(193,121,62,.24);
    --radius-sm:8px; --radius-md:12px; --radius-lg:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:Georgia,'Times New Roman',serif; background:var(--bg);
    color:var(--text); min-height:100vh; position:relative;
  }
  /* Fond parchemin en position fixe (au lieu de background-attachment:fixed, peu fiable sur
     mobile/Safari) : un calque décoratif derrière tout le contenu, qui ne bouge pas au défilement
     et ne déforme jamais l'image même sur une page très longue. */
  body::before{
    content:""; position:fixed; inset:0; z-index:-1;
    background-image:url('assets/bg-parchment.jpg');
    background-size:cover; background-position:top center; background-repeat:no-repeat;
    background-color:var(--bg);
  }
  #gameRoot{display:flex; flex-direction:column; min-height:100vh;}
  .app-shell{display:flex; align-items:flex-start; flex:1 1 auto; min-height:0;}
  #app{flex:1 1 0; min-width:0; max-width:1200px; margin:0 auto; padding:10px 14px 40px;}
  h1,h2,h3{font-family:Georgia,serif;color:var(--gold);margin:0 0 8px;}
  a{color:var(--blue);}
  ::-webkit-scrollbar{width:11px; height:11px;}
  ::-webkit-scrollbar-track{background:var(--bg2);}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px; border:2px solid var(--bg2);}
  ::-webkit-scrollbar-thumb:hover{background:var(--gold);}
  button{
    font-family:inherit; background:linear-gradient(180deg,#453626,#2e2417); color:var(--text);
    border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px 14px; cursor:pointer;
    font-size:13px; font-weight:600; letter-spacing:.2px;
    box-shadow:var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,.05);
    transition:transform .12s ease, box-shadow .15s ease, border-color .15s ease, background .15s ease;
  }
  button:hover:not(:disabled){
    background:linear-gradient(180deg,#5a4936,#3d3020); border-color:var(--gold);
    transform:translateY(-1px); box-shadow:var(--shadow-md);
  }
  button:active:not(:disabled){transform:translateY(0); box-shadow:var(--shadow-sm);}
  button:focus-visible{outline:none; box-shadow:var(--shadow-sm), var(--ring);}
  button:disabled{opacity:.4; cursor:not-allowed; transform:none;}
  button.primary{background:linear-gradient(180deg,#a3703c,#7d5228); border-color:var(--gold); font-weight:bold;}
  button.danger{background:linear-gradient(180deg,#7a2e24,#5c2018); border-color:#a55;}
  input[type=number]{
    width:70px; background:var(--bg2); color:var(--text); border:1px solid var(--border);
    border-radius:7px; padding:6px 8px; font-family:inherit;
    box-shadow:inset 0 1px 4px rgba(0,0,0,.4);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input[type=number]:focus{outline:none; border-color:var(--gold); box-shadow:inset 0 1px 4px rgba(0,0,0,.4), var(--ring);}
  input[type=text]{
    background:var(--bg2); color:var(--text); border:1px solid var(--border);
    border-radius:7px; padding:6px 8px; font-family:inherit;
    box-shadow:inset 0 1px 4px rgba(0,0,0,.4);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input[type=text]:focus{outline:none; border-color:var(--gold); box-shadow:inset 0 1px 4px rgba(0,0,0,.4), var(--ring);}
  input[type=password]{
    background:var(--bg2); color:var(--text); border:1px solid var(--border);
    border-radius:7px; padding:6px 8px; font-family:inherit; width:100%; box-sizing:border-box;
    box-shadow:inset 0 1px 4px rgba(0,0,0,.4);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input[type=password]:focus{outline:none; border-color:var(--gold); box-shadow:inset 0 1px 4px rgba(0,0,0,.4), var(--ring);}
  #authScreen input[type=text]{width:100%; box-sizing:border-box;}
  #authScreen label.small{display:flex; flex-direction:column; gap:4px; color:var(--text-dim);}
  #authTabs button.ghost{background:transparent; box-shadow:none;}
  select{
    background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:7px;padding:6px 8px;font-family:inherit;
    box-shadow:inset 0 1px 4px rgba(0,0,0,.4);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  select:focus{outline:none; border-color:var(--gold); box-shadow:inset 0 1px 4px rgba(0,0,0,.4), var(--ring);}

  header#topbar{
    display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:space-between;
    background:linear-gradient(180deg, rgba(46,36,23,.94), rgba(36,28,17,.94));
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border:1px solid var(--border); border-radius:var(--radius-lg); padding:10px 18px; margin:14px 0;
    position:sticky; top:6px; z-index:20; box-shadow:var(--shadow-md);
  }
  .res-group{display:flex; gap:16px; flex-wrap:wrap;}
  .res{display:flex; flex-direction:column; align-items:center; min-width:64px; padding:4px 8px; border-radius:8px; transition:background .15s ease;}
  .res:hover{background:rgba(0,0,0,.15);}
  .res .val{font-weight:bold; font-size:14px;}
  .res .rate{font-size:10px; color:var(--text-dim);}
  .res.warn .val{color:var(--red);}
  .res.bonus{background:rgba(193,121,62,.16); box-shadow:inset 0 0 0 1px rgba(193,121,62,.5);}
  .res.bonus .rate{color:var(--gold);}
  .res-box .res-group{display:grid; grid-template-columns:1fr 1fr; gap:8px 6px;}
  .res-box .res{align-items:flex-start; min-width:0; width:100%; padding:6px 8px;}
  .res-box .res .val{font-size:13px; white-space:nowrap;}
  .topbar-right{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .village-title{display:flex; flex-direction:column;}
  .village-title .name{font-weight:bold; color:var(--gold);}
  .village-title .coord{font-size:11px; color:var(--text-dim);}
  .village-title .name-row{display:flex; align-items:center; gap:6px;}
  .btn-rename{background:transparent; border:none; box-shadow:none; padding:2px 4px; font-size:12px; opacity:.6; cursor:pointer;}
  .btn-rename:hover{opacity:1; transform:none; background:transparent; box-shadow:none;}
  .village-title input[type=text]{font-weight:bold; color:var(--gold); padding:2px 6px; width:160px; font-size:14px;}

  /* ---- Logo centré en haut de page ---- */
  .top-banner{
    display:flex; align-items:center; justify-content:center; gap:12px; padding:14px 18px;
    background:linear-gradient(180deg, rgba(46,36,23,.97), rgba(36,28,17,.97));
    border-bottom:1px solid var(--border); box-shadow:var(--shadow-sm); position:relative; z-index:26;
  }
  .top-banner svg{width:34px; height:40px; flex:0 0 auto; overflow:visible;}
  .top-banner .brand-name{font-family:Georgia,serif; color:var(--gold); font-weight:bold; font-size:20px; letter-spacing:1.5px; text-transform:uppercase;}

  /* ---- Barre latérale de navigation (architecture "dashboard moderne") ---- */
  .side-nav{
    flex:0 0 224px; position:sticky; top:0; align-self:flex-start; height:100%; overflow-y:auto;
    display:flex; flex-direction:column; gap:10px; padding:18px 12px 24px;
    background:linear-gradient(180deg, rgba(46,36,23,.97), rgba(28,22,13,.97));
    border-right:1px solid var(--border); box-shadow:var(--shadow-md); z-index:25;
  }
  nav#tabs{
    display:flex; flex-direction:column; gap:3px;
  }
  nav#tabs button{
    border-radius:var(--radius-sm); border-color:transparent; border-left:3px solid transparent; background:transparent; box-shadow:none;
    color:var(--text-dim); text-align:left; justify-content:flex-start; display:flex; align-items:center; gap:8px;
    padding:10px 11px; font-size:13px; width:100%;
  }
  nav#tabs button:hover:not(.active){background:rgba(193,121,62,.12); border-color:transparent; border-left-color:transparent; color:var(--text); transform:none; box-shadow:none;}
  nav#tabs button.active{background:var(--panel2); border-color:var(--border); border-left-color:var(--gold); color:var(--gold); font-weight:bold; box-shadow:var(--shadow-sm);}

  .layout{display:flex; gap:14px; align-items:flex-start;}
  main#tabContent{flex:1 1 640px; min-width:0; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-lg); padding:18px; box-shadow:var(--shadow-md);}
  aside#sidebar{flex:0 0 280px; display:flex; flex-direction:column; gap:12px;}
  .box{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-md); padding:12px 14px; box-shadow:var(--shadow-sm);}
  .box h3{font-size:14px; margin-bottom:8px; border-bottom:1px solid var(--border); padding-bottom:6px;}

  .grid-buildings{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px;}

  /* Commandant (voir renderCommander) */
  .cmd-branches{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px;}
  .cmd-branch{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-md); padding:12px 14px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; gap:8px;}
  .cmd-branch h3{font-size:14px; margin:0 0 4px; border-bottom:1px solid var(--border); padding-bottom:6px;}
  .cmd-tier{border:1px solid var(--border); border-radius:8px; padding:8px 10px; background:var(--panel2); display:flex; flex-direction:column; gap:6px; transition:background .15s ease, border-color .15s ease;}
  .cmd-tier.unlocked{border-color:var(--green,#8fd06a); background:rgba(143,208,106,.10);}
  .cmd-tier-final{border-style:dashed;}
  .cmd-tier-head{display:flex; align-items:flex-start; gap:8px;}
  .cmd-tier-num{flex-shrink:0; width:20px; height:20px; border-radius:50%; background:var(--gold); color:#241a0d; font-size:11px; font-weight:bold; display:flex; align-items:center; justify-content:center;}
  .cmd-tier.unlocked .cmd-tier-num{background:var(--green,#8fd06a);}
  .cmd-tier-desc{font-size:12px; color:var(--text); flex:1;}
  .cmd-tier-status{font-size:11px;}
  .cmd-status-done{color:var(--green,#8fd06a); font-weight:bold;}
  body.theme-maquette .cmd-branch h3{ font-size:16px; }
  body.theme-maquette .cmd-tier-desc{ font-size:13.5px; }
  body.theme-maquette .cmd-tier-status{ font-size:12.5px; }

  .village-scene{
    position:relative; width:100%; aspect-ratio:16/10;
    border:2px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; margin-bottom:14px;
    box-shadow:inset 0 0 50px rgba(0,0,0,.55), var(--shadow-md); background:#212c14;
  }
  .village-svg{width:100%; height:100%; display:block;}
  .plot{cursor:pointer;}
  .plot .groundmark{ fill:rgba(0,0,0,.3); transition:fill .15s, filter .15s; }
  .plot:hover .groundmark{ fill:rgba(193,121,62,.22); }
  .plot.selected .groundmark{ fill:rgba(193,121,62,.4); filter:drop-shadow(0 0 8px rgba(193,121,62,.8)); }
  .plot .art{ transition:filter .15s; }
  .plot:hover .art{ filter:brightness(1.14); }
  .plot .empty-art{ filter:grayscale(85%) brightness(.8); opacity:.6; }
  .plot .badge-bg{ fill:var(--gold); stroke:#2a1c10; stroke-width:1.5; }
  .plot .badge-text{ fill:#2a1c10; font-size:15px; font-weight:bold; font-family:Georgia,serif; }
  .plot .label-bg{ fill:rgba(18,14,9,.82); }
  .plot .label-text{ fill:#f0e4cc; font-size:14px; font-weight:bold; font-family:Georgia,serif; }
  .plot .hammer{ font-size:24px; animation:bounce 1s infinite; }
  .dirt-path{ stroke:#8a6a3f; stroke-width:13; stroke-linecap:round; opacity:.45; }
  .wall-ring{ cursor:pointer; transition:filter .15s; }
  .wall-ring:hover{ filter:brightness(1.08); }
  .wall-ring.selected{ filter:drop-shadow(0 0 12px rgba(193,121,62,.7)); }
  @keyframes bounce{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-5px);} }
  .building-detail{ display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap; }
  .building-detail .icon-big{ width:78px; height:78px; display:flex; align-items:center; justify-content:center; background:linear-gradient(180deg,#5c4832,#3d2e1e); border:2px solid var(--gold); border-radius:var(--radius-md); flex:0 0 auto; padding:6px; box-shadow:var(--shadow-sm);}
  .building-detail .icon-big svg{ width:100%; height:100%; overflow:visible; }
  .building-detail .info{flex:1 1 240px;}

  .card{background:var(--panel2); border:1px solid var(--border); border-radius:var(--radius-md); padding:12px; box-shadow:var(--shadow-sm); transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;}
  .card:hover{transform:translateY(-2px); box-shadow:var(--shadow-md); border-color:var(--gold);}
  .card .card-head{display:flex; align-items:center; gap:10px; margin-bottom:4px;}
  .card .icon-mini{width:42px; height:42px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; background:linear-gradient(180deg,#5c4832,#3d2e1e); border:2px solid var(--border); border-radius:9px; padding:4px;}
  .card .icon-mini svg{width:100%; height:100%; overflow:visible;}
  .card .icon-mini.shop-icon{font-size:22px;}
  .free-tag{color:var(--green); font-weight:bold;}
  .card.quest-done{border-color:var(--green); opacity:.75;}
  .tier-pip{display:inline-block; width:11px; height:11px; border-radius:50%; background:#2a2116; border:1px solid var(--border); margin-left:3px; vertical-align:middle;}
  .tier-pip.reached{border-color:rgba(0,0,0,.5); box-shadow:0 0 4px rgba(255,255,255,.3);}
  .card h4{margin:0; color:var(--gold); font-size:15px; display:flex; flex-direction:column; gap:2px;}
  .card .desc{font-size:11px; color:var(--text-dim); margin-bottom:6px; min-height:28px;}
  .card .cost{font-size:11px; margin-bottom:6px;}
  .cost span{margin-right:8px;}
  .cost span.short{color:var(--red);}
  .queue-item, .mission-item{
    border-bottom:1px dashed var(--border); padding:8px 2px; font-size:12px; border-radius:6px; transition:background .15s ease;
  }
  .queue-item:hover, .mission-item:hover{background:rgba(0,0,0,.14);}
  .queue-item:last-child, .mission-item:last-child{border-bottom:none;}
  .bar-bg{background:var(--bg2); border:1px solid var(--border); border-radius:6px; height:9px; overflow:hidden; margin-top:4px; box-shadow:inset 0 1px 3px rgba(0,0,0,.5);}
  .bar-fill{background:linear-gradient(90deg, var(--green), #8fd06a); height:100%; transition:width .2s ease;}
  .troop-row{display:flex; flex-wrap:wrap; row-gap:6px; align-items:center; justify-content:space-between; gap:8px; padding:8px 4px; border-bottom:1px dashed var(--border); font-size:12px; border-radius:6px; transition:background .15s ease;}
  .troop-row:hover{background:rgba(0,0,0,.14);}
  .troop-row:last-child{border-bottom:none;}
  .troop-row .tname{font-weight:bold; color:var(--gold); width:110px;}
  .disband-row{display:flex; align-items:center; gap:6px; padding-left:8px; margin-left:4px; border-left:1px dashed var(--border);}
  .stats-mini{font-size:10px; color:var(--text-dim);}
  /* Triangle de contre-unités lisible (voir renderBarracks/troopTypeChip/troopTriangleBars) */
  .type-chip{display:inline-block; padding:2px 7px; border-radius:20px; font-size:9.5px; font-weight:bold; letter-spacing:.2px; white-space:nowrap; border:1px solid var(--border);}
  .type-chip.type-inf{background:rgba(150,110,60,.22); color:#d8b98a;}
  .type-chip.type-cav{background:rgba(60,110,150,.22); color:#8ac2e0;}
  .type-chip.type-arch{background:rgba(90,150,70,.22); color:#a8d98a;}
  .ttriangle{display:flex; flex-direction:column; gap:2px; min-width:130px;}
  .ttri-row{display:flex; align-items:center; gap:5px; font-size:9.5px; color:var(--text-dim);}
  .ttri-lbl{width:58px; flex-shrink:0;}
  .ttri-bar{flex:1 1 auto; height:6px; background:var(--bg2); border:1px solid var(--border); border-radius:4px; overflow:hidden;}
  .ttri-fill{height:100%; border-radius:4px 0 0 4px;}
  .ttri-fill.inf{background:linear-gradient(90deg,#8a6a3c,#d8b98a);}
  .ttri-fill.cav{background:linear-gradient(90deg,#3c6a8a,#8ac2e0);}
  .ttri-fill.arch{background:linear-gradient(90deg,#4a7a3c,#a8d98a);}
  .ttri-val{width:22px; flex-shrink:0; text-align:right; font-variant-numeric:tabular-nums;}
  table{width:100%; border-collapse:collapse; font-size:12px;}
  th,td{text-align:left; padding:6px 8px; border-bottom:1px solid var(--border);}
  tr{transition:background .15s ease;}
  tbody tr:hover{background:rgba(0,0,0,.14);}
  .tag{display:inline-block; padding:2px 8px; border-radius:20px; font-size:10px; font-weight:bold; letter-spacing:.3px;}
  .tag.weak{background:#2c4a22;color:#a8d98a;}
  .tag.medium{background:#4a3f22;color:#e0c98a;}
  .tag.strong{background:#4a2222;color:#e0a0a0;}
  .tag.ally{background:#1f4a3a;color:#8ad9c0;}
  .tag.pact{background:#22384a;color:#8ac0e0;}
  .tag.war{background:#4a2222;color:#e0a0a0;}
  .event-badges{display:flex; flex-wrap:wrap; gap:8px;}
  .event-badge{position:relative; display:inline-flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:10px; background:rgba(193,121,62,.16); border:1px solid var(--gold); font-size:18px; cursor:default; transition:transform .15s ease, background .15s ease;}
  .event-badge:hover{background:rgba(193,121,62,.32); transform:translateY(-1px);}
  .event-badge .event-badge-mult{position:absolute; right:-5px; bottom:-5px; background:var(--gold); color:#1a1108; font-size:9px; font-weight:bold; line-height:1; padding:2px 4px; border-radius:8px; box-shadow:0 0 0 2px var(--panel);}
  .event-badge.admin{cursor:pointer;}
  .event-badge .event-badge-stop{position:absolute; top:-6px; right:-6px; width:16px; height:16px; border-radius:50%; background:#4a2222; color:#e0a0a0; font-size:10px; line-height:16px; text-align:center; display:none; padding:0;}
  .event-badge.admin:hover .event-badge-stop{display:block;}
  .send-form{margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); display:none;}
  .send-form.open{display:block; animation:fadeSlideIn .2s ease;}
  @keyframes fadeSlideIn{ 0%{opacity:0; transform:translateY(-4px);} 100%{opacity:1; transform:translateY(0);} }
  .send-form .inputs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px;}
  .send-form .inp{display:flex; flex-direction:column; align-items:center; font-size:10px;}

  .map-toolbar{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; margin-bottom:10px;
    background:rgba(0,0,0,.16); border:1px solid var(--border); border-radius:var(--radius-md); padding:8px 10px;
  }
  .map-toolbar .group{display:flex; gap:6px; align-items:center;}
  .map-toolbar input[type=number]{width:58px;}
  #mapCanvas{
    position:relative; width:100%; height:520px; overflow:hidden; touch-action:none;
    border:2px solid var(--border); border-radius:var(--radius-lg); cursor:grab;
    background:#182210 radial-gradient(ellipse at 50% 40%, #223318 0%, #131b0c 80%);
    box-shadow:inset 0 0 60px rgba(0,0,0,.5), var(--shadow-md);
  }
  #mapCanvas.dragging{cursor:grabbing;}
  #mapWorld{position:absolute;}
  #mapInfluence{position:absolute; left:0; top:0; pointer-events:none;}
  #mapAttackLines{position:absolute; left:0; top:0; pointer-events:none;}
  .villagePin{position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; cursor:pointer;}
  .villagePin .dot{
    position:relative; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:15px; border:2px solid #1a140d; box-shadow:0 2px 5px rgba(0,0,0,.6);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .resbonus-badge{
    position:absolute; top:-5px; right:-5px; width:15px; height:15px; border-radius:50%;
    background:var(--gold); border:1px solid #1a140d; font-size:9px; line-height:1;
    display:flex; align-items:center; justify-content:center; box-shadow:0 1px 3px rgba(0,0,0,.6);
  }
  .villagePin:hover .dot{transform:scale(1.12); box-shadow:0 4px 10px rgba(0,0,0,.7);}

  .villagePin.ally .dot{background:#2c6a4a; border-color:#8ad9c0;}

  .villagePin.war .dot{background:#8a3226; border-color:#e0a0a0; box-shadow:0 0 8px rgba(224,80,80,.6);}
  .villagePin.blackarmy .dot{background:#0c0c10; border-color:#9a2b2b; box-shadow:0 0 9px rgba(154,43,43,.85);}
  .villagePin.blackarmy:hover .dot{box-shadow:0 0 14px rgba(210,60,60,.95);}
  .villagePin.player .dot{background:linear-gradient(180deg,#f0cd7c,#b3831f); border-color:var(--gold); font-size:17px;}
  .villagePin.selected .dot{outline:3px solid var(--gold); outline-offset:2px;}
  .villagePin .dot svg{width:27px; height:23px; overflow:visible; display:block;}
  .mapDecor{position:absolute; transform:translate(-50%,-100%); pointer-events:none; opacity:.88;}
  .mapDecor svg{display:block; width:100%; height:100%; overflow:visible;}
  .villagePin .plabel{
    position:absolute; top:32px; font-size:9px; white-space:nowrap; background:rgba(20,16,10,.85);
    padding:2px 6px; border-radius:6px; color:var(--text); pointer-events:none;

  .troop-marker{
    position:absolute; transform:translate(-50%,-50%); pointer-events:none; z-index:6;
    transition:left 0.95s linear, top 0.95s linear;
  }
  .troop-marker .tdot{
    width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:11px; border:2px solid #1a140d; box-shadow:0 2px 6px rgba(0,0,0,.65);

  .troop-marker.marker-scout .tdot{background:linear-gradient(180deg,#5a9ac0,#2f5f7a);}
  .troop-marker.marker-returning{opacity:.72;}
  /* Mission d'un AUTRE joueur (attaque/reconnaissance en approche) : plus petite, plus discrète et
     bordure pointillée grisée, pour bien la distinguer visuellement des missions du joueur actif
     tout en la gardant lisible (aucune identité ni composition de troupes n'est révélée, voir
     buildSnapshot côté serveur). */
  .troop-marker.marker-foreign{opacity:.6;}
  .troop-marker.marker-foreign .tdot{width:15px; height:15px; font-size:9px; border:2px dashed #cfae7a;}
  .troop-marker.marker-foreign .tdot{animation:none;}

  #villageDetail .box{margin-top:10px;}
  .report{border:1px solid var(--border); border-radius:var(--radius-md); padding:10px 12px; margin-bottom:8px; background:var(--panel2); box-shadow:var(--shadow-sm); transition:box-shadow .15s ease, border-color .15s ease;}

  #battleBanner{

    nav#tabs button.active{border-left-color:transparent; border-bottom-color:var(--gold);}
    #app{max-width:100%;}
    /* align-items:flex-start (hérité de la règle desktop) ne s'applique normalement qu'à l'axe
       vertical ; mais une fois flex-direction basculé en column ici, cet axe devient horizontal,
       et sans stretch le contenu principal ne s'étire plus sur toute la largeur : il reprend sa
       largeur intrinsèque (parfois plus large que l'écran), ce qui provoquait un débordement

  .chat-head .chat-toggle{background:transparent; border:none; box-shadow:none; padding:2px 6px; font-size:12px;}

  #tabContent tr.admin-selected{background:rgba(193,121,62,.16);}

  /* ======================================================================
     THÈME ALTERNATIF "PARCHEMIN" — reprend la palette/typo des maquettes
     (fond crème, encre sombre, Cinzel/Crimson Pro). Activé/désactivé par
     le bouton en bas de page (voir #btnThemeToggle / applyTheme()).
     La bannière du logo et la barre de navigation de gauche restent
     volontairement en bois sombre dans les deux thèmes : c'est le
     "cadre" de l'appli, pas le contenu qu'on habille. ====================== */
  body.theme-maquette{
    --panel:#f1e5c7; --panel2:#e9dcb8; --bg:#f4e9cf;
    --text:#2a1c10; --text-dim:#6b5a42; --gold:#b87a3a;
    --green:#3d6b52; --red:#7a2530; --blue:#4a5a8f;
    --shadow-sm:0 2px 6px rgba(72,48,20,.18);
    --shadow-md:0 4px 16px rgba(72,48,20,.22);
    --shadow-lg:0 8px 28px rgba(72,48,20,.28);
    --ring:0 0 0 3px rgba(184,122,58,.28);
    font-family:'Crimson Pro', Georgia, serif;
    background:#f4e9cf;
  }
  body.theme-maquette::before{
    background-image:none;
    background:radial-gradient(ellipse at top, #f7ecd2 0%, #ecdcb4 55%, #ddc691 100%);
  }
  body.theme-maquette h1, body.theme-maquette h2, body.theme-maquette h3{
    font-family:'Cinzel', Georgia, serif; color:#241708;
  }
  body.theme-maquette .res .val, body.theme-maquette .res .rate,
  body.theme-maquette .village-title .coord{ font-family:'IBM Plex Mono', ui-monospace, monospace; }

  /* Boutons/champs : les dégradés d'origine supposaient un texte clair — on leur donne
     leur propre traitement clair plutôt que de s'appuyer sur --text (repris par le cadre sombre). */
  body.theme-maquette button{
    background:linear-gradient(180deg,#efe2bd,#ddc999); color:#2a1c10; border-color:#8f5c26;
    box-shadow:0 2px 6px rgba(72,48,20,.16), inset 0 1px 0 rgba(255,255,255,.5);
  }
  body.theme-maquette button:hover:not(:disabled){
    background:linear-gradient(180deg,#f7ecd2,#e6d3a1); border-color:#b87a3a;
  }
  body.theme-maquette button.primary{ background:linear-gradient(180deg,#c78a48,#a3703c); color:#fbf3dd; }
  body.theme-maquette button.danger{ background:linear-gradient(180deg,#a4453a,#7a2530); color:#fbf3dd; border-color:#5c2018; }
  body.theme-maquette input[type=number], body.theme-maquette input[type=text],
  body.theme-maquette input[type=password], body.theme-maquette select{
    background:#fbf3dd; color:#2a1c10; border-color:#8f5c26;
    box-shadow:inset 0 1px 4px rgba(72,48,20,.15);
  }

  /* Barre du village (nom/coordonnées) : devient une carte claire, comme dans les maquettes */
  body.theme-maquette header#topbar{
    background:linear-gradient(180deg, rgba(241,229,199,.95), rgba(233,215,176,.95));
  }

  /* Bannière de conquête : dégradé volontairement sombre même dans ce thème (effet dramatique) */
  body.theme-maquette #battleBanner.conquest{ color:#f2e6c8; }

  /* Bannière du logo + rail de navigation gauche : restent en bois sombre dans les deux thèmes,
     on ne pin que leurs libellés pour qu'ils restent lisibles sur ce fond resté sombre. */
  body.theme-maquette nav#tabs button{ color:#c9b489; }
  body.theme-maquette nav#tabs button:hover:not(.active){ color:#f2e6c8; }

  /* Texte agrandi dans ce thème (lisibilité façon manuscrit) : le thème "Bois sombre" garde ses
     tailles d'origine à l'identique, seules ces règles plus spécifiques (activées par la classe
     body.theme-maquette) s'appliquent en plus. Le texte incrusté dans les SVG (carte, rapports de
     combat) est volontairement laissé de côté : il est positionné au pixel près dans des viewBox
     de taille fixe et déborderait si on l'agrandissait. */
  body.theme-maquette button{ font-size:14.5px; }
  body.theme-maquette input[type=number], body.theme-maquette input[type=text],
  body.theme-maquette input[type=password], body.theme-maquette select{ font-size:14.5px; }
  body.theme-maquette .res .val{ font-size:16px; }
  body.theme-maquette .res .rate{ font-size:12px; }
  body.theme-maquette .res-box .res .val{ font-size:15px; }
  body.theme-maquette .village-title .name{ font-size:15px; }
  body.theme-maquette .village-title .coord{ font-size:13px; }
  body.theme-maquette .village-title input[type=text]{ font-size:16px; }
  body.theme-maquette .box h3{ font-size:16px; }
  body.theme-maquette .card h4{ font-size:17px; }
  body.theme-maquette .card .desc, body.theme-maquette .card .cost{ font-size:13px; }

  body.theme-maquette .stats-mini{ font-size:12px; }
  body.theme-maquette table{ font-size:14px; }
  body.theme-maquette .tag{ font-size:11px; }
  body.theme-maquette .report .title{ font-size:15px; }
  body.theme-maquette .report .details{ font-size:13px; }
  body.theme-maquette .toast{ font-size:13.5px; }
  body.theme-maquette .muted{ font-size:13.5px; }
  body.theme-maquette .small{ font-size:12.5px; }
  body.theme-maquette footer{ font-size:12.5px; }
  body.theme-maquette .chart-title{ font-size:11px; }
  body.theme-maquette .filter-btn{ font-size:12.5px; }
  body.theme-maquette .shop-card h4{ font-size:16px; }
  body.theme-maquette .donation-row{ font-size:14px; }
  body.theme-maquette #chatWidget{ font-size:14.5px; }
  body.theme-maquette .chat-tab{ font-size:12.5px; }
  body.theme-maquette .chat-msg{ font-size:13.5px; }
  body.theme-maquette .chat-msg .chat-time{ font-size:11px; }
  body.theme-maquette .tutorial-card h3{ font-size:21px; }
  body.theme-maquette .tutorial-card p{ font-size:14.5px; }
  body.theme-maquette .type-chip{ font-size:11.5px; }
  body.theme-maquette .ttri-row{ font-size:11.5px; }
  body.theme-maquette .ttri-lbl{ width:66px; }

/* ------------------------- Icônes de village (carte) ------------------------- *
 * Remplace l'ancien pictogramme emoji (🚩/👤/🏯/🏚️) par une petite scène de village
 * originale, en réutilisant le même style de hutte que tinyHouseSvg ci-dessus, qui
 * "évolue" visuellement : le nombre de huttes grandit avec le niveau (0=isolée,
 * 1=hameau, 2=gros village), et une palissade pointillée apparaît dès qu'une
 * muraille est construite (villageIconLevel ci-dessous détermine ces deux niveaux
 * à partir des seules informations publiques déjà envoyées par le serveur — voir
 * publicVillageView : jamais le niveau réel des bâtiments d'un village adverse). */
function villageIconLevel(t, mine){
  const wl = t.wallLevel||0;
  if(mine || t.isPlayer) return wl>=10 ? 2 : (wl>=1 ? 1 : 0);
  const tier = t.tier||0;
  return tier<=1 ? 0 : (tier<=2 ? 1 : 2);
}
function villageMapIconSvg(kind, level, hasWall){
  const barb = kind==="barbarian";
  const black = kind==="blackarmy";
  // "Armée Noire" : silhouette délibérément assombrie (murs quasi noirs, toit rouge sombre) pour
  // qu'un campement se distingue d'un simple coup d'oeil sur la carte, même sans regarder la
  // couleur du point du pin -- voir aussi villagePin.blackarmy dans le CSS.
  const wall = black ? "#141417" : (barb ? "#6b5a3f" : "#8a6a45");
  const roof = black ? "#4a1414" : (barb ? "#4a3826" : "#6b3226");
  const doorStroke = black ? "#0a0a0c" : "#2a1c10";
  const hut = (x,s)=>`<g transform="translate(${x},2) scale(${s})">
    <rect x="-9" y="-14" width="18" height="14" fill="${wall}" stroke="${doorStroke}" stroke-width="1.4"/>
    <polygon points="-11,-14 0,-25 11,-14" fill="${roof}" stroke="${doorStroke}" stroke-width="1.4"/>
    <rect x="-3" y="-8" width="6" height="8" fill="${doorStroke}"/>
  </g>`;
  const huts = level<=0 ? hut(0,1) : level===1 ? hut(-9,0.82)+hut(9,0.9) : hut(-14,0.78)+hut(0,0.95)+hut(14,0.78);
  const palisade = hasWall ? `<path d="M -22 4 Q 0 12 22 4" fill="none" stroke="${black?'#3a1414':'#5a4326'}" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 3"/>` : "";
  const flag = kind==="mine"
    ? `<g transform="translate(0,-25)"><line x1="0" y1="0" x2="0" y2="-13" stroke="#4a3320" stroke-width="1.4"/><polygon points="0,-13 9,-9.5 0,-6" fill="#f0cd7c" stroke="#8a6a2a" stroke-width="1"/></g>`
    : kind==="player" ? `<g transform="translate(0,-23)"><line x1="0" y1="0" x2="0" y2="-10" stroke="#4a3320" stroke-width="1.4"/><polygon points="0,-10 7,-7.3 0,-4.6" fill="#c8c8c8" stroke="#6a6a6a" stroke-width="1"/></g>`
    : black ? `<g transform="translate(0,-25)"><line x1="0" y1="0" x2="0" y2="-14" stroke="#0a0a0c" stroke-width="1.4"/><polygon points="0,-14 10,-10 0,-6" fill="#1a1a1e" stroke="#9a2b2b" stroke-width="1.2"/></g>` : "";
  return `<svg viewBox="-24 -30 48 36" preserveAspectRatio="xMidYMax meet">${palisade}${huts}${flag}</svg>`;
}

/* ------------------------- Décor de la carte du monde ------------------------- *
 * Quelques arbres/collines/rochers/buissons dispersés sur la carte, purement
 * cosmétiques (aucune information, aucune interaction). Placement pseudo-aléatoire
 * mais STABLE (dérivé des coordonnées, pas de Math.random) pour ne pas "sauter"
 * d'un rendu à l'autre — voir mapDecorHtml, appelé depuis renderMap(). */
function mapPseudoRandom(x,y){
  const s=Math.sin(x*12.9898+y*78.233)*43758.5453;
  return s-Math.floor(s);
}
const MAP_DECOR_TYPES=["tree","hill","rock","bush"];
function mapDecorSvg(type){
  if(type==="tree") return `<svg viewBox="-14 -34 28 34"><rect x="-2" y="-6" width="4" height="10" fill="#4a331d"/><polygon points="0,-34 -11,-14 11,-14" fill="#2c4d25" stroke="#1c2e15" stroke-width="1"/><polygon points="0,-24 -9,-6 9,-6" fill="#3f6b34" stroke="#1c2e15" stroke-width="1"/></svg>`;
  if(type==="hill") return `<svg viewBox="-18 -13 36 17"><ellipse cx="0" cy="2" rx="17" ry="9" fill="#5a6b3a" stroke="#3a4526" stroke-width="1"/><ellipse cx="-5" cy="-1" rx="9" ry="5" fill="#6d8047" opacity="0.65"/></svg>`;
  if(type==="rock") return `<svg viewBox="-12 -13 24 17"><polygon points="-10,4 -6,-8 4,-9 10,2 6,4" fill="#8a8577" stroke="#4a463c" stroke-width="1"/><polygon points="-6,-8 -1,-4 4,-9" fill="#a29c8c" opacity="0.7"/></svg>`;
  return `<svg viewBox="-12 -13 24 15"><ellipse cx="-4" cy="0" rx="7" ry="6" fill="#3f6b34" stroke="#1c2e15" stroke-width="1"/><ellipse cx="5" cy="1" rx="6" ry="5" fill="#4a7a3a" stroke="#1c2e15" stroke-width="1"/></svg>`; // bush
}
/* Un nombre FIXE d'éléments de décor est échantillonné (jamais une boucle sur toutes les cases du
   monde, dont l'étendue n'est pas bornée) pour rester performant quelle que soit la taille de la
   zone visible ; les cases déjà occupées par un village (occupied) sont simplement ignorées. */
function mapDecorHtml(minX, maxX, minY, maxY, ppf, occupied){
  const spanX=Math.max(1,maxX-minX), spanY=Math.max(1,maxY-minY);
  const count=Math.min(60, Math.round(spanX*spanY*0.06));
  let html="";
  for(let i=0;i<count;i++){
    const gx=Math.round(minX+mapPseudoRandom(i*7.13,3.31)*spanX);
    const gy=Math.round(minY+mapPseudoRandom(i*3.71,11.9)*spanY);
    if(occupied.has(gx+","+gy)) continue;
    const typeIdx=Math.floor(mapPseudoRandom(gx*1.7+0.3, gy*2.3+0.7)*MAP_DECOR_TYPES.length);
    const type=MAP_DECOR_TYPES[clamp(typeIdx,0,MAP_DECOR_TYPES.length-1)];
    const size=ppf*(0.8+mapPseudoRandom(gx,gy)*0.4);
    const left=(gx-minX)*ppf, top=(gy-minY)*ppf+ppf*0.4;
    html += `<div class="mapDecor" style="left:${left}px; top:${top}px; width:${size}px; height:${size}px;">${mapDecorSvg(type)}</div>`;
  }
  return html;
}

function getBuildingArt(key, level){

  const fn = BUILDING_ART[key];

}

/* Muraille circulaire qui entoure tout le village (au lieu d'une simple hutte) — se renforce avec le niveau
   et change de matériau : bois (1-9), pierre (10-19), brique et fer (20+). */
function villageWallRing(level){
  const cx=500, cy=320, rx=420, ry=250;
  const tier = materialTier(level);
  const m = MATERIAL[tier];
  const towerCount = tier===3 ? 12 : tier===2 ? 8 : 6;
  const merlonCount = tier>=2 ? 48 : 30;
  const bannered = tier===3;
  const towers=[];
  for(let i=0;i<towerCount;i++){
    const a=(i/towerCount)*Math.PI*2 - Math.PI/2;
    const x=(cx+rx*Math.cos(a)).toFixed(1), y=(cy+ry*Math.sin(a)).toFixed(1);
    towers.push(`<g transform="translate(${x},${y})">
      <rect x="-15" y="-32" width="30" height="32" fill="${m.wall}" stroke="#2a1c10" stroke-width="2"/>
      <polygon points="-17,-32 0,-48 17,-32" fill="${m.wallDark}" stroke="#2a1c10" stroke-width="2"/>
      ${bannered?`<line x1="0" y1="-48" x2="0" y2="-60" stroke="#2a1c10" stroke-width="2"/><polygon points="0,-60 13,-55 0,-50" fill="#8a2e22"/>`:''}
    </g>`);
  }
  const merlons=[];
  for(let i=0;i<merlonCount;i++){
    const a=(i/merlonCount)*Math.PI*2 - Math.PI/2;
    const x=cx+rx*Math.cos(a), y=cy+ry*Math.sin(a);
    merlons.push(`<rect x="${(x-6).toFixed(1)}" y="${(y-6).toFixed(1)}" width="12" height="12" fill="${m.wallLight}" stroke="#2a1c10" stroke-width="1.5"/>`);
  }
  return `
    <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="#2a1c10" stroke-width="42"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="${m.wallLight}" stroke-width="34"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${rx-9}" ry="${ry-9}" fill="none" stroke="${m.wall}" stroke-width="7" opacity="0.55"/>
    ${merlons.join("")}
    ${towers.join("")}
  `;
}

/* ============================= AMBIANCE SONORE (synthétisée, sans fichier externe) ============================= */

const Audio = (() => {
  let ctx = null, muted = false;
  function ensureCtx(){
    if(!ctx){ const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return null; ctx = new AC(); }
    if(ctx.state==="suspended") ctx.resume();
    return ctx;
  }
  function tone(freq, duration, opts={}){
    if(muted) return;
    const c = ensureCtx(); if(!c) return;
    const osc = c.createOscillator(), gain = c.createGain();
    osc.type = opts.type || "sine";
    osc.frequency.value = freq;
    const vol = opts.vol!=null ? opts.vol : 0.12;
    gain.gain.setValueAtTime(0.0001, c.currentTime);
    gain.gain.linearRampToValueAtTime(vol, c.currentTime+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+duration);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(); osc.stop(c.currentTime+duration+0.05);
  }
  function sequence(notes, opts={}){
    let t=0;
    notes.forEach(([f,d,gap])=>{ if(f>0) setTimeout(()=>tone(f,d,opts), t*1000); t+=(gap!=null?gap:d); });
  }
  const SFX = {
    buildQueued: ()=>tone(440,0.08,{type:"triangle",vol:0.07}),
    buildDone: ()=>sequence([[523,0.12],[659,0.12],[784,0.22]],{type:"triangle",vol:0.11}),
    trainQueued: ()=>tone(330,0.07,{type:"square",vol:0.06}),
    trainDone: ()=>sequence([[392,0.08],[523,0.16]],{type:"square",vol:0.08}),
    depart: ()=>sequence([[220,0.15],[220,0.18]],{type:"sawtooth",vol:0.09}),
    victory: ()=>sequence([[523,0.12],[659,0.12],[784,0.12],[988,0.26]],{type:"triangle",vol:0.14}),
    defeat: ()=>sequence([[300,0.2],[220,0.32]],{type:"sawtooth",vol:0.11}),
    conquest: ()=>sequence([[523,0.1],[659,0.1],[784,0.1],[659,0.1],[784,0.1],[988,0.4]],{type:"triangle",vol:0.15}),
    raidAlarm: ()=>sequence([[880,0.1],[0,0.05],[880,0.1],[0,0.05],[880,0.16]],{type:"square",vol:0.09}),
    error: ()=>tone(180,0.15,{type:"square",vol:0.07})
  };
  function setMuted(m){ muted=m; }
  function toggle(){ setMuted(!muted); return muted; }
  return {ensureCtx, SFX, setMuted, toggle, isMuted:()=>muted};
})();

function popUsed(){
  let used=0;
  for(const k of TROOP_ORDER) used += (state.village.troops[k]||0)*TROOPS[k].pop;
  for(const o of state.village.trainQueue) used += o.count*TROOPS[o.troop].pop;
  // Ne compte que les troupes parties DEPUIS ce village précis (chaque village a sa propre
  // population/ferme — les troupes d'un autre de vos villages ne doivent pas compter ici).
  for(const m of state.missions){
    if(m.attackerUsername!==username || m.sourceVillageId!==state.village.id) continue;
    for(const k of TROOP_ORDER) used += (m.troops[k]||0)*TROOPS[k].pop;
  }
  return Math.round(used);
}

  let n = state.village.troops.noble||0;
  for(const o of state.village.trainQueue) if(o.troop==="noble") n+=o.count;
  for(const m of state.missions) if(m.attackerUsername===username && m.sourceVillageId===state.village.id) n += m.troops.noble||0;
  return n;
}

function fmtClock(t){
  if(t==null) return "";
  const d=new Date(t*1000);
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");

function fmtTime(sec){
  sec=Math.max(0,Math.round(sec));
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  if(h>0) return h+"h "+String(m).padStart(2,"0")+"m "+String(s).padStart(2,"0")+"s";
  if(m>0) return m+"m "+String(s).padStart(2,"0")+"s";
  return s+"s";
}

async function apiCall(path, method, body){
  const opts = { method, headers:{} };
  if(authToken) opts.headers["Authorization"]="Bearer "+authToken;
  if(body!==undefined){ opts.headers["Content-Type"]="application/json"; opts.body=JSON.stringify(body); }
  const res = await fetch(path, opts);
  let data={};
  try{ data = await res.json(); }catch(e){}
  if(!res.ok) throw new Error(data.error || ("Erreur serveur ("+res.status+")"));
  return data;
}

/* Fusionne un instantané serveur dans l'état local, met à jour le cache de reconnaissance
   et déclenche les effets (scintillement de construction terminée, bannière de raid subi). */
function applySnapshot(snap){
  const prevState = state;
  serverTimeOffset = snap.serverTime - Date.now()/1000;
  state = snap;
  if(snap.speedMultiplier!=null) adminSpeed = snap.speedMultiplier;
  for(const r of state.reports){
    if(r.kind==="scout" && r.targetId!=null){
      const ex = scoutIntel[r.targetId];
      if(!ex || r.time > ex.time){
        scoutIntel[r.targetId] = { resources:r.resources, troops:r.troops, wallLevel:r.wallLevel, loyalty:r.loyalty, time:r.time, isPlayer:r.isPlayer };
      }
    }
  }
  if(!mapView) mapView = { cx:state.village.x, cy:state.village.y, ppf:26 };
  if(prevState){
    const prevB = prevState.village.buildings;
    for(const k in state.village.buildings){
      if((state.village.buildings[k]||0) > (prevB[k]||0)){
        sparkleUntil[k]=Date.now()+1500;
        Audio.SFX.buildDone();
      }
    }
    const newCount = state.reports.length - prevState.reports.length;
    if(newCount>0 && newCount<=state.reports.length){
      state.reports.slice(0, newCount).forEach(r=>{
        if(r.kind==="defense"){
          const lost = r.winner==="attacker";
          showBanner(lost?("💀 "+(r.source||"Un ennemi")+" a pillé votre village !"):("🛡️ Attaque de "+(r.source||"un ennemi")+" repoussée !"), "raid");
          Audio.SFX[lost?"defeat":"victory"]();
        }
      });
    }
  }
  renderChat();
}

/* Exécute une action serveur, fusionne la réponse et rafraîchit l'affichage ; affiche l'erreur sinon. */
async function doAction(promiseFn, successMsg, sfx){
  try{
    const data = await promiseFn();
    applySnapshot(data.snapshot);
    if(sfx) Audio.SFX[sfx]();
    if(successMsg) toast(successMsg);
    renderTabs(); renderTopBar(); rerenderPreservingInputs(document.getElementById("sidebar"), renderSidebar); renderActiveTabContent();
  }catch(err){
    Audio.SFX.error();
    toast("⚠️ "+err.message);
  }
}

/* Comme doAction, mais pour les routes /api/admin/* : la réponse renvoie aussi la liste des
   joueurs à jour (et parfois le multiplicateur de vitesse), utilisée par le panneau Admin. */
async function adminAction(promiseFn, successMsg){
  try{
    const data = await promiseFn();
    if(data.snapshot) applySnapshot(data.snapshot);
    if(data.players) adminPlayers = data.players;
    if(data.villages) adminVillages = data.villages;
    if(data.missions) adminMissions = data.missions;
    if(data.speedMultiplier!=null) adminSpeed = data.speedMultiplier;
    if(successMsg) toast(successMsg);
    renderTabs(); renderTopBar(); rerenderPreservingInputs(document.getElementById("sidebar"), renderSidebar); renderActiveTabContent();
  }catch(err){
    toast("⚠️ "+err.message);
  }
}

function queueBuild(key){
  const b=BUILDINGS[key];
  const nextLevel=(state.village.buildings[key]||0)+1;
  doAction(()=>apiCall("/api/build","POST",{key}), "Construction ajoutée : "+b.name+" niveau "+nextLevel, "buildQueued");
}

function queueTrain(key, count){
  count=Math.floor(count);
  if(!count || count<=0) return;
  const t=TROOPS[key];
  doAction(()=>apiCall("/api/train","POST",{key, count}), count+" "+t.name+"(s) mis en formation.", "trainQueued");
}

function disbandTroops(key, count){
  count=Math.floor(count);
  if(!count || count<=0) return;
  const t=TROOPS[key];
  const have=state.village.troops[key]||0;
  if(count>have){ toast("Vous n'avez que "+have+" "+t.name+"(s) dans ce village."); return; }
  if(!confirm("Licencier "+count+" "+t.name+"(s) ? Ces troupes seront définitivement détruites, sans remboursement.")) return;
  doAction(()=>apiCall("/api/troops/disband","POST",{key, count}), count+" "+t.name+"(s) licencié(s).", null);
}

function sendMission(villageId, kind){
  const troops={};
  let any=false;
  for(const k of TROOP_ORDER){
    const el=document.getElementById("send_"+villageId+"_"+k);
    if(!el) continue;
    let n=Math.floor(Number(el.value)||0);
    n=Math.max(0, Math.min(n, state.village.troops[k]||0));
    if(k==="noble") n=Math.min(n,1); // un seul noble par attaque (le serveur l'impose aussi)
    if(n>0){ troops[k]=n; any=true; }
  }
  if(!any){ toast("Sélectionnez au moins une troupe à envoyer."); return false; }
  if(kind==="scout" && !troops.scout){ toast("Une reconnaissance nécessite au moins un éclaireur."); return false; }
  const target=state.villages.find(v=>v.id===villageId);
  if(kind==="support"){
    doAction(
      ()=>apiCall("/api/support/send","POST",{targetId:villageId, troops}),
      "🤝 Renfort envoyé"+(target?(" vers "+target.name+" ("+target.x+"|"+target.y+")"):"")+".",
      "depart"
    );
    return true;
  }
  doAction(
    ()=>apiCall("/api/mission","POST",{targetId:villageId, kind, troops}),
    (kind==="attack"?"⚔️ Attaque":"🔭 Reconnaissance")+" envoyée"+(target?(" vers "+target.name+" ("+target.x+"|"+target.y+")"):"")+".",
    "depart"
  );
  return true;
}

function sendGift(villageId){
  const target=state.villages.find(v=>v.id===villageId);
  if(!target || !target.isPlayer){ toast("Cible invalide."); return false; }
  const amt={};
  let any=false;
  for(const r of ["wood","clay","iron"]){
    const el=document.getElementById("gift_"+villageId+"_"+r);
    if(!el) continue;
    let n=Math.floor(Number(el.value)||0);
    n=Math.max(0, Math.min(n, Math.floor(state.village.resources[r]||0)));
    if(n>0){ amt[r]=n; any=true; }
  }
  if(!any){ toast("Indiquez au moins une ressource à donner."); return false; }
  doAction(
    ()=>apiCall("/api/gift","POST",{username:target.owner, wood:amt.wood||0, clay:amt.clay||0, iron:amt.iron||0}),
    "🎁 Don envoyé à "+target.owner+".",
    null
  );
  return true;
}

/* ============================= SYNCHRONISATION AVEC LE SERVEUR ============================= */

/* Ré-affiche le contenu de l'onglet actif en préservant la valeur et le focus des champs
   <input> déjà présents, pour ne pas effacer une saisie en cours (troupes à envoyer, quantité
   à entraîner, saut de coordonnées...) quand un rafraîchissement périodique arrive. */
function rerenderPreservingInputs(containerEl, renderFn){
  const focused=document.activeElement;
  const focusedId = (focused && containerEl.contains(focused)) ? focused.id : null;
  const focusedSelStart = focused && typeof focused.selectionStart==="number" ? focused.selectionStart : null;
  const values={};
  containerEl.querySelectorAll("input, textarea, select").forEach(inp=>{ if(inp.id) values[inp.id]=inp.value; });
  renderFn();
  // Restaure les <select> AVANT toute autre logique dépendante (attachAdminHandlers, appelé
  // depuis renderFn, a pu se synchroniser sur la valeur par défaut du <select> fraîchement
  // recréé) : on redéclenche un "change" après restauration pour que les gestionnaires qui en
  // dépendent (ex. affichage conditionnel du formulaire d'évènement) se remettent à jour.
  containerEl.querySelectorAll("select").forEach(sel=>{
    if(sel.id && values[sel.id]!==undefined && sel.value!==values[sel.id]){
      sel.value=values[sel.id];
      sel.dispatchEvent(new Event("change", { bubbles:true }));
    }
  });
  containerEl.querySelectorAll("input, textarea").forEach(inp=>{ if(inp.id && values[inp.id]!==undefined) inp.value=values[inp.id]; });
  if(focusedId){
    const el=document.getElementById(focusedId);
    if(el){
      el.focus();
      if(focusedSelStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(focusedSelStart, focusedSelStart); }catch(e){} }
    }
  }
}

async function pollState(){
  if(!authToken) return;
  try{
    const data = await apiCall("/api/state","GET");
    applySnapshot(data.snapshot);
    renderTabs();
    updateTopBarStats();
    rerenderPreservingInputs(document.getElementById("sidebar"), renderSidebar);
    rerenderPreservingInputs(document.getElementById("tabContent"), renderActiveTabContent);
  }catch(err){
    // session expirée ou serveur momentanément injoignable : on retentera au prochain sondage
    if(/session|reconnect/i.test(err.message||"")) logout(true);
  }
}

function startPolling(){
  if(pollHandle) clearInterval(pollHandle);
  pollHandle=setInterval(pollState, 2500);
}

function stopPolling(){
  if(pollHandle){ clearInterval(pollHandle); pollHandle=null; }
}

async function doLogin(u,p){
  try{
    const data=await apiCall("/api/login","POST",{username:u, password:p});
    enterGame(data);
  }catch(err){ renderAuthScreen("login", err.message); }
}
async function doRegister(u,p){
  try{
    const data=await apiCall("/api/register","POST",{username:u, password:p});
    enterGame(data);
  }catch(err){ renderAuthScreen("register", err.message); }
}

function enterGame(data){
  authToken=data.token;
  username=data.username;
  localStorage.setItem("ct_token", authToken);
  localStorage.setItem("ct_username", username);
  applySnapshot(data.snapshot);
  document.getElementById("authScreen").innerHTML="";
  document.getElementById("gameRoot").style.display="";
  renderAll();
  startPolling();
  if(!localStorage.getItem("ct_tutorial_"+username)) renderTutorial();
  document.addEventListener("click", function unlockAudio(){
    Audio.ensureCtx();
    document.removeEventListener("click", unlockAudio);
  }, {once:true});
}

function logout(silent){
  stopPolling();
  authToken=null; username=null; state=null; mapView=null; scoutIntel={}; mapDragging=false;
  adminPlayers=null; adminSelected=null; adminPlayerFilter=""; adminMissions=null; reportFilter="all";
  adminVillages=null; adminSelectedVillageId=null; adminVillageFilter=""; adminBulkScope="all";
  guildDirectory=null; guildDiplomacyForm=null; guildSubTab="overview";
  empireSubTab="apercu"; empireSelectedVillageId=null;
  localStorage.removeItem("ct_token"); localStorage.removeItem("ct_username");
  document.getElementById("gameRoot").style.display="none";
  document.getElementById("tutorialModal").innerHTML="";
  document.getElementById("chatWidget").innerHTML="";
  renderAuthScreen("login", silent?"Session expirée, reconnectez-vous.":"");
}

async function tryResumeSession(){
  const savedToken=localStorage.getItem("ct_token"), savedUser=localStorage.getItem("ct_username");
  if(!savedToken || !savedUser){ renderAuthScreen("login"); return; }
  authToken=savedToken; username=savedUser;
  try{
    const data=await apiCall("/api/state","GET");
    enterGame({ token:savedToken, username:savedUser, snapshot:data.snapshot });
  }catch(err){
    authToken=null; username=null;
    localStorage.removeItem("ct_token"); localStorage.removeItem("ct_username");
    renderAuthScreen("login");
  }
}

function goToVillageOnMap(villageId){

function startRenameVillage(){
  const row=document.querySelector(".village-title .name-row");
  if(!row || row.querySelector("input")) return;
  const v=state.village;
  const current=v.name;
  row.innerHTML = `<input type="text" id="villageNameInput" maxlength="30" value="${current.replace(/"/g,'&quot;')}">`;
  const input=document.getElementById("villageNameInput");
  input.focus();
  input.select();
  const commit=()=>{
    const val=input.value.trim();
    if(val && val!==current) commitRename(val.slice(0,30));
    else renderTopBar();
  };
  input.addEventListener("keydown", e=>{
    if(e.key==="Enter"){ commit(); }
    else if(e.key==="Escape"){ renderTopBar(); }
  });
  input.addEventListener("blur", commit);
}

/* Gisement riche (voir resourceBonus, gameLogic.js/store.js) : +10% de production sur UNE ressource
   tirée au hasard, propre à ce village barbare précis, conservé après conquête. N'affecte jamais les
   autres villages du même joueur. resProdRate() ne fait qu'ANTICIPER côté client ce que le serveur
   calcule réellement (comme prodPerHour seul seul l'était déjà avant l'ajout des gisements) : cette
   estimation n'inclut toujours pas les autres multiplicateurs serveur (vitesse, guilde, évènements). */
function villageResourceBonus(r){
  const v=state.village;
  return (v.resourceBonus && v.resourceBonus.res===r) ? v.resourceBonus : null;
}
function resProdRate(r){
  const v=state.village;
  const bonus=villageResourceBonus(r);
  return prodPerHour(r, v.buildings[r]) * (bonus ? (1+bonus.pct) : 1);
}

/* Met à jour uniquement les chiffres de la barre du haut (ressources, population, nom),
   sans reconstruire les boutons — appelé à chaque sondage périodique pour ne pas interrompre
   une saisie de renommage en cours. */
function updateTopBarStats(){
  if(!state) return;
  const v=state.village;
  const cap=storageCap(v.buildings.warehouse);
  const pop=popUsed(), popMax=farmCap(v.buildings.farm);
  for(const r of ["wood","clay","iron"]){
    const box=document.getElementById("resBox_"+r), val=document.getElementById("resVal_"+r), rate=document.getElementById("resRate_"+r);
    if(!box||!val||!rate) continue;
    box.classList.toggle("warn", v.resources[r]>=cap-1);
    val.innerHTML = `${RES_ICON[r]} ${fmt(v.resources[r])}<span style="color:var(--text-dim);font-weight:normal;">/${fmt(cap)}</span>`;
    const bonus=villageResourceBonus(r);
    rate.textContent = `+${fmt(resProdRate(r))}/h${bonus?' ⭐':''}`;
  }
  const popEl=document.getElementById("popVal");
  if(popEl) popEl.textContent = `👥 ${pop}/${popMax}`;
  const nameEl=document.getElementById("villageNameDisplay");
  if(nameEl && !document.getElementById("villageNameInput")) nameEl.textContent = "🏰 "+v.name;
}

function renderTabs(){
  // Aide, Succès, Admin et Mises à jour sont regroupés dans l'onglet "Informations" (sous-onglets,
  // voir renderInformation) plutôt que d'occuper chacun une place dans la navigation de gauche.
  const tabs=[["buildings","🏗️ Bâtiments"],["barracks","⚔️ Caserne"],["commander","🎖️ Commandant"+(state.commander?(" (niv. "+state.commander.level+")"):"")],["map","🗺️ Carte"],["guild","👥 Guilde"+(state.guild?(" — "+state.guild.tag):"")],["market","🏪 Marché"+((state.market||[]).length?(" ("+state.market.length+")"):"")],["leaderboard","🏆 Classement"],["reports","📜 Rapports ("+state.reports.length+")"]];
  // Panneau "Empire" (gestion groupée de tous ses villages, comme le propose Tribal Wars) : n'apparaît
  // qu'à partir de 2 villages possédés — inutile (et vide) avec un seul village.
  if(state.myVillages && state.myVillages.length>=2) tabs.push(["empire","🏰 Empire ("+state.myVillages.length+")"]);
  tabs.push(["information","ℹ️ Informations"]);
  const nav=document.getElementById("tabs");
  nav.innerHTML = tabs.map(([k,label])=>`<button data-tab="${k}" class="${activeTab===k?'active':''}">${label}</button>`).join("");
  nav.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    // Ferme la fenêtre de mission en changeant d'onglet : elle vit hors de #tabContent
    // (comme la fiche joueur) et resterait sinon affichée par-dessus le nouvel onglet.
    if(b.dataset.tab!==activeTab) closeVillageAction();
    activeTab=b.dataset.tab; renderTabs(); renderActiveTabContent();
  });
}

function fmtTroops(troops){
  return TROOP_ORDER.filter(k=>(troops[k]||0)>0).map(k=>TROOPS[k].name+" "+troops[k]).join(", ") || "aucune";
}

function renderSidebar(){
  const side=document.getElementById("sidebar");
  const now=estimateNow();
  const v=state.village;
  const cap=storageCap(v.buildings.warehouse);
  const pop=popUsed(), popMax=farmCap(v.buildings.farm);
  const resBox = `
    <div class="box res-box">
      <h3>💰 Ressources</h3>
      <div class="res-group">
        ${["wood","clay","iron"].map(r=>{
          const bonus=villageResourceBonus(r);
          return `
          <div class="res ${v.resources[r]>=cap-1?'warn':''} ${bonus?'bonus':''}" id="resBox_${r}" ${bonus?`title="Gisement riche : +${Math.round(bonus.pct*100)}% de production de ${RES_NAME[r].toLowerCase()} dans ce village."`:''}>
            <div class="val" id="resVal_${r}">${RES_ICON[r]} ${fmt(v.resources[r])}<span style="color:var(--text-dim);font-weight:normal;">/${fmt(cap)}</span></div>
            <div class="rate" id="resRate_${r}">+${fmt(resProdRate(r))}/h${bonus?' ⭐':''}</div>
          </div>`;
        }).join("")}
        <div class="res"><div class="val" id="popVal">👥 ${pop}/${popMax}</div><div class="rate">population</div></div>
      </div>
    </div>`;
  const bq=state.village.buildQueue.map((item,i)=>{
    const b=BUILDINGS[item.key];
    const timeLeft=Math.max(0, item.startAt+item.duration-now);
    const pct=100*(1-timeLeft/item.duration);
    return `<div class="queue-item"><div class="flex-between"><span>${b.name} → niv. ${item.level}</span><span>${fmtTime(timeLeft)} <a href="#" data-cancel-build="${i}" title="Annuler (remboursé)" style="margin-left:6px;">✖</a></span></div><div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div></div>`;
  }).join("") || `<div class="muted small">File vide.</div>`;

  const tq=state.village.trainQueue.map(o=>{
    const timeLeft=Math.max(0, o.unitStartAt+o.unitDuration-now);
    return `<div class="queue-item"><div class="flex-between"><span>${TROOPS[o.troop].name} ×${o.count}</span><span>${fmtTime(timeLeft)} / unité</span></div></div>`;
  }).join("") || `<div class="muted small">File vide.</div>`;

  const activeMissions=state.missions.filter(m=>m.kind!=="raid");
  const incomingRaids=state.missions.filter(m=>m.kind==="raid" && !m.resolveDone);
  const MISSION_LABEL = { attack:"⚔️ Attaque", scout:"🔭 Reconnaissance", support:"🤝 Soutien", supportReturn:"🤝 Soutien" };

  const missions=activeMissions.map(m=>{
    const target=state.villages.find(v=>v.id===m.targetId);
    const source=state.villages.find(v=>v.id===m.sourceVillageId);
    const label = MISSION_LABEL[m.kind]||m.kind;
    let phase, remain, destName;
    // Une mission annulée (voir cancelMission / doCancelMission) reste kind "attack"/"scout" mais
    // repart vers son village D'ORIGINE, pas la cible initiale — d'où un libellé et une destination
    // différents des autres phases de retour (ex. après un combat réellement résolu).
    if(m.cancelled){ phase="annulée, retour vers"; remain=m.returnAt-now; destName=source?source.name:'?'; }
    else if(m.kind==="supportReturn"){ phase="revient vers"; remain=m.returnAt-now; destName=target?target.name:'?'; }
    else if(!m.resolveDone){ phase="en route vers"; remain=m.arriveAt-now; destName=target?target.name:'?'; }
    else { phase="retour de"; remain=m.returnAt-now; destName=target?target.name:'?'; }
    const canCancel = (m.kind==="attack"||m.kind==="scout") && !m.resolveDone;
    return `<div class="mission-item"><div class="flex-between"><span>${label} ${phase} ${escapeHtml(destName)}</span><span>${fmtTime(remain)}${canCancel?` <a href="#" data-cancel-mission="${m.id}" title="Annuler : les troupes font demi-tour immédiatement." style="margin-left:6px;">✖</a>`:''}</span></div></div>`;
  }).join("") || `<div class="muted small">Aucune troupe en mission.</div>`;

  const enemyBox = incomingRaids.length ? `
    <div class="box" style="border-color:#8a3226;"><h3>🚨 Attaques entrantes</h3>${incomingRaids.map(m=>{
      const remain=m.arriveAt-now;
      return `<div class="mission-item"><div class="flex-between"><span>${m.raidSourceName||'Village barbare'} approche</span><span>${fmtTime(remain)}</span></div></div>`;
    }).join("")}</div>` : '';

  // Attaques/reconnaissances lancées par D'AUTRES JOUEURS et actuellement en approche vers l'un de mes
  // villages (voir incomingAttacks, buildSnapshot côté serveur) : jusqu'ici seules les ripostes
  // barbares (ci-dessus) étaient visibles avant impact, une vraie attaque adverse restait invisible
  // tant que le rapport de combat n'arrivait pas (bug/besoin corrigé).
  const incomingPlayerAttacks = state.incomingAttacks||[];
  const playerAttackBox = incomingPlayerAttacks.length ? `
    <div class="box" style="border-color:#8a3226;"><h3>⚔️ Attaques ennemies entrantes</h3>${incomingPlayerAttacks.map(m=>{
      const remain=m.arriveAt-now;
      const label = m.kind==="scout" ? "🔭 Reconnaissance" : "⚔️ Attaque";
      return `<div class="mission-item"><div class="flex-between"><span>${label} de <b>${escapeHtml(m.attackerUsername)}</b> vers ${escapeHtml(m.targetName||'?')}</span><span>${fmtTime(remain)}</span></div><div class="small muted">Depuis ${escapeHtml(m.sourceName||'?')} (${m.sourceCoord||'?'})</div></div>`;
    }).join("")}</div>` : '';

  const incomingSupport = state.village.support||[];
  const supportInBox = incomingSupport.length ? `
    <div class="box"><h3>🤝 Renforts reçus</h3>${incomingSupport.map(s=>`
      <div class="mission-item"><div class="flex-between"><span>De ${escapeHtml(s.from)}</span><span class="small muted">${fmtTroops(s.troops)}</span></div></div>
    `).join("")}</div>` : '';

  const mySupport = state.mySupport||[];
  const supportOutBox = mySupport.length ? `
    <div class="box"><h3>🤝 Vos renforts envoyés</h3>${mySupport.map(s=>`
      <div class="mission-item">
        <div class="flex-between"><span>Chez ${escapeHtml(s.atVillageName)} (${s.atCoord})</span><a href="#" data-recall-support="${s.id}">↩️ Rappeler</a></div>
        <div class="small muted">${fmtTroops(s.troops)}</div>
      </div>
    `).join("")}</div>` : '';

  const activeEvents = state.serverEvents||[];
  const eventsBox = activeEvents.length ? `
    <div class="box" style="border-color:var(--gold);">
      <h3>🎉 Évènements en cours</h3>
      <div class="event-badges">
        ${activeEvents.map(e=>`<span class="event-badge" title="${escapeHtml(e.name)} ×${e.multiplier} — encore ${fmtTime(e.remainingSec)}">${e.icon}<span class="event-badge-mult">×${e.multiplier}</span></span>`).join("")}

  const ba = state.blackArmyEvent;
  const blackArmyBox = (ba && ba.active) ? `
    <div class="box" style="border-color:#9a2b2b; background:linear-gradient(180deg, rgba(20,20,24,.55), rgba(20,20,24,.15)); box-shadow:0 0 14px rgba(154,43,43,.25);">
      <h3 style="margin-top:0;">🏴 L'Armée Noire</h3>
      <p class="small" style="margin:2px 0 4px;">Repérez les villages <b>noirs</b> sur la carte — encore <b>${fmtTime(ba.remainingSec)}</b> avant leur retrait.</p>
      <p class="small muted" style="margin:0;">${fmt(ba.defeatedCount)} campement${ba.defeatedCount>1?'s':''} vaincu${ba.defeatedCount>1?'s':''} par la communauté · <a href="#" data-open-blackarmy-help="1">règles de l'évènement</a></p>
    </div>` : '';

  side.innerHTML = `
    ${blackArmyBox}
    ${eventsBox}
    ${resBox}
    <div class="box"><h3>🏗️ File de construction</h3>${bq}</div>
    <div class="box"><h3>⚔️ File d'entraînement</h3>${tq}</div>
    <div class="box"><h3>🚩 Missions en cours</h3>${missions}</div>
    ${enemyBox}
    ${playerAttackBox}
    ${supportInBox}
    ${supportOutBox}
  `;

  side.querySelectorAll("[data-cancel-build]").forEach(el=>el.onclick=(e)=>{
    e.preventDefault();
    const index=Number(el.dataset.cancelBuild);

  });
  side.querySelectorAll("[data-cancel-mission]").forEach(el=>el.onclick=(e)=>{
    e.preventDefault();

  side.querySelectorAll("[data-recall-support]").forEach(el=>el.onclick=(e)=>{

  });
  const openBlackArmyHelp = side.querySelector("[data-open-blackarmy-help]");
  if(openBlackArmyHelp) openBlackArmyHelp.onclick=(e)=>{
    e.preventDefault();
    closeVillageAction();
    activeTab="information"; infoSubTab="help"; renderTabs(); renderActiveTabContent();
    setTimeout(()=>{ document.getElementById("helpBlackArmy")?.scrollIntoView({behavior:"smooth", block:"start"}); }, 30);
  };
}

/* Widget de chat flottant, indépendant du système d'onglets : reconstruit la coquille (ouvert/fermé,
   apparition/disparition de l'onglet Guilde) seulement quand cet état structurel change, et se
   contente sinon de rafraîchir la liste des messages et l'onglet actif, pour ne jamais couper la
   saisie en cours dans le champ de texte quand un rafraîchissement périodique arrive (même principe
   que pour la carte et le reste du site, voir rerenderPreservingInputs). */
function renderChat(){
  if(!state) return;
  const el=document.getElementById("chatWidget");
  if(!el) return;
  const hasGuild = !!state.guild;
  if(!hasGuild) chatChannel="global"; // on ne peut pas rester sur un onglet Guilde qui a disparu

  if(chatOpen && el.querySelector(".chat-panel")){
    const hadGuildTab = !!el.querySelector('[data-chat-channel="guild"]');
    if(hadGuildTab===hasGuild){ updateChatTabs(); updateChatMessages(); return; }
  } else if(!chatOpen && el.querySelector(".chat-bubble")){
    return;
  }

  if(chatOpen){
    el.innerHTML = `
      <div class="chat-panel">
        <div class="chat-head">
          <span>💬 Chat</span>
          <button class="chat-toggle" id="chatCollapseBtn" title="Réduire">➖</button>
        </div>
        <div class="chat-tabs">
          <button class="chat-tab" data-chat-channel="global">🌍 Mondial</button>
          ${hasGuild ? `<button class="chat-tab" data-chat-channel="guild">🛡️ Guilde${state.guild.tag?(' ['+escapeHtml(state.guild.tag)+']'):''}</button>` : ""}
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <form id="chatForm" class="chat-form">
          <input type="text" id="chatInput" maxlength="300" placeholder="Écrire un message…" autocomplete="off">
          <span class="chat-charcount" id="chatCharCount">0/300</span>
          <button type="submit">➤</button>
        </form>
      </div>`;
    updateChatTabs();
    updateChatMessages();
    document.getElementById("chatCollapseBtn").onclick=()=>{ chatOpen=false; renderChat(); };
    document.getElementById("chatForm").onsubmit=(e)=>{ e.preventDefault(); sendChat(); };
    document.getElementById("chatInput").oninput=(e)=>{
      const cc=document.getElementById("chatCharCount");
      if(cc) cc.textContent=e.target.value.length+"/300";
    };
    el.querySelectorAll("[data-chat-channel]").forEach(btn=>btn.onclick=()=>{
      chatChannel=btn.dataset.chatChannel;
      updateChatTabs();
      updateChatMessages();
    });
    // Délégation sur le conteneur des messages : un clic sur un pseudo ouvre sa fiche joueur,
    // sans avoir besoin de réattacher un gestionnaire à chaque nouveau message reçu.
    document.getElementById("chatMessages").addEventListener("click", (e)=>{
      const link=e.target.closest("[data-open-profile]");
      if(link) openPlayerProfile(link.dataset.openProfile);
    });
  } else {
    el.innerHTML = `<button class="chat-bubble" id="chatExpandBtn" title="Ouvrir le chat">💬</button>`;
    document.getElementById("chatExpandBtn").onclick=()=>{ chatOpen=true; renderChat(); };
  }
}

function updateChatTabs(){
  const el=document.getElementById("chatWidget");
  if(!el) return;
  el.querySelectorAll("[data-chat-channel]").forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.chatChannel===chatChannel);
  });
}

function updateChatMessages(){
  const box=document.getElementById("chatMessages");
  if(!box || !state) return;
  const messages = chatChannel==="guild" ? (state.guildChat||[]) : (state.chat||[]);
  const nearBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 20;
  box.innerHTML = messages.length
    ? messages.map(m=>{
        const isAnnounce = m.kind==="announce";
        const nameCls = "chat-user"+(m.isAdmin?" admin-name":"");
        return `<div class="chat-msg${isAnnounce?' announce':''}${m.username===username?' me':''}">
          <span class="chat-time">${fmtClock(m.time)}</span>
          ${isAnnounce?'<span class="chat-announce-icon">📢</span>':''}
          <span class="${nameCls}" data-open-profile="${escapeHtml(m.username)}">${escapeHtml(m.username)}</span>
          <span class="chat-text">${escapeHtml(m.text)}</span>
        </div>`;
      }).join("")
    : `<div class="muted small" style="padding:8px;">${chatChannel==="guild"?"Aucun message dans le chat de guilde pour l'instant.":"Aucun message pour l'instant. Dites bonjour !"}</div>`;
  if(nearBottom) box.scrollTop = box.scrollHeight;
}

function renderActiveTabContent(){
  // Ne jamais recréer la carte pendant un glissé en cours : sinon le sondage périodique
  // (toutes les 2,5s) remplace #mapCanvas en plein milieu du drag et le bloque (bug corrigé).
  if(activeTab==="map" && mapDragging) return;
  const main=document.getElementById("tabContent");
  // Repli si l'onglet Empire était actif mais qu'on n'a plus 2 villages (conquête perdue entre-temps) :
  // évite un onglet actif fantôme, absent de la navigation, qui resterait affiché vide.
  if(activeTab==="empire" && (!state.myVillages || state.myVillages.length<2)) activeTab="buildings";
  if(activeTab==="buildings") main.innerHTML=renderBuildings();
  else if(activeTab==="barracks") main.innerHTML=renderBarracks();
  else if(activeTab==="commander") main.innerHTML=renderCommander();
  else if(activeTab==="leaderboard") main.innerHTML=renderLeaderboard();
  else if(activeTab==="map") main.innerHTML=renderMap();
  else if(activeTab==="reports") main.innerHTML=renderReports();
  else if(activeTab==="guild") main.innerHTML=renderGuild();
  else if(activeTab==="market") main.innerHTML=renderMarket();
  else if(activeTab==="empire") main.innerHTML=renderEmpire();
  else main.innerHTML=renderInformation(); // "information" et tout état inconnu retombent ici (comme "help" avant)
  attachTabHandlers();
  if(activeTab==="map"){ positionMapWorld(); drawMapInfluence(); drawMapAttackLines(); attachMapHandlers(); }
  if(activeTab==="guild"){
    attachGuildHandlers();
    if(state.guild && state.guild.isLeader && guildSubTab==="diplomacy" && !guildDirectory) refreshGuildDirectory();
  }
  if(activeTab==="market") attachMarketHandlers();
  if(activeTab==="empire") attachEmpireHandlers();
  if(activeTab==="information" && infoSubTab==="admin" && state.isAdmin){
    attachAdminHandlers();
    if(!adminPlayers) refreshAdminData();
  }
}
