<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conquête Tribale — jeu de stratégie navigateur</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%B0%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#1b1d20; --bg2:#24272b; --panel:#2c3034; --panel2:#383d42;
    --border:#565c63; --text:#ece7dd; --text-dim:#a3a8ad; --gold:#c1793e;
    --green:#6bab5e; --red:#c15b46; --blue:#5b93b0;
    --shadow-sm:0 2px 6px rgba(0,0,0,.3);
    --shadow-md:0 4px 16px rgba(0,0,0,.35);
    --shadow-lg:0 8px 28px rgba(0,0,0,.45);
    --ring:0 0 0 3px rgba(193,121,62,.24);
    --radius-sm:8px; --radius-md:12px; --radius-lg:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:Georgia,'Times New Roman',serif; background:var(--bg);
    color:var(--text); background-image:radial-gradient(ellipse at top, #24272b 0%, #121315 100%);
    min-height:100vh;
  }
  #gameRoot{display:flex; flex-direction:column; min-height:100vh;}
  .app-shell{display:flex; align-items:flex-start; flex:1 1 auto; min-height:0;}
  #app{flex:1 1 0; min-width:0; max-width:1200px; margin:0 auto; padding:10px 14px 40px;}
  h1,h2,h3{font-family:Georgia,serif;color:var(--gold);margin:0 0 8px;}
  a{color:var(--blue);}
  ::-webkit-scrollbar{width:11px; height:11px;}
  ::-webkit-scrollbar-track{background:var(--bg2);}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px; border:2px solid var(--bg2);}
  ::-webkit-scrollbar-thumb:hover{background:var(--gold);}
  button{
    font-family:inherit; background:linear-gradient(180deg,#41454a,#2f3337); color:var(--text);
    border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px 14px; cursor:pointer;
    font-size:13px; font-weight:600; letter-spacing:.2px;
    box-shadow:var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,.05);
    transition:transform .12s ease, box-shadow .15s ease, border-color .15s ease, background .15s ease;
  }
  button:hover:not(:disabled){
    background:linear-gradient(180deg,#4d5257,#393e43); border-color:var(--gold);
    transform:translateY(-1px); box-shadow:var(--shadow-md);
  }
  button:active:not(:disabled){transform:translateY(0); box-shadow:var(--shadow-sm);}
  button:focus-visible{outline:none; box-shadow:var(--shadow-sm), var(--ring);}
  button:disabled{opacity:.4; cursor:not-allowed; transform:none;}
  button.primary{background:linear-gradient(180deg,#a3703c,#7d5228); border-color:var(--gold); font-weight:bold;}
  button.danger{background:linear-gradient(180deg,#7a2e24,#5c2018); border-color:#a55;}
  input[type=number]{
    width:70px; background:#1b1d20; color:var(--text); border:1px solid var(--border);
    border-radius:7px; padding:6px 8px; font-family:inherit;
    box-shadow:inset 0 1px 4px rgba(0,0,0,.4);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input[type=number]:focus{outline:none; border-color:var(--gold); box-shadow:inset 0 1px 4px rgba(0,0,0,.4), var(--ring);}
  input[type=text]{
    background:#1b1d20; color:var(--text); border:1px solid var(--border);
    border-radius:7px; padding:6px 8px; font-family:inherit;
    box-shadow:inset 0 1px 4px rgba(0,0,0,.4);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input[type=text]:focus{outline:none; border-color:var(--gold); box-shadow:inset 0 1px 4px rgba(0,0,0,.4), var(--ring);}
  input[type=password]{
    background:#1b1d20; color:var(--text); border:1px solid var(--border);
    border-radius:7px; padding:6px 8px; font-family:inherit; width:100%; box-sizing:border-box;
    box-shadow:inset 0 1px 4px rgba(0,0,0,.4);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input[type=password]:focus{outline:none; border-color:var(--gold); box-shadow:inset 0 1px 4px rgba(0,0,0,.4), var(--ring);}
  #authScreen input[type=text]{width:100%; box-sizing:border-box;}
  #authScreen label.small{display:flex; flex-direction:column; gap:4px; color:var(--text-dim);}
  #authTabs button.ghost{background:transparent; box-shadow:none;}
  select{
    background:#1b1d20;color:var(--text);border:1px solid var(--border);border-radius:7px;padding:6px 8px;font-family:inherit;
    box-shadow:inset 0 1px 4px rgba(0,0,0,.4);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  select:focus{outline:none; border-color:var(--gold); box-shadow:inset 0 1px 4px rgba(0,0,0,.4), var(--ring);}

  header#topbar{
    display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:space-between;
    background:linear-gradient(180deg, rgba(44,48,52,.94), rgba(36,39,43,.94));
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border:1px solid var(--border); border-radius:var(--radius-lg); padding:10px 18px; margin:14px 0;
    position:sticky; top:6px; z-index:20; box-shadow:var(--shadow-md);
  }
  .res-group{display:flex; gap:16px; flex-wrap:wrap;}
  .res{display:flex; flex-direction:column; align-items:center; min-width:64px; padding:4px 8px; border-radius:8px; transition:background .15s ease;}
  .res:hover{background:rgba(0,0,0,.15);}
  .res .val{font-weight:bold; font-size:14px;}
  .res .rate{font-size:10px; color:var(--text-dim);}
  .res.warn .val{color:var(--red);}
  .res-box .res-group{display:grid; grid-template-columns:1fr 1fr; gap:8px 6px;}
  .res-box .res{align-items:flex-start; min-width:0; width:100%; padding:6px 8px;}
  .res-box .res .val{font-size:13px; white-space:nowrap;}
  .topbar-right{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .village-title{display:flex; flex-direction:column;}
  .village-title .name{font-weight:bold; color:var(--gold);}
  .village-title .coord{font-size:11px; color:var(--text-dim);}
  .village-title .name-row{display:flex; align-items:center; gap:6px;}
  .btn-rename{background:transparent; border:none; box-shadow:none; padding:2px 4px; font-size:12px; opacity:.6; cursor:pointer;}
  .btn-rename:hover{opacity:1; transform:none; background:transparent; box-shadow:none;}
  .village-title input[type=text]{font-weight:bold; color:var(--gold); padding:2px 6px; width:160px; font-size:14px;}

  /* ---- Logo centré en haut de page ---- */
  .top-banner{
    display:flex; align-items:center; justify-content:center; gap:12px; padding:14px 18px;
    background:linear-gradient(180deg, rgba(44,48,52,.97), rgba(36,39,43,.97));
    border-bottom:1px solid var(--border); box-shadow:var(--shadow-sm); position:relative; z-index:26;
  }
  .top-banner svg{width:34px; height:40px; flex:0 0 auto; overflow:visible;}
  .top-banner .brand-name{font-family:Georgia,serif; color:var(--gold); font-weight:bold; font-size:20px; letter-spacing:1.5px; text-transform:uppercase;}

  /* ---- Barre latérale de navigation (architecture "dashboard moderne") ---- */
  .side-nav{
    flex:0 0 224px; position:sticky; top:0; align-self:flex-start; height:100%; overflow-y:auto;
    display:flex; flex-direction:column; gap:10px; padding:18px 12px 24px;
    background:linear-gradient(180deg, rgba(44,48,52,.97), rgba(28,30,33,.97));
    border-right:1px solid var(--border); box-shadow:var(--shadow-md); z-index:25;
  }
  nav#tabs{
    display:flex; flex-direction:column; gap:3px;
  }
  nav#tabs button{
    border-radius:var(--radius-sm); border-color:transparent; border-left:3px solid transparent; background:transparent; box-shadow:none;
    color:var(--text-dim); text-align:left; justify-content:flex-start; display:flex; align-items:center; gap:8px;
    padding:10px 11px; font-size:13px; width:100%;
  }
  nav#tabs button:hover:not(.active){background:rgba(193,121,62,.12); border-color:transparent; border-left-color:transparent; color:var(--text); transform:none; box-shadow:none;}
  nav#tabs button.active{background:var(--panel2); border-color:var(--border); border-left-color:var(--gold); color:var(--gold); font-weight:bold; box-shadow:var(--shadow-sm);}

  .layout{display:flex; gap:14px; align-items:flex-start;}
  main#tabContent{flex:1 1 640px; min-width:0; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-lg); padding:18px; box-shadow:var(--shadow-md);}
  aside#sidebar{flex:0 0 280px; display:flex; flex-direction:column; gap:12px;}
  .box{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-md); padding:12px 14px; box-shadow:var(--shadow-sm);}
  .box h3{font-size:14px; margin-bottom:8px; border-bottom:1px solid var(--border); padding-bottom:6px;}

  .grid-buildings{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px;}

  .village-scene{
    position:relative; width:100%; aspect-ratio:16/10;
    border:2px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; margin-bottom:14px;
    box-shadow:inset 0 0 50px rgba(0,0,0,.55), var(--shadow-md); background:#212c14;
  }
  .village-svg{width:100%; height:100%; display:block;}
  .plot{cursor:pointer;}
  .plot .groundmark{ fill:rgba(0,0,0,.3); transition:fill .15s, filter .15s; }
  .plot:hover .groundmark{ fill:rgba(193,121,62,.22); }
  .plot.selected .groundmark{ fill:rgba(193,121,62,.4); filter:drop-shadow(0 0 8px rgba(193,121,62,.8)); }
  .plot .art{ transition:filter .15s; }
  .plot:hover .art{ filter:brightness(1.14); }
  .plot .empty-art{ filter:grayscale(85%) brightness(.8); opacity:.6; }
  .plot .badge-bg{ fill:var(--gold); stroke:#2a1c10; stroke-width:1.5; }
  .plot .badge-text{ fill:#2a1c10; font-size:15px; font-weight:bold; font-family:Georgia,serif; }
  .plot .label-bg{ fill:rgba(18,14,9,.82); }
  .plot .label-text{ fill:#f0e4cc; font-size:14px; font-weight:bold; font-family:Georgia,serif; }
  .plot .hammer{ font-size:24px; animation:bounce 1s infinite; }
  .dirt-path{ stroke:#8a6a3f; stroke-width:13; stroke-linecap:round; opacity:.45; }
  .wall-ring{ cursor:pointer; transition:filter .15s; }
  .wall-ring:hover{ filter:brightness(1.08); }
  .wall-ring.selected{ filter:drop-shadow(0 0 12px rgba(193,121,62,.7)); }
  @keyframes bounce{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-5px);} }
  .building-detail{ display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap; }
  .building-detail .icon-big{ width:78px; height:78px; display:flex; align-items:center; justify-content:center; background:linear-gradient(180deg,#5c4832,#3d2e1e); border:2px solid var(--gold); border-radius:var(--radius-md); flex:0 0 auto; padding:6px; box-shadow:var(--shadow-sm);}
  .building-detail .icon-big svg{ width:100%; height:100%; overflow:visible; }
  .building-detail .info{flex:1 1 240px;}

  .card{background:var(--panel2); border:1px solid var(--border); border-radius:var(--radius-md); padding:12px; box-shadow:var(--shadow-sm); transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;}
  .card:hover{transform:translateY(-2px); box-shadow:var(--shadow-md); border-color:var(--gold);}
  .card .card-head{display:flex; align-items:center; gap:10px; margin-bottom:4px;}
  .card .icon-mini{width:42px; height:42px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; background:linear-gradient(180deg,#5c4832,#3d2e1e); border:2px solid var(--border); border-radius:9px; padding:4px;}
  .card .icon-mini svg{width:100%; height:100%; overflow:visible;}
  .card .icon-mini.shop-icon{font-size:22px;}
  .free-tag{color:var(--green); font-weight:bold;}
  .card.quest-done{border-color:var(--green); opacity:.75;}
  .card h4{margin:0; color:var(--gold); font-size:15px; display:flex; flex-direction:column; gap:2px;}
  .card .desc{font-size:11px; color:var(--text-dim); margin-bottom:6px; min-height:28px;}
  .card .cost{font-size:11px; margin-bottom:6px;}
  .cost span{margin-right:8px;}
  .cost span.short{color:var(--red);}
  .queue-item, .mission-item{
    border-bottom:1px dashed var(--border); padding:8px 2px; font-size:12px; border-radius:6px; transition:background .15s ease;
  }
  .queue-item:hover, .mission-item:hover{background:rgba(0,0,0,.14);}
  .queue-item:last-child, .mission-item:last-child{border-bottom:none;}
  .bar-bg{background:#1b1d20; border:1px solid var(--border); border-radius:6px; height:9px; overflow:hidden; margin-top:4px; box-shadow:inset 0 1px 3px rgba(0,0,0,.5);}
  .bar-fill{background:linear-gradient(90deg, var(--green), #8fd06a); height:100%; transition:width .2s ease;}
  .troop-row{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 4px; border-bottom:1px dashed var(--border); font-size:12px; border-radius:6px; transition:background .15s ease;}
  .troop-row:hover{background:rgba(0,0,0,.14);}
  .troop-row:last-child{border-bottom:none;}
  .troop-row .tname{font-weight:bold; color:var(--gold); width:110px;}
  .stats-mini{font-size:10px; color:var(--text-dim);}
  table{width:100%; border-collapse:collapse; font-size:12px;}
  th,td{text-align:left; padding:6px 8px; border-bottom:1px solid var(--border);}
  tr{transition:background .15s ease;}
  tbody tr:hover{background:rgba(0,0,0,.14);}
  .tag{display:inline-block; padding:2px 8px; border-radius:20px; font-size:10px; font-weight:bold; letter-spacing:.3px;}
  .tag.weak{background:#2c4a22;color:#a8d98a;}
  .tag.medium{background:#4a3f22;color:#e0c98a;}
  .tag.strong{background:#4a2222;color:#e0a0a0;}
  .send-form{margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); display:none;}
  .send-form.open{display:block; animation:fadeSlideIn .2s ease;}
  @keyframes fadeSlideIn{ 0%{opacity:0; transform:translateY(-4px);} 100%{opacity:1; transform:translateY(0);} }
  .send-form .inputs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px;}
  .send-form .inp{display:flex; flex-direction:column; align-items:center; font-size:10px;}

  .map-toolbar{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; margin-bottom:10px;
    background:rgba(0,0,0,.16); border:1px solid var(--border); border-radius:var(--radius-md); padding:8px 10px;
  }
  .map-toolbar .group{display:flex; gap:6px; align-items:center;}
  .map-toolbar input[type=number]{width:58px;}
  #mapCanvas{
    position:relative; width:100%; height:520px; overflow:hidden; touch-action:none;
    border:2px solid var(--border); border-radius:var(--radius-lg); cursor:grab;
    background:#182210 radial-gradient(ellipse at 50% 40%, #223318 0%, #131b0c 80%);
    box-shadow:inset 0 0 60px rgba(0,0,0,.5), var(--shadow-md);
  }
  #mapCanvas.dragging{cursor:grabbing;}
  #mapWorld{position:absolute;}
  .villagePin{position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; cursor:pointer;}
  .villagePin .dot{
    width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:15px; border:2px solid #1a140d; box-shadow:0 2px 5px rgba(0,0,0,.6);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .villagePin:hover .dot{transform:scale(1.12); box-shadow:0 4px 10px rgba(0,0,0,.7);}
  .villagePin.weak .dot{background:#4d7a37;}
  .villagePin.medium .dot{background:#9a7526;}
  .villagePin.strong .dot{background:#8a3226;}
  .villagePin.player .dot{background:linear-gradient(180deg,#f0cd7c,#b3831f); border-color:var(--gold); font-size:17px;}
  .villagePin.selected .dot{outline:3px solid var(--gold); outline-offset:2px;}
  .villagePin .plabel{
    position:absolute; top:32px; font-size:9px; white-space:nowrap; background:rgba(20,16,10,.85);
    padding:2px 6px; border-radius:6px; color:var(--text); pointer-events:none;
  }
  .troop-marker{
    position:absolute; transform:translate(-50%,-50%); pointer-events:none; z-index:6;
    transition:left 0.95s linear, top 0.95s linear;
  }
  .troop-marker .tdot{
    width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:11px; border:2px solid #1a140d; box-shadow:0 2px 6px rgba(0,0,0,.65);
    animation:marchPulse 1s ease-in-out infinite;
  }
  .troop-marker.marker-attack .tdot{background:linear-gradient(180deg,#c95c4a,#8a3226);}
  .troop-marker.marker-scout .tdot{background:linear-gradient(180deg,#5a9ac0,#2f5f7a);}
  .troop-marker.marker-returning{opacity:.72;}
  @keyframes marchPulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.14);} }
  #villageDetail .box{margin-top:10px;}
  .report{border:1px solid var(--border); border-radius:var(--radius-md); padding:10px 12px; margin-bottom:8px; background:var(--panel2); box-shadow:var(--shadow-sm); transition:box-shadow .15s ease, border-color .15s ease;}
  .report:hover{box-shadow:var(--shadow-md);}
  .report.win{border-left:4px solid var(--green);}
  .report.lose{border-left:4px solid var(--red);}
  .report.scout{border-left:4px solid var(--blue);}
  .report.raid{border-left:4px solid #a5761f;}
  .report .title{font-weight:bold; display:flex; justify-content:space-between;}
  .report .details{font-size:11px; color:var(--text-dim); margin-top:4px; display:none;}
  .report .details.open{display:block; animation:fadeSlideIn .2s ease;}
  #toasts{position:fixed; bottom:14px; right:14px; display:flex; flex-direction:column; gap:8px; z-index:100;}
  .toast{background:var(--panel2); border:1px solid var(--gold); color:var(--text); padding:10px 14px; border-radius:var(--radius-sm); font-size:12px; max-width:280px; box-shadow:var(--shadow-lg);}
  .muted{color:var(--text-dim); font-size:12px;}
  .flex-between{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;}
  .small{font-size:11px;}
  footer{margin-top:20px; text-align:center; color:var(--text-dim); font-size:11px;}
  .req-note{font-size:10px; color:var(--red); margin-top:4px;}
  .unit-note{font-size:10px; color:var(--gold); margin-top:4px;}
  .loyalty-bar{width:120px;}
  .report.defense{border-left:4px solid #7a3fae;}
  .report.announcement{border-left:4px solid var(--gold);}
  .report.support{border-left:4px solid var(--green);}
  .report.gift{border-left:4px solid var(--gold);}
  .report.guild{border-left:4px solid #7a3fae;}
  .report .title .actions{display:flex; align-items:center; gap:8px; font-weight:normal;}
  .report-del{background:none; border:none; cursor:pointer; font-size:13px; opacity:.55; padding:2px 5px; border-radius:4px; line-height:1;}
  .report-del:hover{opacity:1; background:rgba(255,255,255,.08);}
  .report-filters{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
  .filter-btn{background:var(--panel2); border:1px solid var(--border); color:var(--text-dim); border-radius:999px; padding:4px 12px; font-size:11px; cursor:pointer; transition:background .15s ease, color .15s ease, border-color .15s ease;}
  .filter-btn:hover{color:var(--text);}
  .filter-btn.active{background:var(--gold); border-color:var(--gold); color:#2a1c07; font-weight:bold;}

  #battleBanner{
    position:fixed; top:76px; left:50%; transform:translateX(-50%) translateY(-16px);
    background:var(--panel2); border:2px solid var(--gold); border-radius:var(--radius-md); padding:12px 26px;
    font-size:17px; font-weight:bold; color:var(--text); box-shadow:var(--shadow-lg);
    opacity:0; pointer-events:none; z-index:200; transition:opacity .35s, transform .35s; text-align:center;
    max-width:90vw;
  }
  #battleBanner.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  #battleBanner.victory{ border-color:var(--green); }
  #battleBanner.defeat{ border-color:var(--red); }
  #battleBanner.raid{ border-color:#7a3fae; }
  #battleBanner.conquest{ border-color:var(--gold); background:linear-gradient(#4a3a1a,#3d2e1e); animation:conquestGlow 2.4s ease; }
  @keyframes conquestGlow{ 0%,100%{box-shadow:0 6px 20px rgba(0,0,0,.6);} 50%{box-shadow:0 6px 34px rgba(193,121,62,.75);} }
  .sparkle{ font-size:26px; animation:sparklePop 1.4s ease-out forwards; }
  @keyframes sparklePop{ 0%{opacity:0; transform:translateY(0) scale(.6);} 30%{opacity:1; transform:translateY(-10px) scale(1.25);} 100%{opacity:0; transform:translateY(-42px) scale(.9);} }
  #btnMute{font-size:15px;}
  @media(max-width:820px){
    .app-shell{flex-direction:column;}
    .side-nav{
      position:relative; top:auto; height:auto; width:100%; flex-direction:row; align-items:center;
      border-right:none; border-bottom:1px solid var(--border); overflow-x:hidden; overflow-y:visible;
      padding:10px 12px; gap:12px;
    }
    .top-banner{padding:10px 14px;}
    .top-banner svg{width:26px; height:31px;}
    .top-banner .brand-name{font-size:15px; letter-spacing:1px;}
    nav#tabs{flex:1 1 0; min-width:0; flex-direction:row; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:thin;}
    nav#tabs button{white-space:nowrap; flex:0 0 auto; width:auto; border-left:none; border-bottom:3px solid transparent;}

  #tabContent tr.admin-selected{background:rgba(193,121,62,.16);}

/* Muraille circulaire qui entoure tout le village (au lieu d'une simple hutte) — se renforce avec le niveau
   et change de matériau : bois (1-9), pierre (10-19), brique et fer (20+). */
function villageWallRing(level){
  const cx=500, cy=320, rx=420, ry=250;
  const tier = materialTier(level);
  const m = MATERIAL[tier];
  const towerCount = tier===3 ? 12 : tier===2 ? 8 : 6;
  const merlonCount = tier>=2 ? 48 : 30;
  const bannered = tier===3;
  const towers=[];
  for(let i=0;i<towerCount;i++){
    const a=(i/towerCount)*Math.PI*2 - Math.PI/2;
    const x=(cx+rx*Math.cos(a)).toFixed(1), y=(cy+ry*Math.sin(a)).toFixed(1);
    towers.push(`<g transform="translate(${x},${y})">
      <rect x="-15" y="-32" width="30" height="32" fill="${m.wall}" stroke="#2a1c10" stroke-width="2"/>
      <polygon points="-17,-32 0,-48 17,-32" fill="${m.wallDark}" stroke="#2a1c10" stroke-width="2"/>
      ${bannered?`<line x1="0" y1="-48" x2="0" y2="-60" stroke="#2a1c10" stroke-width="2"/><polygon points="0,-60 13,-55 0,-50" fill="#8a2e22"/>`:''}
    </g>`);
  }
  const merlons=[];
  for(let i=0;i<merlonCount;i++){
    const a=(i/merlonCount)*Math.PI*2 - Math.PI/2;
    const x=cx+rx*Math.cos(a), y=cy+ry*Math.sin(a);
    merlons.push(`<rect x="${(x-6).toFixed(1)}" y="${(y-6).toFixed(1)}" width="12" height="12" fill="${m.wallLight}" stroke="#2a1c10" stroke-width="1.5"/>`);
  }
  return `
    <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="#2a1c10" stroke-width="42"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="${m.wallLight}" stroke-width="34"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${rx-9}" ry="${ry-9}" fill="none" stroke="${m.wall}" stroke-width="7" opacity="0.55"/>
    ${merlons.join("")}
    ${towers.join("")}
  `;
}

/* ============================= AMBIANCE SONORE (synthétisée, sans fichier externe) ============================= */

const Audio = (() => {
  let ctx = null, muted = false;
  function ensureCtx(){
    if(!ctx){ const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return null; ctx = new AC(); }
    if(ctx.state==="suspended") ctx.resume();
    return ctx;
  }
  function tone(freq, duration, opts={}){
    if(muted) return;
    const c = ensureCtx(); if(!c) return;
    const osc = c.createOscillator(), gain = c.createGain();
    osc.type = opts.type || "sine";
    osc.frequency.value = freq;
    const vol = opts.vol!=null ? opts.vol : 0.12;
    gain.gain.setValueAtTime(0.0001, c.currentTime);
    gain.gain.linearRampToValueAtTime(vol, c.currentTime+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+duration);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(); osc.stop(c.currentTime+duration+0.05);
  }
  function sequence(notes, opts={}){
    let t=0;
    notes.forEach(([f,d,gap])=>{ if(f>0) setTimeout(()=>tone(f,d,opts), t*1000); t+=(gap!=null?gap:d); });
  }
  const SFX = {
    buildQueued: ()=>tone(440,0.08,{type:"triangle",vol:0.07}),
    buildDone: ()=>sequence([[523,0.12],[659,0.12],[784,0.22]],{type:"triangle",vol:0.11}),
    trainQueued: ()=>tone(330,0.07,{type:"square",vol:0.06}),
    trainDone: ()=>sequence([[392,0.08],[523,0.16]],{type:"square",vol:0.08}),
    depart: ()=>sequence([[220,0.15],[220,0.18]],{type:"sawtooth",vol:0.09}),
    victory: ()=>sequence([[523,0.12],[659,0.12],[784,0.12],[988,0.26]],{type:"triangle",vol:0.14}),
    defeat: ()=>sequence([[300,0.2],[220,0.32]],{type:"sawtooth",vol:0.11}),
    conquest: ()=>sequence([[523,0.1],[659,0.1],[784,0.1],[659,0.1],[784,0.1],[988,0.4]],{type:"triangle",vol:0.15}),
    raidAlarm: ()=>sequence([[880,0.1],[0,0.05],[880,0.1],[0,0.05],[880,0.16]],{type:"square",vol:0.09}),
    error: ()=>tone(180,0.15,{type:"square",vol:0.07})
  };
  function setMuted(m){ muted=m; }
  function toggle(){ setMuted(!muted); return muted; }
  return {ensureCtx, SFX, setMuted, toggle, isMuted:()=>muted};
})();

function popUsed(){
  let used=0;
  for(const k of TROOP_ORDER) used += (state.village.troops[k]||0)*TROOPS[k].pop;
  for(const o of state.village.trainQueue) used += o.count*TROOPS[o.troop].pop;
  // Ne compte que les troupes parties DEPUIS ce village précis (chaque village a sa propre
  // population/ferme — les troupes d'un autre de vos villages ne doivent pas compter ici).
  for(const m of state.missions){
    if(m.attackerUsername!==username || m.sourceVillageId!==state.village.id) continue;
    for(const k of TROOP_ORDER) used += (m.troops[k]||0)*TROOPS[k].pop;
  }
  return Math.round(used);
}
function nobleCount(){
  let n = state.village.troops.noble||0;
  for(const o of state.village.trainQueue) if(o.troop==="noble") n+=o.count;
  for(const m of state.missions) if(m.attackerUsername===username && m.sourceVillageId===state.village.id) n += m.troops.noble||0;
  return n;
}

async function apiCall(path, method, body){
  const opts = { method, headers:{} };
  if(authToken) opts.headers["Authorization"]="Bearer "+authToken;
  if(body!==undefined){ opts.headers["Content-Type"]="application/json"; opts.body=JSON.stringify(body); }
  const res = await fetch(path, opts);
  let data={};
  try{ data = await res.json(); }catch(e){}
  if(!res.ok) throw new Error(data.error || ("Erreur serveur ("+res.status+")"));
  return data;
}

/* Fusionne un instantané serveur dans l'état local, met à jour le cache de reconnaissance
   et déclenche les effets (scintillement de construction terminée, bannière de raid subi). */
function applySnapshot(snap){
  const prevState = state;
  serverTimeOffset = snap.serverTime - Date.now()/1000;
  state = snap;
  if(snap.speedMultiplier!=null) adminSpeed = snap.speedMultiplier;
  for(const r of state.reports){
    if(r.kind==="scout" && r.targetId!=null){
      const ex = scoutIntel[r.targetId];
      if(!ex || r.time > ex.time){
        scoutIntel[r.targetId] = { resources:r.resources, troops:r.troops, wallLevel:r.wallLevel, loyalty:r.loyalty, time:r.time, isPlayer:r.isPlayer };
      }
    }
  }
  if(!mapView) mapView = { cx:state.village.x, cy:state.village.y, ppf:26 };
  if(prevState){
    const prevB = prevState.village.buildings;
    for(const k in state.village.buildings){
      if((state.village.buildings[k]||0) > (prevB[k]||0)){
        sparkleUntil[k]=Date.now()+1500;
        Audio.SFX.buildDone();
      }
    }
    const newCount = state.reports.length - prevState.reports.length;
    if(newCount>0 && newCount<=state.reports.length){
      state.reports.slice(0, newCount).forEach(r=>{
        if(r.kind==="defense"){
          const lost = r.winner==="attacker";
          showBanner(lost?("💀 "+(r.source||"Un ennemi")+" a pillé votre village !"):("🛡️ Attaque de "+(r.source||"un ennemi")+" repoussée !"), "raid");
          Audio.SFX[lost?"defeat":"victory"]();
        }
      });
    }
  }
  renderChat();
}

/* Exécute une action serveur, fusionne la réponse et rafraîchit l'affichage ; affiche l'erreur sinon. */
async function doAction(promiseFn, successMsg, sfx){
  try{
    const data = await promiseFn();
    applySnapshot(data.snapshot);
    if(sfx) Audio.SFX[sfx]();
    if(successMsg) toast(successMsg);
    renderTabs(); renderTopBar(); renderSidebar(); renderActiveTabContent();
  }catch(err){
    Audio.SFX.error();
    toast("⚠️ "+err.message);
  }
}

function queueBuild(key){

function queueTrain(key, count){
  count=Math.floor(count);
  if(!count || count<=0) return;
  const t=TROOPS[key];
  doAction(()=>apiCall("/api/train","POST",{key, count}), count+" "+t.name+"(s) mis en formation.", "trainQueued");
}

function claimQuest(key){
  doAction(()=>apiCall("/api/quest/claim","POST",{key}), "🎯 Objectif rempli — récompense reçue !", "victory");
}

function sendMission(villageId, kind){
  const troops={};
  let any=false;
  for(const k of TROOP_ORDER){
    const el=document.getElementById("send_"+villageId+"_"+k);
    if(!el) continue;
    let n=Math.floor(Number(el.value)||0);
    n=Math.max(0, Math.min(n, state.village.troops[k]||0));
    if(k==="noble") n=Math.min(n,1); // un seul noble par attaque (le serveur l'impose aussi)
    if(n>0){ troops[k]=n; any=true; }
  }
  if(!any){ toast("Sélectionnez au moins une troupe à envoyer."); return; }
  if(kind==="scout" && !troops.scout){ toast("Une reconnaissance nécessite au moins un éclaireur."); return; }
  const target=state.villages.find(v=>v.id===villageId);
  if(kind==="support"){
    doAction(
      ()=>apiCall("/api/support/send","POST",{targetId:villageId, troops}),
      "🤝 Renfort envoyé"+(target?(" vers "+target.name+" ("+target.x+"|"+target.y+")"):"")+".",
      "depart"
    );
    return;
  }
  doAction(
    ()=>apiCall("/api/mission","POST",{targetId:villageId, kind, troops}),
    (kind==="attack"?"⚔️ Attaque":"🔭 Reconnaissance")+" envoyée"+(target?(" vers "+target.name+" ("+target.x+"|"+target.y+")"):"")+".",
    "depart"
  );
}

function sendGift(villageId){
  const target=state.villages.find(v=>v.id===villageId);
  if(!target || !target.isPlayer){ toast("Cible invalide."); return; }
  const amt={};
  let any=false;
  for(const r of ["wood","clay","iron"]){
    const el=document.getElementById("gift_"+villageId+"_"+r);
    if(!el) continue;
    let n=Math.floor(Number(el.value)||0);
    n=Math.max(0, Math.min(n, Math.floor(state.village.resources[r]||0)));
    if(n>0){ amt[r]=n; any=true; }
  }
  if(!any){ toast("Indiquez au moins une ressource à donner."); return; }
  doAction(
    ()=>apiCall("/api/gift","POST",{username:target.owner, wood:amt.wood||0, clay:amt.clay||0, iron:amt.iron||0}),
    "🎁 Don envoyé à "+target.owner+".",
    null
  );
}

/* ============================= SYNCHRONISATION AVEC LE SERVEUR ============================= */

/* Ré-affiche le contenu de l'onglet actif en préservant la valeur et le focus des champs
   <input> déjà présents, pour ne pas effacer une saisie en cours (troupes à envoyer, quantité
   à entraîner, saut de coordonnées...) quand un rafraîchissement périodique arrive. */
function rerenderPreservingInputs(containerEl, renderFn){
  const focused=document.activeElement;
  const focusedId = (focused && containerEl.contains(focused)) ? focused.id : null;
  const focusedSelStart = focused && typeof focused.selectionStart==="number" ? focused.selectionStart : null;
  const values={};
  containerEl.querySelectorAll("input").forEach(inp=>{ if(inp.id) values[inp.id]=inp.value; });
  renderFn();
  containerEl.querySelectorAll("input").forEach(inp=>{ if(inp.id && values[inp.id]!==undefined) inp.value=values[inp.id]; });
  if(focusedId){
    const el=document.getElementById(focusedId);
    if(el){
      el.focus();
      if(focusedSelStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(focusedSelStart, focusedSelStart); }catch(e){} }
    }
  }
}

async function pollState(){
  if(!authToken) return;
  try{
    const data = await apiCall("/api/state","GET");
    applySnapshot(data.snapshot);
    renderTabs();
    updateTopBarStats();
    renderSidebar();
    rerenderPreservingInputs(document.getElementById("tabContent"), renderActiveTabContent);
  }catch(err){
    // session expirée ou serveur momentanément injoignable : on retentera au prochain sondage
    if(/session|reconnect/i.test(err.message||"")) logout(true);
  }
}

function startPolling(){
  if(pollHandle) clearInterval(pollHandle);
  pollHandle=setInterval(pollState, 2500);
}

function stopPolling(){
  if(pollHandle){ clearInterval(pollHandle); pollHandle=null; }
}

async function tryResumeSession(){
  const savedToken=localStorage.getItem("ct_token"), savedUser=localStorage.getItem("ct_username");
  if(!savedToken || !savedUser){ renderAuthScreen("login"); return; }
  authToken=savedToken; username=savedUser;

  }catch(err){
    authToken=null; username=null;
    localStorage.removeItem("ct_token"); localStorage.removeItem("ct_username");
    renderAuthScreen("login");

function renderSidebar(){
  const side=document.getElementById("sidebar");
  const now=estimateNow();
  const v=state.village;
  const cap=storageCap(v.buildings.warehouse);
  const pop=popUsed(), popMax=farmCap(v.buildings.farm);
  const resBox = `
    <div class="box res-box">
      <h3>💰 Ressources</h3>
      <div class="res-group">
        ${["wood","clay","iron"].map(r=>`
          <div class="res ${v.resources[r]>=cap-1?'warn':''}" id="resBox_${r}">
            <div class="val" id="resVal_${r}">${RES_ICON[r]} ${fmt(v.resources[r])}<span style="color:var(--text-dim);font-weight:normal;">/${fmt(cap)}</span></div>
            <div class="rate" id="resRate_${r}">+${fmt(prodPerHour(r,v.buildings[r]))}/h</div>
          </div>`).join("")}
        <div class="res"><div class="val" id="popVal">👥 ${pop}/${popMax}</div><div class="rate">population</div></div>
      </div>
    </div>`;
  const bq=state.village.buildQueue.map((item,i)=>{
    const b=BUILDINGS[item.key];
    const timeLeft=Math.max(0, item.startAt+item.duration-now);
    const pct=100*(1-timeLeft/item.duration);
    return `<div class="queue-item"><div class="flex-between"><span>${b.name} → niv. ${item.level}</span><span>${fmtTime(timeLeft)} <a href="#" data-cancel-build="${i}" title="Annuler (remboursé)" style="margin-left:6px;">✖</a></span></div><div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div></div>`;
  }).join("") || `<div class="muted small">File vide.</div>`;

  const tq=state.village.trainQueue.map(o=>{
    const timeLeft=Math.max(0, o.unitStartAt+o.unitDuration-now);
    return `<div class="queue-item"><div class="flex-between"><span>${TROOPS[o.troop].name} ×${o.count}</span><span>${fmtTime(timeLeft)} / unité</span></div></div>`;
  }).join("") || `<div class="muted small">File vide.</div>`;

  const activeMissions=state.missions.filter(m=>m.kind!=="raid");
  const incomingRaids=state.missions.filter(m=>m.kind==="raid" && !m.resolveDone);
  const MISSION_LABEL = { attack:"⚔️ Attaque", scout:"🔭 Reconnaissance", support:"🤝 Soutien", supportReturn:"🤝 Soutien" };

  const missions=activeMissions.map(m=>{
    const target=state.villages.find(v=>v.id===m.targetId);
    const label = MISSION_LABEL[m.kind]||m.kind;
    let phase, remain;
    if(m.kind==="supportReturn"){ phase="revient vers"; remain=m.returnAt-now; }
    else if(!m.resolveDone){ phase="en route vers"; remain=m.arriveAt-now; }
    else { phase="retour de"; remain=m.returnAt-now; }
    return `<div class="mission-item"><div class="flex-between"><span>${label} ${phase} ${target?target.name:'?'}</span><span>${fmtTime(remain)}</span></div></div>`;
  }).join("") || `<div class="muted small">Aucune troupe en mission.</div>`;

  const enemyBox = incomingRaids.length ? `
    <div class="box" style="border-color:#8a3226;"><h3>🚨 Attaques entrantes</h3>${incomingRaids.map(m=>{
      const remain=m.arriveAt-now;
      return `<div class="mission-item"><div class="flex-between"><span>${m.raidSourceName||'Village barbare'} approche</span><span>${fmtTime(remain)}</span></div></div>`;
    }).join("")}</div>` : '';

  const incomingSupport = state.village.support||[];
  const supportInBox = incomingSupport.length ? `
    <div class="box"><h3>🤝 Renforts reçus</h3>${incomingSupport.map(s=>`
      <div class="mission-item"><div class="flex-between"><span>De ${escapeHtml(s.from)}</span><span class="small muted">${fmtTroops(s.troops)}</span></div></div>
    `).join("")}</div>` : '';

  const mySupport = state.mySupport||[];
  const supportOutBox = mySupport.length ? `
    <div class="box"><h3>🤝 Vos renforts envoyés</h3>${mySupport.map(s=>`
      <div class="mission-item">
        <div class="flex-between"><span>Chez ${escapeHtml(s.atVillageName)} (${s.atCoord})</span><a href="#" data-recall-support="${s.id}">↩️ Rappeler</a></div>
        <div class="small muted">${fmtTroops(s.troops)}</div>
      </div>
    `).join("")}</div>` : '';

  side.innerHTML = `
    ${resBox}
    <div class="box"><h3>🏗️ File de construction</h3>${bq}</div>
    <div class="box"><h3>⚔️ File d'entraînement</h3>${tq}</div>
    <div class="box"><h3>🚩 Missions en cours</h3>${missions}</div>
    ${enemyBox}
    ${supportInBox}
    ${supportOutBox}
  `;

  side.querySelectorAll("[data-cancel-build]").forEach(el=>el.onclick=(e)=>{
    e.preventDefault();
    const index=Number(el.dataset.cancelBuild);
    doAction(()=>apiCall("/api/build/cancel","POST",{index}), "Construction annulée, ressources remboursées.", null);
  });
  side.querySelectorAll("[data-recall-support]").forEach(el=>el.onclick=(e)=>{
    e.preventDefault();
    const supportId=el.dataset.recallSupport;
    doAction(()=>apiCall("/api/support/recall","POST",{supportId}), "🤝 Rappel envoyé, vos troupes reviennent.", null);
  });
}

/* Widget de chat flottant, indépendant du système d'onglets : reconstruit la coquille (ouvert/fermé)
   seulement quand l'état change, et se contente sinon de rafraîchir la liste des messages pour ne
   jamais couper la saisie en cours dans le champ de texte. */
function renderChat(){
  if(!state) return;
  const el=document.getElementById("chatWidget");
  if(!el) return;
  if(chatOpen && el.querySelector(".chat-panel")){ updateChatMessages(); return; }
  if(!chatOpen && el.querySelector(".chat-bubble")) return;

  if(chatOpen){
    el.innerHTML = `
      <div class="chat-panel">
        <div class="chat-head">
          <span>💬 Chat mondial</span>
          <button class="chat-toggle" id="chatCollapseBtn" title="Réduire">➖</button>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <form id="chatForm" class="chat-form">
          <input type="text" id="chatInput" maxlength="300" placeholder="Écrire un message…" autocomplete="off">
          <button type="submit">➤</button>
        </form>
      </div>`;
    updateChatMessages();
    document.getElementById("chatCollapseBtn").onclick=()=>{ chatOpen=false; renderChat(); };
    document.getElementById("chatForm").onsubmit=(e)=>{ e.preventDefault(); sendChat(); };
  } else {
    el.innerHTML = `<button class="chat-bubble" id="chatExpandBtn" title="Ouvrir le chat">💬</button>`;
    document.getElementById("chatExpandBtn").onclick=()=>{ chatOpen=true; renderChat(); };
  }
}

function updateChatMessages(){
  const box=document.getElementById("chatMessages");
  if(!box || !state) return;
  const messages=state.chat||[];
  const nearBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 20;
  box.innerHTML = messages.length
    ? messages.map(m=>`<div class="chat-msg${m.username===username?' me':''}"><span class="chat-user">${escapeHtml(m.username)}</span><span class="chat-text">${escapeHtml(m.text)}</span></div>`).join("")
    : `<div class="muted small" style="padding:8px;">Aucun message pour l'instant. Dites bonjour !</div>`;
  if(nearBottom) box.scrollTop = box.scrollHeight;
}

function renderActiveTabContent(){
  // Ne jamais recréer la carte pendant un glissé en cours : sinon le sondage périodique
  // (toutes les 2,5s) remplace #mapCanvas en plein milieu du drag et le bloque (bug corrigé).
  if(activeTab==="map" && mapDragging) return;
  const main=document.getElementById("tabContent");
  if(activeTab==="buildings") main.innerHTML=renderBuildings();
  else if(activeTab==="barracks") main.innerHTML=renderBarracks();
  else if(activeTab==="quests") main.innerHTML=renderQuests();
  else if(activeTab==="leaderboard") main.innerHTML=renderLeaderboard();
  else if(activeTab==="map") main.innerHTML=renderMap();
  else if(activeTab==="reports") main.innerHTML=renderReports();
  else if(activeTab==="guild") main.innerHTML=renderGuild();
  else if(activeTab==="admin" && state.isAdmin) main.innerHTML=renderAdmin();
  else main.innerHTML=renderHelp();
  attachTabHandlers();
  if(activeTab==="map"){ positionMapWorld(); attachMapHandlers(); }
  if(activeTab==="guild") attachGuildHandlers();
  if(activeTab==="admin" && state.isAdmin){
    attachAdminHandlers();
    if(!adminPlayers) refreshAdminData();
  }
}

function renderBuildings(){
  const v=state.village;

  const sel = (ui.selectedBuilding && BUILDINGS[ui.selectedBuilding]) ? ui.selectedBuilding : "hq";
  const b=BUILDINGS[sel], lvl=v.buildings[sel]||0, atMax=lvl>=b.max;
  const pendingForSel = state.village.buildQueue.filter(o=>o.key===sel).length;
  const nextLevel=lvl+pendingForSel+1, maxed=nextLevel>b.max;
  const cost = maxed?null:buildCost(sel,nextLevel);
  const time = maxed?null:vBuildTime(sel,nextLevel);
  const lockedReq = b.requires && Object.entries(b.requires).some(([rk,rv])=>(v.buildings[rk]||0)<rv);
  const affordable = cost && canAffordAll(cost);
  const isEmpty = lvl<=0;
  const queueFull = state.village.buildQueue.length>=6;

  const detail = `
    <div class="building-detail box">
      <div class="icon-big">${buildingIconSvg(sel, lvl)}</div>
      <div class="info">
        <h3 style="margin-bottom:2px;">${b.name} <span style="color:var(--text-dim); font-size:13px; font-weight:normal;">— niveau ${lvl}${atMax?' (max)':''}</span></h3>
        <div class="desc" style="margin-bottom:8px;">${b.desc}</div>
        ${maxed ? `<p class="muted small">${atMax?'Niveau maximum atteint.':'Toutes les améliorations jusqu\'au niveau maximum sont déjà en file.'}</p>` : `
          <div class="cost" style="margin-bottom:8px;">
            <span class="${v.resources.wood<cost.wood?'short':''}">🪵 ${fmt(cost.wood)}</span>
            <span class="${v.resources.clay<cost.clay?'short':''}">🧱 ${fmt(cost.clay)}</span>
            <span class="${v.resources.iron<cost.iron?'short':''}">⛏️ ${fmt(cost.iron)}</span>
            <span>⏱ ${fmtTime(time)}</span>
          </div>
          ${pendingForSel?`<div class="unit-note">${pendingForSel} déjà en file d'attente</div>`:''}
          ${lockedReq?`<div class="req-note">Nécessite : ${Object.entries(b.requires).map(([rk,rv])=>BUILDINGS[rk].name+" niv. "+rv).join(", ")}</div>`:''}
          ${queueFull?`<div class="req-note">File de construction pleine (max 6).</div>`:''}
          <button data-build="${sel}" class="primary" ${(!affordable||lockedReq||queueFull)?'disabled':''}>${isEmpty?'Construire':'Améliorer'} → niveau ${nextLevel}</button>
        `}
      </div>
    </div>`;

  const buildMenu = sel==="hq" ? `
    <div class="box" style="margin-top:14px;">
      <h3>🏗️ Construire un bâtiment</h3>
      <p class="muted small">Depuis l'Hôtel de ville, lancez la construction ou l'amélioration de n'importe quel bâtiment sans avoir à cliquer dessus sur la carte.</p>
      <div class="grid-buildings">
        ${BUILD_ORDER.filter(k=>k!=="hq").map(k=>renderBuildMenuCard(k)).join("")}

    </div>` : "";

  return `<h2>Votre village</h2>
    <p class="muted small">Cliquez sur un bâtiment du village pour voir ses détails et l'améliorer.</p>
    <div class="village-scene">${renderVillageScene()}</div>
    ${detail}
    ${buildMenu}`;
}

  const nextLevel=lvl+queuedCount+1, maxed=nextLevel>b.max;

  const lockedReq = b.requires && Object.entries(b.requires).some(([rk,rv])=>(v.buildings[rk]||0)<rv);

function renderQuests(){
  const done = state.quests.filter(q=>q.claimed).length;
  const cards = state.quests.map(q=>{
    const rewardParts=[];
    if(q.reward.wood) rewardParts.push(`🪵 ${fmt(q.reward.wood)}`);
    if(q.reward.clay) rewardParts.push(`🧱 ${fmt(q.reward.clay)}`);
    if(q.reward.iron) rewardParts.push(`⛏️ ${fmt(q.reward.iron)}`);
    if(q.reward.troops) for(const tk in q.reward.troops) rewardParts.push(`${TROOPS[tk].name} ×${q.reward.troops[tk]}`);
    let btnLabel, btnDisabled;
    if(q.claimed){ btnLabel="✅ Récompense reçue"; btnDisabled=true; }
    else if(q.met){ btnLabel="🎁 Réclamer la récompense"; btnDisabled=false; }
    else{ btnLabel="Objectif non atteint"; btnDisabled=true; }
    return `<div class="card ${q.claimed?'quest-done':''}">
      <div class="card-head">
        <div class="icon-mini shop-icon">${q.icon}</div>
        <h4>${q.title}<span class="small muted" style="font-weight:normal;">${q.claimed?'Terminé':(q.met?'Prêt !':'')}</span></h4>
      </div>
      <div class="desc">${q.desc}</div>
      <div class="cost">${rewardParts.map(p=>`<span>${p}</span>`).join("")}</div>
      <button data-claim-quest="${q.key}" class="primary" ${btnDisabled?'disabled':''}>${btnLabel}</button>
    </div>`;
  }).join("");

  return `<h2>🎯 Objectifs</h2>
    <p class="muted small">${done}/${state.quests.length} objectifs remplis — des jalons de progression avec une récompense en ressources ou en troupes.</p>
    <div class="grid-buildings">${cards}</div>`;
}

    </div>
    <div class="group">
      <span class="small muted">Aller aux coordonnées</span>
      <input type="number" id="jumpX" value="${Math.round(mv.cx)}">

function renderVillageDetail(){
  const v=state.village;
  if(ui.selectedVillage==null){
    return `<p class="muted small">Cliquez sur un village de la carte pour voir ses informations et lui envoyer des troupes.</p>`;
  }
  if(ui.selectedVillage==="home"){
    return `<div class="box"><h3>🏰 ${v.name}</h3><p class="muted small">Votre village (${v.x}|${v.y}). Impossible de s'attaquer soi-même.</p></div>`;
  }
  const t=state.villages.find(x=>x.id===ui.selectedVillage);
  if(!t) return `<p class="muted small">Village introuvable.</p>`;
  const dx=t.x-v.x, dy=t.y-v.y, dist=Math.sqrt(dx*dx+dy*dy);

  if(t.owner===username){
    const isActive = t.id===v.id;
    return `<div class="box">
      <div class="flex-between">
        <h3 style="margin-bottom:0;">🚩 ${t.name} <span class="muted small" style="font-weight:normal;">${t.x}|${t.y} · à ${dist.toFixed(1)} champs</span></h3>
        <span class="tag weak">Conquis</span>
      </div>
      <div class="sub small" style="margin:6px 0;">Ce village vous appartient : vous pouvez l'améliorer et y entraîner des troupes comme votre premier village (ressources et troupes qui lui sont propres).</div>
      ${isActive
        ? `<div class="sub small" style="margin-top:6px;"><span class="tag strong">Village actif</span> — c'est celui que vous gérez actuellement (onglets Bâtiments/Caserne).</div>`
        : `<button data-manage-village="${t.id}">🏗️ Gérer ce village</button>`}
    </div>`;
  }

  const intel = scoutIntel[t.id];
  const intelLine = intel
    ? `Vue lors d'une reconnaissance il y a ${fmtTime(Math.max(0,estimateNow()-intel.time))} : lanciers ${intel.troops.spear||0} · épéistes ${intel.troops.sword||0} · archers ${intel.troops.archer||0}${intel.loyalty!=null?(' · Loyauté '+Math.round(intel.loyalty)+'%'):''} — 🪵${fmt(intel.resources.wood)} 🧱${fmt(intel.resources.clay)} ⛏️${fmt(intel.resources.iron)}`
    : `Troupes et ressources inconnues — envoyez une reconnaissance pour les révéler.`;

  const ownerTag = t.isPlayer
    ? `<span class="tag medium">Joueur : ${t.owner}</span>`
    : `<span class="tag ${TIER_CLASS[t.tier]}">${TIER_LABEL[t.tier]}</span>`;

  const troopInputs=TROOP_ORDER.map(k=>{
    const avail=v.troops[k]||0;
    // Un seul Noble peut partir par attaque, quel que soit le nombre disponible au village.
    const maxSend = k==="noble" ? Math.min(avail,1) : avail;
    return `<div class="inp">
      <span>${TROOPS[k].name}</span>
      <input type="number" min="0" max="${maxSend}" value="0" id="send_${t.id}_${k}">
      <a href="#" data-max="${t.id}_${k}" style="font-size:10px;">max ${maxSend}</a>
    </div>`;
  }).join("");

  const giftBox = t.isPlayer ? `
    <div class="send-form open" style="margin-top:10px;">
      <div class="small muted" style="margin-bottom:6px;">🎁 Donner des ressources (immédiat, sans marchand)</div>
      <div class="inputs" style="display:flex; gap:10px; flex-wrap:wrap;">
        ${["wood","clay","iron"].map(r=>`<div class="inp">${RES_ICON[r]}<input type="number" min="0" max="${Math.floor(v.resources[r])}" value="0" id="gift_${t.id}_${r}"></div>`).join("")}
      </div>
      <button data-gift="${t.id}">🎁 Envoyer le don</button>
    </div>` : "";

  return `<div class="box">
    <div class="flex-between">
      <h3 style="margin-bottom:0;">${t.name} <span class="muted small" style="font-weight:normal;">${t.x}|${t.y} · à ${dist.toFixed(1)} champs</span></h3>
      ${ownerTag}
    </div>
    <div class="sub small" style="margin:6px 0;">${intelLine}${t.wallLevel>0?(' · Muraille niv.'+t.wallLevel):''}</div>
    <div class="send-form open">
      <div class="inputs">${troopInputs}</div>
      <button data-send="${t.id}_attack" class="primary">⚔️ Attaquer</button>
      <button data-send="${t.id}_scout">🔭 Reconnaître</button>
      ${t.isPlayer?`<button data-send="${t.id}_support">🤝 Envoyer en soutien</button>`:''}
    </div>
    ${giftBox}
  </div>`;
}

function missionMarkerPos(m){
  if(m.kind!=="attack" && m.kind!=="scout" && m.kind!=="raid") return null;
  const v=state.village;
  const now=estimateNow();
  let t, fromX,fromY,toX,toY,frac,returning;
  if(m.kind==="raid"){
    t=state.villages.find(x=>x.id===m.sourceVillageId);
    if(!t) return null;
    if(m.resolveDone) return null; // le retour des pillards ne concerne pas la carte du joueur visé
    frac=clamp((now-m.departAt)/Math.max(1,m.travel),0,1);
    fromX=t.x; fromY=t.y; toX=v.x; toY=v.y; returning=false;
  } else {
    t=state.villages.find(x=>x.id===m.targetId);
    if(!t) return null;
    if(!m.resolveDone){
      frac=clamp((now-m.departAt)/Math.max(1,m.travel),0,1);
      fromX=v.x; fromY=v.y; toX=t.x; toY=t.y; returning=false;
    } else {
      const dur=Math.max(1, m.returnAt-m.arriveAt);
      frac=clamp((now-m.arriveAt)/dur,0,1);
      fromX=t.x; fromY=t.y; toX=v.x; toY=v.y; returning=true;
    }
  }
  return { wx: fromX+(toX-fromX)*frac, wy: fromY+(toY-fromY)*frac, returning };
}

function mapMarkerHTML(m, pos, minX, minY, ppf){
  const left=(pos.wx-minX)*ppf, top=(pos.wy-minY)*ppf;
  const kindCls = m.kind==="scout" ? "marker-scout" : "marker-attack";
  const icon = m.kind==="scout" ? "🔭" : (m.kind==="raid" ? "⚠️" : "⚔️");
  const label = m.kind==="scout" ? "Reconnaissance" : (m.kind==="raid" ? "Raid barbare" : "Attaque");
  return `<div class="troop-marker ${kindCls} ${pos.returning?'marker-returning':''}" id="marker_${m.id}" style="left:${left}px; top:${top}px;" title="${label} ${pos.returning?'(retour)':'(aller)'}">
    <div class="tdot">${icon}</div>
  </div>`;
}

function updateMapMarkers(){
  const world=document.getElementById("mapWorld");
  if(!world) return;
  const minX=Number(world.dataset.minx), minY=Number(world.dataset.miny);
  const ppf=mapView.ppf;
  const activeIds=new Set();
  for(const m of state.missions){
    const pos=missionMarkerPos(m);
    if(!pos) continue;
    activeIds.add(m.id);
    const left=(pos.wx-minX)*ppf, top=(pos.wy-minY)*ppf;
    let el=document.getElementById("marker_"+m.id);
    if(!el){
      world.insertAdjacentHTML("beforeend", mapMarkerHTML(m, pos, minX, minY, ppf));
      continue;
    }
    el.style.left=left+"px";
    el.style.top=top+"px";
    el.classList.toggle("marker-returning", pos.returning);
  }
  world.querySelectorAll(".troop-marker").forEach(el=>{
    const id=el.id.slice("marker_".length);
    if(!activeIds.has(id)) el.remove();
  });
}

function renderMap(){
  if(!mapView) mapView={cx:state.village.x, cy:state.village.y, ppf:26};
  const v=state.village, mv=mapView, ppf=mv.ppf;
  const others=state.villages.filter(t=>t.id!==v.id);
  const xs=others.map(t=>t.x).concat(v.x), ys=others.map(t=>t.y).concat(v.y);
  const minX=Math.min(...xs)-3, maxX=Math.max(...xs)+3;
  const minY=Math.min(...ys)-3, maxY=Math.max(...ys)+3;
  const worldW=(maxX-minX)*ppf, worldH=(maxY-minY)*ppf;

  const pins = others.map(t=>{
    const left=(t.x-minX)*ppf, top=(t.y-minY)*ppf;
    const sel = ui.selectedVillage===t.id;
    const mine = t.owner===username;
    const cls = mine ? "player" : (t.isPlayer ? "medium" : TIER_CLASS[t.tier]);
    const icon = mine ? "🚩" : (t.isPlayer ? "👤" : (t.wallLevel>0?'🏯':'🏚️'));
    const title = t.name+" ("+t.x+"|"+t.y+")"+(mine?' — vous':(t.isPlayer?(' — '+t.owner):''));
    return `<div class="villagePin ${cls} ${sel?'selected':''}" data-village-pin="${t.id}" style="left:${left}px; top:${top}px;" title="${title}">
      <div class="dot">${icon}</div>
      ${ppf>=20?`<div class="plabel">${t.x}|${t.y}</div>`:''}
    </div>`;
  }).join("");
  const playerLeft=(v.x-minX)*ppf, playerTop=(v.y-minY)*ppf;
  const playerSel = ui.selectedVillage==="home";
  const playerPin = `<div class="villagePin player ${playerSel?'selected':''}" data-village-pin="home" style="left:${playerLeft}px; top:${playerTop}px;" title="${v.name} (${v.x}|${v.y})">
    <div class="dot">🏰</div>
    ${ppf>=20?`<div class="plabel">${v.name}</div>`:''}
  </div>`;

  const markers = state.missions.map(m=>{
    const pos=missionMarkerPos(m);
    return pos ? mapMarkerHTML(m, pos, minX, minY, ppf) : "";
  }).join("");

  const gridBg = `
    background-image:
      linear-gradient(to right, rgba(255,255,255,.06) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.06) 1px, transparent 1px),
      linear-gradient(to right, rgba(255,255,255,.16) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.16) 1px, transparent 1px);
    background-size:${ppf}px ${ppf}px, ${ppf}px ${ppf}px, ${ppf*10}px ${ppf*10}px, ${ppf*10}px ${ppf*10}px;`;

  return `<h2>Carte du monde</h2>
    <p class="muted small">Glissez la carte pour explorer, molette pour zoomer, cliquez sur un village pour l'attaquer ou le reconnaître. 👤 = village d'un autre joueur.</p>
    ${renderMapToolbar()}
    <div id="mapCanvas">
      <div id="mapWorld" data-minx="${minX}" data-miny="${minY}" style="width:${worldW}px; height:${worldH}px;${gridBg}">
        ${pins}${playerPin}${markers}
      </div>
    </div>
    <div id="villageDetail">${renderVillageDetail()}</div>`;
}

function positionMapWorld(){
  const canvas=document.getElementById("mapCanvas");
  const world=document.getElementById("mapWorld");
  if(!canvas||!world||!mapView) return;
  const mv=mapView;
  const minX=Number(world.dataset.minx), minY=Number(world.dataset.miny);
  world.style.left = (canvas.clientWidth/2 - (mv.cx-minX)*mv.ppf) + "px";
  world.style.top = (canvas.clientHeight/2 - (mv.cy-minY)*mv.ppf) + "px";
}

function attachMapHandlers(){
  const canvas=document.getElementById("mapCanvas");
  const world=document.getElementById("mapWorld");
  if(!canvas||!world) return;
  positionMapWorld();

  let dragging=false, moved=false, startX=0, startY=0, baseLeft=0, baseTop=0;
  canvas.onpointerdown=(e)=>{
    dragging=true; moved=false; mapDragging=true; startX=e.clientX; startY=e.clientY;
    baseLeft=parseFloat(world.style.left)||0; baseTop=parseFloat(world.style.top)||0;
    canvas.classList.add("dragging");
    canvas.setPointerCapture(e.pointerId);
  };
  canvas.onpointermove=(e)=>{
    if(!dragging) return;
    const dx=e.clientX-startX, dy=e.clientY-startY;
    if(Math.abs(dx)+Math.abs(dy)>4) moved=true;
    world.style.left=(baseLeft+dx)+"px";
    world.style.top=(baseTop+dy)+"px";
  };
  const endDrag=(e)=>{
    if(!dragging) return;
    dragging=false;
    mapDragging=false;
    canvas.classList.remove("dragging");
    if(e && e.pointerId!=null){ try{ canvas.releasePointerCapture(e.pointerId); }catch(err){} }
    if(moved){
      const left=parseFloat(world.style.left)||0, top=parseFloat(world.style.top)||0;
      const minX=Number(world.dataset.minx), minY=Number(world.dataset.miny);
      mapView.cx = minX + (canvas.clientWidth/2-left)/mapView.ppf;
      mapView.cy = minY + (canvas.clientHeight/2-top)/mapView.ppf;
      mapJustDragged=true;
      renderActiveTabContent(); // re-synchronise avec les données reçues pendant le glissé (bloqué le temps du drag)
    } else if(e){
      // simple tap (no drag): select whichever village pin is under the pointer.
      // pointer capture retargets the native click to the canvas itself, so we
      // resolve the actual element manually instead of relying on that click event.
      const el=document.elementFromPoint(e.clientX, e.clientY);
      const pinEl = el && el.closest ? el.closest("[data-village-pin]") : null;
      if(pinEl){
        const raw=pinEl.dataset.villagePin;
        ui.selectedVillage = raw==="home" ? "home" : raw;
      }
      renderActiveTabContent();
    }
  };
  canvas.onpointerup=endDrag;
  canvas.onpointercancel=endDrag;

  // Molette de la souris : zoom centré sur le curseur, pour une carte plus interactive.
  canvas.onwheel=(e)=>{
    e.preventDefault();
    const rect=canvas.getBoundingClientRect();
    const minX=Number(world.dataset.minx), minY=Number(world.dataset.miny);
    const oldPpf=mapView.ppf;
    const newPpf=Math.max(12, Math.min(48, oldPpf + (e.deltaY<0?4:-4)));
    if(newPpf===oldPpf) return;
    // garde le point du monde sous le curseur immobile pendant le zoom
    const cursorX=e.clientX-rect.left, cursorY=e.clientY-rect.top;
    const worldX = mapView.cx + (cursorX-canvas.clientWidth/2)/oldPpf;
    const worldY = mapView.cy + (cursorY-canvas.clientHeight/2)/oldPpf;
    mapView.ppf=newPpf;
    mapView.cx = worldX - (cursorX-canvas.clientWidth/2)/newPpf;
    mapView.cy = worldY - (cursorY-canvas.clientHeight/2)/newPpf;
    renderActiveTabContent();
  };

  document.getElementById("btnZoomIn").onclick=()=>{ mapView.ppf=Math.min(48, mapView.ppf+6); renderActiveTabContent(); };
  document.getElementById("btnZoomOut").onclick=()=>{ mapView.ppf=Math.max(12, mapView.ppf-6); renderActiveTabContent(); };
  document.getElementById("btnRecenter").onclick=()=>{ mapView.cx=state.village.x; mapView.cy=state.village.y; renderActiveTabContent(); };
  document.getElementById("btnJump").onclick=()=>{
    const x=Number(document.getElementById("jumpX").value), y=Number(document.getElementById("jumpY").value);
    if(Number.isFinite(x) && Number.isFinite(y)){ mapView.cx=x; mapView.cy=y; renderActiveTabContent(); }
  };
}

function renderReportFilters(){
  return `<div class="report-filters">${REPORT_FILTERS.map(f=>{
    const count = f.key==="all" ? state.reports.length : state.reports.filter(r=>reportMatchesFilter(r,f)).length;
    return `<button class="filter-btn ${reportFilter===f.key?'active':''}" data-report-filter="${f.key}">${f.label} (${count})</button>`;
  }).join("")}</div>`;
}

function reportActions(r){
  return `<span class="actions"><span class="small muted">${fmtTime(Math.max(0,estimateNow()-r.time))}</span><button class="report-del" data-delete-report="${r.id}" title="Supprimer ce rapport">🗑️</button></span>`;
}

function renderReports(){
  const filterBar = renderReportFilters();
  if(!state.reports.length) return `<h2>Rapports</h2>${filterBar}<p class="muted">Aucun rapport pour l'instant.</p>`;
  const activeFilterObj = REPORT_FILTERS.find(f=>f.key===reportFilter);
  const filtered = reportFilter==="all" ? state.reports : state.reports.filter(r=>reportMatchesFilter(r, activeFilterObj));
  const bulkLabel = reportFilter==="all" ? "tous les rapports" : "les rapports affichés";
  const bulkBar = `<div class="flex-between" style="margin-bottom:10px;">
    <span class="small muted">${filtered.length} rapport${filtered.length>1?'s':''} affiché${filtered.length>1?'s':''}</span>
    <button id="btnClearReports" class="small" ${filtered.length?'':'disabled'} data-clear-kind="${reportFilter==="all"?"":reportFilter}">🗑️ Supprimer ${bulkLabel}</button>
  </div>`;
  if(!filtered.length) return `<h2>Rapports</h2>${filterBar}${bulkBar}<p class="muted">Aucun rapport dans cette catégorie.</p>`;
  const items=filtered.map((r)=>{
    const open=ui.openReport.has(r.id);
    if(r.kind==="attack"){
      const win=r.winner==="attacker";
      const titleLabel = r.conquered ? "👑 Village conquis" : (win?'🏆 Victoire':'💀 Défaite');
      const fmtTroopBreakdown = (sent, lost, survivors) => TROOP_ORDER
        .filter(k=>(sent&&sent[k]>0) || (survivors&&survivors[k]>0))
        .map(k=>`${TROOPS[k].name} : envoyés ${sent&&sent[k]||0}, survivants ${survivors&&survivors[k]||0}${(lost&&lost[k])?(', perdus '+lost[k]):''}`)
        .join("<br>") || "aucune";
      return `<div class="report ${win?'win':'lose'}">
        <div class="title" data-toggle="${r.id}"><span>${titleLabel} contre ${r.target} (${r.coord})${r.targetIsPlayer?(' — joueur '+r.targetOwner):''}</span>${reportActions(r)}</div>
        <div class="details ${open?'open':''}">
          Puissance d'attaque : ${r.attackPower} (effective ${r.effAttack}, chance ${(r.luck*100).toFixed(0)}%)${r.attackShare?` — répartition infanterie ${r.attackShare.inf}% / cavalerie ${r.attackShare.cav}% / archers ${r.attackShare.arch}%`:""}<br>
          Puissance de défense : ${r.defensePower}<br>
          Pertes attaquant : ${r.attackerLossPct!=null?r.attackerLossPct+"% — ":""}${Object.entries(r.attackerLosses).filter(([,n])=>n>0).map(([k,n])=>TROOPS[k].name+" -"+n).join(", ")||"aucune"}<br>
          Pertes défenseur : ${r.defenderLossPct!=null?r.defenderLossPct+"% — ":""}${Object.entries(r.defenderLosses).filter(([,n])=>n>0).map(([k,n])=>TROOPS[k].name+" -"+n).join(", ")||"aucune"}<br>
          ${r.troopsSent?`<div class="small muted" style="margin:6px 0;">${fmtTroopBreakdown(r.troopsSent, r.attackerLosses, r.attackerSurvivors)}</div>`:""}
          ${r.nobleSent?`Noble(s) envoyé(s) : ${r.nobleSent}, ayant survécu au combat : ${r.nobleSurvived}${r.nobleSurvivalChancePct!=null?(' (chance de survie '+r.nobleSurvivalChancePct+'%)'):''}${r.conquered?' — a pris possession du village !':(r.nobleSurvived>0?' — consommé (pas de retour).':'')}<br>`:""}
          ${win?`Butin : 🪵${r.loot.wood} 🧱${r.loot.clay} ⛏️${r.loot.iron}<br>`:""}
          ${r.wallDamage?`Muraille adverse endommagée : -${r.wallDamage} niveau(x)${r.targetWallLevelAfter!=null?(' (reste niveau '+r.targetWallLevelAfter+')'):''}<br>`:""}
          ${r.storageDamageFrac?`Entrepôt adverse endommagé : -${Math.round(r.storageDamageFrac*100)}% de capacité<br>`:""}
          ${r.loyaltyReduced?`Loyauté réduite de ${r.loyaltyReduced}% (reste ${Math.round(r.targetLoyalty)}%)${r.conquered?" — village conquis !":""}<br>`:""}
        </div>
      </div>`;
    } else if(r.kind==="defense"){
      const win=r.winner==="attacker";
      return `<div class="report defense">
        <div class="title" data-toggle="${r.id}"><span>${win?'💀 Raid subi de ':'🛡️ Attaque repoussée de '}${r.source}</span>${reportActions(r)}</div>
        <div class="details ${open?'open':''}">
          Puissance ennemie : ${r.attackPower} (effective ${r.effAttack}, chance ${(r.luck*100).toFixed(0)}%)${r.attackShare?` — répartition infanterie ${r.attackShare.inf}% / cavalerie ${r.attackShare.cav}% / archers ${r.attackShare.arch}%`:""}<br>
          Votre puissance défensive : ${r.defensePower}<br>
          ${r.troopsSent?`Troupes ennemies engagées : ${TROOP_ORDER.filter(k=>(r.troopsSent[k]||0)>0).map(k=>TROOPS[k].name+" "+r.troopsSent[k]).join(", ")||"inconnues"}<br>`:""}
          ${r.attackerLosses?`Pertes infligées à l'ennemi : ${r.attackerLossPct!=null?r.attackerLossPct+"% — ":""}${Object.entries(r.attackerLosses).filter(([,n])=>n>0).map(([k,n])=>TROOPS[k].name+" -"+n).join(", ")||"aucune"}<br>`:""}
          Vos pertes : ${r.defenderLossPct!=null?r.defenderLossPct+"% — ":""}${Object.entries(r.defenderLosses).filter(([,n])=>n>0).map(([k,n])=>TROOPS[k].name+" -"+n).join(", ")||"aucune"}<br>
          ${r.wallDamage?`Votre muraille a été endommagée : -${r.wallDamage} niveau(x)${r.targetWallLevelAfter!=null?(' (reste niveau '+r.targetWallLevelAfter+')'):''}<br>`:""}
          ${win?`Ressources pillées : 🪵${r.loot.wood} 🧱${r.loot.clay} ⛏️${r.loot.iron}`:"Aucune perte de ressources."}
        </div>
      </div>`;
    } else if(r.kind==="scout"){
      return `<div class="report scout">
        <div class="title" data-toggle="${r.id}"><span>🔭 Reconnaissance de ${r.target} (${r.coord})</span>${reportActions(r)}</div>
        <div class="details ${open?'open':''}">
          Ressources : 🪵${fmt(r.resources.wood)} 🧱${fmt(r.resources.clay)} ⛏️${fmt(r.resources.iron)}<br>
          Troupes : ${TROOP_ORDER.map(k=>TROOPS[k].name+" "+(r.troops[k]||0)).join(", ")}<br>
          Muraille niveau ${r.wallLevel}${r.loyalty!=null?(' · Loyauté '+Math.round(r.loyalty)+'%'):''}
        </div>
      </div>`;
    } else if(r.kind==="raid"){
      return `<div class="report raid">
        <div class="title" data-toggle="${r.id}"><span>⚠️ Raid de pillards</span>${reportActions(r)}</div>
        <div class="details ${open?'open':''}">Ressources perdues : 🪵${(r.lost&&r.lost.wood)||0} 🧱${(r.lost&&r.lost.clay)||0} ⛏️${(r.lost&&r.lost.iron)||0}</div>
      </div>`;
    } else if(r.kind==="supportIn"){
      return `<div class="report support">
        <div class="title"><span>🤝 Renfort reçu de ${escapeHtml(r.from)}</span>${reportActions(r)}</div>
        <div class="details open">${fmtTroops(r.troops)}</div>
      </div>`;
    } else if(r.kind==="supportOut"){
      return `<div class="report support">
        <div class="title"><span>🤝 Renfort envoyé${r.lost?'':(' vers '+r.target+' ('+r.coord+')')}</span>${reportActions(r)}</div>
        <div class="details open">${r.lost?escapeHtml(r.text||''):fmtTroops(r.troops)}</div>
      </div>`;
    } else if(r.kind==="giftIn"){
      return `<div class="report gift">
        <div class="title"><span>🎁 Don reçu de ${escapeHtml(r.from)}</span>${reportActions(r)}</div>
        <div class="details open">🪵${fmt(r.wood)} 🧱${fmt(r.clay)} ⛏️${fmt(r.iron)}</div>
      </div>`;
    } else if(r.kind==="giftOut"){
      return `<div class="report gift">
        <div class="title"><span>🎁 Don envoyé à ${escapeHtml(r.target)}</span>${reportActions(r)}</div>
        <div class="details open">🪵${fmt(r.wood)} 🧱${fmt(r.clay)} ⛏️${fmt(r.iron)}</div>
      </div>`;
    } else if(r.kind==="guildInvite"){
      return `<div class="report guild">
        <div class="title"><span>👥 Invitation de guilde : [${escapeHtml(r.guildTag)}] ${escapeHtml(r.guildName)} (par ${escapeHtml(r.from)})</span>${reportActions(r)}</div>
        <div class="details open">
          <button data-guild-invite-accept="${r.guildId}" class="primary">✅ Rejoindre</button>
          <button data-guild-invite-decline="${r.guildId}">❌ Refuser</button>
        </div>
      </div>`;
    } else if(r.kind==="announcement"){
      return `<div class="report announcement">
        <div class="title"><span>📢 Annonce${r.author?(' de '+escapeHtml(r.author)):''}</span>${reportActions(r)}</div>
        <div class="details open" style="white-space:pre-wrap;">${escapeHtml(r.text||'')}</div>
      </div>`;
    }
    return `<div class="report"><div class="title"><span>${r.text||''}</span>${reportActions(r)}</div></div>`;
  }).join("");
  return `<h2>Rapports</h2>${filterBar}${bulkBar}${items}`;
}

function renderGuild(){
  const g = state.guild;
  if(!g){
    return `<h2>👥 Guilde</h2>
    <p class="muted small">Rejoignez ou fondez une guilde pour construire un Hall de guilde dans votre village : il permet de donner des ressources à la guilde pour obtenir un bonus de production partagé par tous ses membres.</p>
    <div class="box">
      <h3>➕ Fonder une guilde</h3>
      <form id="guildCreateForm" style="display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end;">
        <label class="small">Nom<br><input type="text" id="guildCreateName" maxlength="30" placeholder="Les Braves"></label>
        <label class="small">Tag<br><input type="text" id="guildCreateTag" maxlength="6" placeholder="BRV" style="width:80px; text-transform:uppercase;"></label>
        <button type="submit" class="primary">Fonder</button>
      </form>
    </div>
    <p class="muted small">Si un chef de guilde vous a invité, vous trouverez son invitation dans l'onglet <b>Rapports</b> (catégorie « Guilde »), avec un bouton pour l'accepter ou la refuser.</p>`;
  }

  const v = state.village;
  const hallLvl = v.buildings.guildHall||0;
  const b = BUILDINGS.guildHall;
  const nextLevel = hallLvl+1;
  const maxed = nextLevel>b.max;
  const lockedReq = b.requires && Object.entries(b.requires).some(([rk,rv])=>(v.buildings[rk]||0)<rv);
  const cost = maxed?null:buildCost("guildHall", nextLevel);
  const time = maxed?null:vBuildTime("guildHall", nextLevel);
  const affordable = cost && canAffordAll(cost);
  const pendingHall = state.village.buildQueue.filter(o=>o.key==="guildHall").length;
  const hallCard = `<div class="box">
    <h3>🏛️ Hall de guilde ${hallLvl>0?('(niveau '+hallLvl+')'):''}</h3>
    <div class="desc">${b.desc}</div>
    ${lockedReq?`<div class="req-note">Nécessite : ${Object.entries(b.requires).map(([rk,rv])=>BUILDINGS[rk].name+" niv. "+rv).join(", ")}</div>`
      : maxed ? `<p class="muted small">Niveau maximum atteint.</p>` : `
      <div class="cost" style="margin:8px 0;">
        <span class="${v.resources.wood<cost.wood?'short':''}">🪵 ${fmt(cost.wood)}</span>
        <span class="${v.resources.clay<cost.clay?'short':''}">🧱 ${fmt(cost.clay)}</span>
        <span class="${v.resources.iron<cost.iron?'short':''}">⛏️ ${fmt(cost.iron)}</span>
        <span>⏱ ${fmtTime(time)}</span>
      </div>
      ${pendingHall?`<div class="unit-note">${pendingHall} déjà en file d'attente</div>`:''}
      <button id="btnBuildGuildHall" class="primary" ${!affordable?'disabled':''}>${hallLvl<=0?'Construire':'Améliorer'} → niveau ${nextLevel}</button>
    `}
  </div>`;

  const donateBox = hallLvl>0 ? `
    <div class="box">
      <h3>🎁 Faire un don à la guilde</h3>
      <p class="small muted">Chaque don augmente définitivement le bonus de production de TOUS les membres (plafonné à ${GUILD_MAX_BONUS_PERCENT_CLIENT}%). Votre Hall de guilde (niveau ${hallLvl}) limite chaque don à ${1000*hallLvl} ressources au total.</p>
      <div class="inputs" style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:8px;">
        ${["wood","clay","iron"].map(r=>`<div class="inp">${RES_ICON[r]}<input type="number" min="0" value="0" id="guildDonate_${r}"></div>`).join("")}
      </div>
      <button id="btnGuildDonate" class="primary">Donner</button>
    </div>` : `<p class="muted small">Construisez le Hall de guilde ci-dessus pour pouvoir faire des dons.</p>`;

  const membersRows = g.members.map(m=>`<tr>
    <td class="player-link" data-open-profile="${escapeHtml(m)}">${escapeHtml(m)}${m===g.leader?' <span class="tag strong">CHEF</span>':''}${m===username?' (vous)':''}</td>
    <td>${g.isLeader && m!==username ? `<button data-guild-kick="${escapeHtml(m)}">Exclure</button>` : ''}</td>
  </tr>`).join("");

  const donationRows = (g.donations||[]).slice(0,15).map(d=>`
    <div class="donation-row">
      <span>${escapeHtml(d.username)}</span>
      <span class="muted">🪵${fmt(d.wood)} 🧱${fmt(d.clay)} ⛏️${fmt(d.iron)}</span>
      <span class="muted">${fmtTime(Math.max(0,estimateNow()-d.time))}</span>
    </div>`).join("") || `<p class="muted small">Aucun don pour l'instant.</p>`;

  const donorTotalsSorted = Object.entries(g.donorTotals||{}).sort((a,b)=>b[1]-a[1]);
  const donorTotalsRows = donorTotalsSorted.map(([u,total])=>`<tr><td>${escapeHtml(u)}</td><td>${fmt(total)}</td></tr>`).join("")
    || `<tr><td colspan="2" class="muted">Aucun don pour l'instant.</td></tr>`;

  const donationHistoryBox = `
    <div class="box">
      <h3>🎁 Historique des dons</h3>
      <div style="display:flex; gap:16px; flex-wrap:wrap; align-items:flex-start;">
        <div style="flex:1 1 260px; min-width:220px;">
          <div class="small muted" style="margin-bottom:4px;">Dons récents</div>
          ${donationRows}
        </div>
        <div style="flex:1 1 200px; min-width:180px;">
          <div class="small muted" style="margin-bottom:4px;">Total cumulé par membre</div>
          <table style="width:100%;"><thead><tr><th>Membre</th><th>Total</th></tr></thead><tbody>${donorTotalsRows}</tbody></table>
        </div>
      </div>
    </div>`;

  const activeBoosts = g.activeBoosts||[];
  const activeBoostsBox = activeBoosts.length ? `
    <div class="small muted" style="margin:8px 0;">Bonus actifs : ${activeBoosts.map(b=>`${b.icon} ${escapeHtml(b.name)} (encore ${fmtTime(b.secondsLeft)})`).join(" · ")}</div>
  ` : `<div class="small muted" style="margin:8px 0;">Aucun bonus actif pour l'instant.</div>`;

  const shopCards = GUILD_BOOSTS.map(b=>{
    const active = activeBoosts.find(x=>x.key===b.key);
    const affordable = g.bank.wood>=b.cost.wood && g.bank.clay>=b.cost.clay && g.bank.iron>=b.cost.iron;
    return `<div class="shop-card ${active?'active':''}">
      <h4>${b.icon} ${b.name}</h4>
      <div class="small muted" style="margin-bottom:6px;">${b.desc}</div>
      <div class="cost small" style="margin-bottom:8px;">
        <span class="${g.bank.wood<b.cost.wood?'short':''}">🪵 ${fmt(b.cost.wood)}</span>
        <span class="${g.bank.clay<b.cost.clay?'short':''}">🧱 ${fmt(b.cost.clay)}</span>
        <span class="${g.bank.iron<b.cost.iron?'short':''}">⛏️ ${fmt(b.cost.iron)}</span>
      </div>
      ${g.isLeader
        ? `<button data-guild-buy-boost="${b.key}" class="primary" ${affordable?'':'disabled'}>${active?'Racheter (prolonger)':'Acheter'}</button>`
        : `<p class="muted small">Seul le chef de guilde peut acheter dans la boutique.</p>`}
    </div>`;
  }).join("");

  const shopBox = `
    <div class="box">
      <h3>🛒 Boutique de guilde</h3>
      <p class="small muted">Dépensez les ressources de la <b>banque de guilde</b> (alimentée par les dons ci-dessus) pour offrir un bonus temporaire à TOUS les membres. Banque actuelle : 🪵${fmt(g.bank.wood)} 🧱${fmt(g.bank.clay)} ⛏️${fmt(g.bank.iron)}.</p>
      ${activeBoostsBox}
      <div class="shop-grid">${shopCards}</div>
    </div>`;

  const inviteBox = g.isLeader ? `
    <div class="box">
      <h3>✉️ Inviter un joueur</h3>
      <form id="guildInviteForm" style="display:flex; gap:8px;">
        <input type="text" id="guildInviteUsername" placeholder="Pseudo du joueur">
        <button type="submit" class="primary">Inviter</button>
      </form>
      ${g.invites.length?`<p class="small muted" style="margin-top:8px;">Invitations en attente : ${g.invites.map(escapeHtml).join(", ")}</p>`:''}
    </div>` : '';

  return `<h2>👥 [${escapeHtml(g.tag)}] ${escapeHtml(g.name)}</h2>
    <p class="muted small">Bonus de production actuel : <b>+${g.bonusPercent}%</b> pour tous les membres (basé sur ${fmt(g.totalDonated)} ressources données au total).</p>
    <div class="box">
      <h3>👥 Membres (${g.members.length})</h3>
      <table><thead><tr><th>Pseudo</th><th></th></tr></thead><tbody>${membersRows}</tbody></table>
    </div>
    ${inviteBox}
    ${hallCard}
    ${donateBox}
    ${donationHistoryBox}
    ${shopBox}
    <div class="box">
      <button id="btnGuildLeave">🚪 Quitter la guilde</button>
      ${g.isLeader?`<button id="btnGuildDisband" style="margin-left:8px;">💥 Dissoudre la guilde</button>`:''}
    </div>`;
}

const GUILD_MAX_BONUS_PERCENT_CLIENT = 25;

function attachGuildHandlers(){
  const createForm=document.getElementById("guildCreateForm");
  if(createForm) createForm.onsubmit=(e)=>{
    e.preventDefault();
    const name=document.getElementById("guildCreateName").value.trim();
    const tag=document.getElementById("guildCreateTag").value.trim();
    if(!name || !tag){ toast("⚠️ Indiquez un nom et un tag."); return; }
    doAction(()=>apiCall("/api/guild/create","POST",{name, tag}), "👥 Guilde fondée !", null);
  };
  const buildHallBtn=document.getElementById("btnBuildGuildHall");
  if(buildHallBtn) buildHallBtn.onclick=()=>queueBuild("guildHall");
  const donateBtn=document.getElementById("btnGuildDonate");
  if(donateBtn) donateBtn.onclick=()=>{
    const wood=Number(document.getElementById("guildDonate_wood").value)||0;
    const clay=Number(document.getElementById("guildDonate_clay").value)||0;
    const iron=Number(document.getElementById("guildDonate_iron").value)||0;
    if(!wood && !clay && !iron){ toast("⚠️ Indiquez au moins une ressource à donner."); return; }
    doAction(()=>apiCall("/api/guild/donate","POST",{wood, clay, iron}), "🎁 Don envoyé à la guilde !", null);
  };
  const inviteForm=document.getElementById("guildInviteForm");
  if(inviteForm) inviteForm.onsubmit=(e)=>{
    e.preventDefault();
    const inp=document.getElementById("guildInviteUsername");
    const u=inp.value.trim();
    if(!u){ toast("⚠️ Indiquez un pseudo."); return; }
    doAction(()=>apiCall("/api/guild/invite","POST",{username:u}), "✉️ Invitation envoyée à "+u+".", null);
    inp.value="";
  };
  document.querySelectorAll("[data-guild-kick]").forEach(b=>b.onclick=()=>{
    doAction(()=>apiCall("/api/guild/kick","POST",{username:b.dataset.guildKick}), b.dataset.guildKick+" exclu de la guilde.", null);
  });
  document.querySelectorAll("[data-guild-buy-boost]").forEach(b=>b.onclick=()=>{
    const key=b.dataset.guildBuyBoost;
    const boost=GUILD_BOOSTS.find(x=>x.key===key);
    doAction(()=>apiCall("/api/guild/buy-boost","POST",{key}), boost?("🛒 "+boost.icon+" "+boost.name+" activé pour toute la guilde !"):"🛒 Bonus activé.", null);
  });
  const leaveBtn=document.getElementById("btnGuildLeave");
  if(leaveBtn) leaveBtn.onclick=()=>{
    if(!confirm("Quitter la guilde ?")) return;
    doAction(()=>apiCall("/api/guild/leave","POST"), "Vous avez quitté la guilde.", null);
  };
  const disbandBtn=document.getElementById("btnGuildDisband");
  if(disbandBtn) disbandBtn.onclick=()=>{
    if(!confirm("Dissoudre définitivement la guilde pour tous les membres ?")) return;
    doAction(()=>apiCall("/api/guild/disband","POST"), "Guilde dissoute.", null);
  };
}
