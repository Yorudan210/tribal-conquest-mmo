function renderBuildings(){
  const v=state.village;

  const sel = (ui.selectedBuilding && BUILDINGS[ui.selectedBuilding]) ? ui.selectedBuilding : "hq";
  const b=BUILDINGS[sel], lvl=v.buildings[sel]||0, atMax=lvl>=b.max;
  const pendingForSel = state.village.buildQueue.filter(o=>o.key===sel).length;
  const nextLevel=lvl+pendingForSel+1, maxed=nextLevel>b.max;
  const cost = maxed?null:buildCost(sel,nextLevel);
  const time = maxed?null:vBuildTime(sel,nextLevel);
  const lockedReq = b.requires && Object.entries(b.requires).some(([rk,rv])=>(v.buildings[rk]||0)<rv);
  const affordable = cost && canAffordAll(cost);
  const isEmpty = lvl<=0;
  const queueFull = state.village.buildQueue.length>=6;

  const detail = `
    <div class="building-detail box">
      <div class="icon-big">${buildingIconSvg(sel, lvl)}</div>
      <div class="info">
        <h3 style="margin-bottom:2px;">${b.name} <span style="color:var(--text-dim); font-size:13px; font-weight:normal;">— niveau ${lvl}${atMax?' (max)':''}</span></h3>
        <div class="desc" style="margin-bottom:8px;">${b.desc}</div>
        ${maxed ? `<p class="muted small">${atMax?'Niveau maximum atteint.':'Toutes les améliorations jusqu\'au niveau maximum sont déjà en file.'}</p>` : `
          <div class="cost" style="margin-bottom:8px;">
            <span class="${v.resources.wood<cost.wood?'short':''}">🪵 ${fmt(cost.wood)}</span>
            <span class="${v.resources.clay<cost.clay?'short':''}">🧱 ${fmt(cost.clay)}</span>
            <span class="${v.resources.iron<cost.iron?'short':''}">⛏️ ${fmt(cost.iron)}</span>
            <span>⏱ ${fmtTime(time)}</span>
          </div>
          ${pendingForSel?`<div class="unit-note">${pendingForSel} déjà en file d'attente</div>`:''}
          ${lockedReq?`<div class="req-note">Nécessite : ${Object.entries(b.requires).map(([rk,rv])=>BUILDINGS[rk].name+" niv. "+rv).join(", ")}</div>`:''}
          ${queueFull?`<div class="req-note">File de construction pleine (max 6).</div>`:''}
          <button data-build="${sel}" class="primary" ${(!affordable||lockedReq||queueFull)?'disabled':''}>${isEmpty?'Construire':'Améliorer'} → niveau ${nextLevel}</button>
        `}
      </div>
    </div>`;

  const buildMenu = sel==="hq" ? `
    <div class="box" style="margin-top:14px;">
      <h3>🏗️ Construire un bâtiment</h3>
      <p class="muted small">Depuis l'Hôtel de ville, lancez la construction ou l'amélioration de n'importe quel bâtiment sans avoir à cliquer dessus sur la carte.</p>
      <div class="grid-buildings">
        ${BUILD_ORDER.filter(k=>k!=="hq").map(k=>renderBuildMenuCard(k)).join("")}
      </div>
    </div>` : "";

  const transferBox = renderVillageTransferBox();

  return `<h2>Votre village</h2>
    <p class="muted small">Cliquez sur un bâtiment du village (ou de la liste ci-contre) pour voir ses détails et l'améliorer.</p>
    <div class="village-top">
      <div class="village-scene">${renderVillageScene()}</div>
      <div class="box village-blist">${renderBuildingsList()}</div>
    </div>
    ${detail}
    ${buildMenu}
    ${transferBox}`;
}

/* ---- Liste compacte des bâtiments (Village, thème Parchemin uniquement) ----
   Reprend la maquette "Direction A" retenue au départ : à côté de la scène du village, une liste
   qui donne d'un coup d'œil le niveau de CHAQUE bâtiment (y compris le Hall de guilde, absent de
   la scène — voir commentaire sur BUILD_ORDER) avec une flèche d'amélioration. Cliquer une ligne
   sélectionne ce bâtiment exactement comme un clic sur la scène (même attribut data-plot, même
   gestionnaire dans attachTabHandlers) — sauf le Hall de guilde, qui s'améliore depuis l'onglet
   Guilde et ouvre donc cet onglet plutôt qu'une sélection ici. En thème Bois sombre, la liste
   entière reste masquée (voir .village-blist) et l'écran garde son rendu d'origine à l'identique. */
function renderBuildingsList(){
  const v=state.village;
  const keys=[...BUILD_ORDER, "guildHall"];
  const rows = keys.map(key=>{
    const b=BUILDINGS[key], lvl=v.buildings[key]||0;
    const lockedReq = b.requires && Object.entries(b.requires).some(([rk,rv])=>(v.buildings[rk]||0)<rv);
    const isEmpty = lvl<=0;
    const frontQueued = state.village.buildQueue.length && state.village.buildQueue[0].key===key;
    const isGuildHall = key==="guildHall";
    const navAttr = isGuildHall ? `data-goto-tab="guild"` : `data-plot="${key}"`;
    const selected = !isGuildHall && ui.selectedBuilding===key;
    let levelHtml, upHtml;
    if(frontQueued){
      const remain=Math.max(0, state.village.buildQueue[0].startAt+state.village.buildQueue[0].duration-estimateNow());
      levelHtml = `<span class="blevel muted">🔨 ${fmtTime(remain)}</span>`;
      upHtml = `<span class="bup disabled">▲</span>`;
    } else if(lockedReq){
      levelHtml = `<span class="blevel muted">Verrouillé</span>`;
      upHtml = `<span class="bup disabled">▲</span>`;
    } else if(isEmpty){
      levelHtml = `<span class="blevel muted">Non construit</span>`;
      upHtml = `<span class="bup">▲</span>`;
    } else {
      levelHtml = `<span class="blevel">Niv. ${lvl}${lvl>=b.max?' (max)':''}</span>`;
      upHtml = `<span class="bup">▲</span>`;
    }
    return `<div class="blist-row ${selected?'selected':''}" ${navAttr} title="${b.name}${isGuildHall?' — géré depuis l\'onglet Guilde':''}">
      ${buildingBadgeSvg(key)}
      <span class="bname ${lockedReq&&!frontQueued?'locked':''}">${b.name}</span>
      ${levelHtml}
      ${upHtml}
    </div>`;
  }).join("");
  return rows;
}

/* Transfert instantané de ressources entre deux villages du MÊME joueur (aucun marchand, aucun
   délai de trajet — comme le don direct à un autre joueur, voir sendGift/doGiveResources, mais
   sans passer par le compte d'un tiers). N'apparaît que si le joueur possède plus d'un village. */
function renderVillageTransferBox(){
  const others = (state.myVillages||[]).filter(mv=>!mv.isActive);
  if(!others.length) return "";
  const v=state.village;
  const options = others.map(mv=>`<option value="${mv.id}">${mv.isHome?'🏠 ':'🚩 '}${escapeHtml(mv.name)} (${mv.x}|${mv.y})</option>`).join("");
  return `<div class="box" style="margin-top:14px;">
    <h3>🚚 Transfert entre vos villages</h3>
    <p class="muted small">Envoyez instantanément des ressources de <b>${escapeHtml(v.name)}</b> vers un autre village vous appartenant (sans trajet, plafonné par l'entrepôt du village de destination).</p>
    <div class="inputs" style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:8px;">
      <select id="transferTargetVillage">${options}</select>
      ${["wood","clay","iron"].map(r=>`<div class="inp">${RES_ICON[r]}<input type="number" min="0" max="${Math.floor(v.resources[r])}" value="0" id="transfer_${r}"></div>`).join("")}
    </div>
    <button id="btnVillageTransfer">🚚 Transférer</button>
  </div>`;
}

function sendVillageTransfer(){
  const sel=document.getElementById("transferTargetVillage");
  if(!sel || !sel.value){ toast("Choisissez un village de destination."); return; }
  const targetVillageId=sel.value;
  const target=(state.myVillages||[]).find(mv=>mv.id===targetVillageId);
  const amt={};
  let any=false;
  for(const r of ["wood","clay","iron"]){
    const el=document.getElementById("transfer_"+r);
    if(!el) continue;
    let n=Math.floor(Number(el.value)||0);
    n=Math.max(0, Math.min(n, Math.floor(state.village.resources[r]||0)));
    if(n>0){ amt[r]=n; any=true; }
  }
  if(!any){ toast("Indiquez au moins une ressource à transférer."); return; }
  doAction(
    ()=>apiCall("/api/village/transfer","POST",{targetVillageId, wood:amt.wood||0, clay:amt.clay||0, iron:amt.iron||0}),
    "🚚 Ressources transférées"+(target?(" vers "+target.name):"")+".",
    null
  );
}

/* ============================= EMPIRE (gestion multi-villages, dès 2 villages) ============================= */
/* Panneau "Empire" : reprend les écrans multi-villages de Tribal Wars (Aperçu / Notifications /
   Construction / Troupes / Envoi de ressources) — permet de consulter et d'agir sur N'IMPORTE LEQUEL
   de ses villages sans avoir à y basculer d'abord (contrairement aux écrans Bâtiments/Caserne normaux,
   qui ne concernent que le village actif). S'appuie sur state.myVillagesDetailed (vue complète de
   chaque village, envoyée par le serveur — voir buildSnapshot/myVillagesDetailed côté serveur) et sur
   les routes existantes (/api/build, /api/train, /api/build/cancel, /api/troops/disband,
   /api/village/transfer), toutes désormais capables de cibler un villageId précis plutôt que le seul
   village actif. N'apparaît dans la navigation (renderTabs) qu'à partir de 2 villages possédées. */

function empireBuildQueueHead(v){
  if(!v.buildQueue.length) return `<span class="muted">File vide</span>`;
  const item=v.buildQueue[0];
  const b=BUILDINGS[item.key];
  const remain=Math.max(0, item.startAt+item.duration-estimateNow());
  return `${b.name} → niv.${item.level} <span class="muted">(${fmtTime(remain)})</span>`+(v.buildQueue.length>1?` <span class="muted">+${v.buildQueue.length-1}</span>`:'');
}
function empireTrainQueueHead(v){
  if(!v.trainQueue.length) return `<span class="muted">File vide</span>`;
  const o=v.trainQueue[0];
  const remain=Math.max(0, o.unitStartAt+o.unitDuration-estimateNow());
  return `${TROOPS[o.troop].name} ×${o.count} <span class="muted">(${fmtTime(remain)}/unité)</span>`+(v.trainQueue.length>1?` <span class="muted">+${v.trainQueue.length-1}</span>`:'');
}

function renderEmpire(){
  const villages = state.myVillagesDetailed||[];
  const subTabs=[["apercu","📊 Aperçu"],["notifications","🔔 Notifications"],["construction","🏗️ Construction"],["troupes","⚔️ Troupes"],["resources","📦 Envoi de ressources"]];
  if(!subTabs.some(([k])=>k===empireSubTab)) empireSubTab="apercu";
  const nav = `<div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;">
    ${subTabs.map(([k,label])=>`<button data-empire-subtab="${k}" class="${empireSubTab===k?'primary':''}">${label}</button>`).join("")}
  </div>`;
  let content;
  if(empireSubTab==="notifications") content=renderEmpireNotifications(villages);
  else if(empireSubTab==="construction") content=renderEmpireConstruction(villages);
  else if(empireSubTab==="troupes") content=renderEmpireTroops(villages);
  else if(empireSubTab==="resources") content=renderEmpireResources(villages);
  else content=renderEmpireOverview(villages);
  return `<h2>🏰 Gestion de l'empire</h2>
  <p class="muted small">Vue d'ensemble et gestion groupée de vos ${villages.length} villages, sans avoir à basculer sur chacun d'eux.</p>
  ${nav}${content}`;
}

function renderEmpireOverview(villages){
  const rows = villages.map(v=>{
    const buildLevels = BUILD_ORDER.reduce((s,k)=>s+(v.buildings[k]||0),0);
    const outMissions = state.missions.filter(m=>m.sourceVillageId===v.id && m.attackerUsername===username && !m.completed).length;
    const inThreats = (state.incomingAttacks||[]).filter(m=>m.targetVillageId===v.id).length
      + state.missions.filter(m=>m.kind==="raid" && !m.resolveDone && m.targetId===v.id).length;
    return `<tr data-empire-goto-village="${v.id}" style="cursor:pointer;">
      <td>${v.isHome?'🏠 ':'🚩 '}${escapeHtml(v.name)}<div class="small muted">${v.x}|${v.y}</div></td>
      <td>${v.buildings.hq||0}</td>
      <td class="small">${buildLevels}</td>
      <td class="small">${RES_ICON.wood} ${fmt(v.resources.wood)} · ${RES_ICON.clay} ${fmt(v.resources.clay)} · ${RES_ICON.iron} ${fmt(v.resources.iron)}<div class="muted">/ ${fmt(v.resCap)}</div></td>
      <td class="small">${v.pop}/${v.popMax}</td>
      <td class="small">${empireBuildQueueHead(v)}</td>
      <td class="small">${empireTrainQueueHead(v)}</td>
      <td class="small">${outMissions?`${outMissions} envoyée(s)<br>`:''}${inThreats?`<span style="color:#e05a4a;">⚠️ ${inThreats} entrante(s)</span>`:(outMissions?'':'<span class="muted">—</span>')}</td>
    </tr>`;
  }).join("");
  return `<p class="small muted">Cliquez sur un village pour y basculer directement (onglet Bâtiments).</p>
  <div style="overflow:auto;">
    <table><thead><tr><th>Village</th><th>HdV</th><th>Niveaux cumulés</th><th>Ressources</th><th>Pop.</th><th>Construction</th><th>Entraînement</th><th>Missions</th></tr></thead>
    <tbody>${rows}</tbody></table>
  </div>`;
}

function renderEmpireNotifications(villages){
  const now=estimateNow();
  const items=[];
  for(const v of villages){
    for(const item of v.buildQueue){
      const b=BUILDINGS[item.key];
      items.push({ time:item.startAt+item.duration, icon:"🏗️", text:`${b.name} → niv. ${item.level} — ${v.name}` });
    }
    for(const o of v.trainQueue){
      items.push({ time:o.unitStartAt+o.unitDuration, icon:"⚔️", text:`${TROOPS[o.troop].name} — ${v.name} (encore ${o.count} unité(s) dans cette file)` });
    }
  }
  for(const m of (state.incomingAttacks||[])){
    const label = m.kind==="scout" ? "🔭 Reconnaissance" : "⚔️ Attaque";
    items.push({ time:m.arriveAt, icon:"🚨", text:`${label} de ${m.attackerUsername} vers ${m.targetName||'?'}`, danger:true });
  }
  for(const m of state.missions.filter(mm=>mm.kind==="raid" && !mm.resolveDone)){
    items.push({ time:m.arriveAt, icon:"🚨", text:`Riposte de ${m.raidSourceName||'village barbare'} approche`, danger:true });
  }
  items.sort((a,b)=>a.time-b.time);
  const rows = items.map(it=>`<div class="mission-item"><div class="flex-between"><span>${it.icon} ${escapeHtml(it.text)}</span><span${it.danger?' style="color:#e05a4a;"':''}>${fmtTime(Math.max(0,it.time-now))}</span></div></div>`).join("")
    || `<div class="muted small">Rien à signaler pour l'instant.</div>`;
  return `<div class="box"><h3 style="margin-top:0;">🔔 Notifications — tout votre empire</h3>
    <p class="small muted">Constructions et entraînements en cours, et attaques entrantes, sur TOUS vos villages, triés par ordre d'arrivée.</p>
    ${rows}</div>`;
}

function renderEmpireConstruction(villages){
  const rows = villages.map(v=>{
    const sel = empireSelectedVillageId===v.id;
    return `<tr class="${sel?'admin-selected':''}" data-empire-select-village="${v.id}" style="cursor:pointer;">
      <td>${v.isHome?'🏠 ':'🚩 '}${escapeHtml(v.name)}</td>

    <h3 style="margin-top:0;">🏗️ Construction — tous vos villages</h3>

    <div style="max-height:220px; overflow:auto;">

function renderEmpireConstructionEditor(v){
  const bq = v.buildQueue.map((item,i)=>{
    const b=BUILDINGS[item.key];
    const timeLeft=Math.max(0, item.startAt+item.duration-estimateNow());
    const pct=100*(1-timeLeft/item.duration);
    return `<div class="queue-item"><div class="flex-between"><span>${b.name} → niv. ${item.level}</span><span>${fmtTime(timeLeft)} <a href="#" data-empire-cancel-build="${i}" data-village="${v.id}" title="Annuler (remboursé)" style="margin-left:6px;">✖</a></span></div><div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div></div>`;
  }).join("") || `<div class="muted small">File vide.</div>`;

  const cards = BUILD_ORDER.filter(k=>k!=="hq").map(key=>{
    const b=BUILDINGS[key], lvl=v.buildings[key]||0, atMax=lvl>=b.max;
    const queuedCount = v.buildQueue.filter(q=>q.key===key).length;
    const nextLevel=lvl+queuedCount+1, maxed=nextLevel>b.max;
    const cost = maxed?null:buildCost(key,nextLevel);
    const time = maxed?null:(buildTime(key,nextLevel,v.buildings.hq||0)/(adminSpeed||1));
    const lockedReq = b.requires && Object.entries(b.requires).some(([rk,rv])=>(v.buildings[rk]||0)<rv);
    const affordable = cost && v.resources.wood>=cost.wood && v.resources.clay>=cost.clay && v.resources.iron>=cost.iron;
    const isEmpty = lvl<=0;
    const queueFull = v.buildQueue.length>=6;
    return `<div class="card">
      <div class="card-head"><h4>${b.name}<span class="small muted" style="font-weight:normal;">niveau ${lvl}${atMax?' (max)':''}</span></h4></div>
      ${maxed ? `<p class="muted small">${atMax?'Niveau maximum atteint.':'Toutes les améliorations jusqu\'au niveau maximum sont déjà en file.'}</p>` : `
        <div class="cost">
          <span class="${v.resources.wood<cost.wood?'short':''}">🪵 ${fmt(cost.wood)}</span>
          <span class="${v.resources.clay<cost.clay?'short':''}">🧱 ${fmt(cost.clay)}</span>
          <span class="${v.resources.iron<cost.iron?'short':''}">⛏️ ${fmt(cost.iron)}</span>
          <span>⏱ ${fmtTime(time)}</span>
        </div>
        ${lockedReq?`<div class="req-note">Nécessite : ${Object.entries(b.requires).map(([rk,rv])=>BUILDINGS[rk].name+" niv. "+rv).join(", ")}</div>`:''}
        ${queuedCount?`<div class="unit-note">${queuedCount} déjà en file d'attente</div>`:''}
        <button data-empire-build="${key}" data-village="${v.id}" class="primary" ${(!affordable||lockedReq||queueFull)?'disabled':''}>${isEmpty?'Construire':'Améliorer'} → niveau ${nextLevel}</button>
      `}
    </div>`;
  }).join("");

  return `<div class="box">
    <h3 style="margin-top:0;">✏️ ${v.isHome?'🏠 ':'🚩 '}${escapeHtml(v.name)} <span class="small muted" style="font-weight:normal;">(${v.x}|${v.y})</span></h3>
    <h4>File de construction</h4>
    ${bq}
    <h4>Bâtiments</h4>
    <div class="grid-buildings">${cards}</div>
  </div>`;
}

    <div style="max-height:220px; overflow:auto;">

function renderEmpireTroopsEditor(v){
  if((v.buildings.barracks||0)<1){
    return `<div class="box"><h3 style="margin-top:0;">✏️ ${v.isHome?'🏠 ':'🚩 '}${escapeHtml(v.name)} <span class="small muted" style="font-weight:normal;">(${v.x}|${v.y})</span></h3><p class="muted small">Ce village n'a pas encore de Caserne : construisez-en une (sous-onglet Construction) pour pouvoir y entraîner des troupes.</p></div>`;
  }
  const rows=TROOP_ORDER.map(k=>{
    const t=TROOPS[k];
    const lockedEntries=Object.entries(t.requires).filter(([rk,rv])=>(v.buildings[rk]||0)<rv);
    const locked=lockedEntries.length>0;
    const home=v.troops[k]||0;
    let nobleNote="";
    if(k==="noble"){
      const alive=(v.troops.noble||0)+v.trainQueue.filter(o=>o.troop==="noble").reduce((s,o)=>s+o.count,0);
      nobleNote = `<div class="unit-note">Nobles vivants : ${alive} / ${NOBLE_CAP_PER_VILLAGE} dans ce village (1 seul noble peut partir par attaque)</div>`;
    }
    return `<div class="troop-row">
      <div class="tname">${t.name}</div>
      <div class="stats-mini">⚔️${t.atk} 🛡️${t.defInf}/${t.defCav}/${t.defArch} 🎒${t.carry} 🐎${t.speed}</div>
      <div class="small">Stock : ${home}</div>
      <div class="cost small">🪵${fmt(t.cost.wood)} 🧱${fmt(t.cost.clay)} ⛏️${fmt(t.cost.iron)} 👥${t.pop} ⏱ ${fmtTime(trainTime(k, v.buildings.barracks||0)/(adminSpeed||1))}</div>
      ${locked
        ? `<span class="req-note">Nécessite : ${lockedEntries.map(([rk,rv])=>(BUILDINGS[rk]?BUILDINGS[rk].name:rk)+" niv. "+rv).join(", ")}</span>`
        : `<input type="number" min="0" value="0" id="empireTrainCount_${v.id}_${k}"><button data-empire-train="${k}" data-village="${v.id}">Entraîner</button>${t.note?`<div class="unit-note">${t.note}</div>`:''}${nobleNote}`}
      ${home>0 ? `<div class="disband-row"><input type="number" min="0" max="${home}" value="0" id="empireDisbandCount_${v.id}_${k}"><button data-empire-disband="${k}" data-village="${v.id}" class="danger" title="Licencier définitivement, sans remboursement">🗑️ Licencier</button></div>` : ""}
    </div>`;
  }).join("");
  return `<div class="box">
    <h3 style="margin-top:0;">✏️ ${v.isHome?'🏠 ':'🚩 '}${escapeHtml(v.name)} <span class="small muted" style="font-weight:normal;">(${v.x}|${v.y})</span> — Caserne niv. ${v.buildings.barracks}</h3>
    <p class="muted small">⏱ temps d'entraînement par unité au niveau de Caserne de <b>ce</b> village (plus elle est haute, plus l'entraînement est rapide).</p>
    ${rows}
  </div>`;
}

function renderEmpireResources(villages){
  if(villages.length<2) return `<p class="muted small">Il vous faut au moins 2 villages pour transférer des ressources entre eux.</p>`;
  const activeId = state.village.id;
  const defaultTargetId = (villages.find(v=>v.id!==activeId)||villages[0]).id;
  const sourceOptions = villages.map(v=>`<option value="${v.id}" ${v.id===activeId?'selected':''}>${v.isHome?'🏠 ':'🚩 '}${escapeHtml(v.name)} (${v.x}|${v.y}) — 🪵${fmt(v.resources.wood)} 🧱${fmt(v.resources.clay)} ⛏️${fmt(v.resources.iron)}</option>`).join("");
  const targetOptions = villages.map(v=>`<option value="${v.id}" ${v.id===defaultTargetId?'selected':''}>${v.isHome?'🏠 ':'🚩 '}${escapeHtml(v.name)} (${v.x}|${v.y})</option>`).join("");
  return `<div class="box">
    <h3 style="margin-top:0;">📦 Envoi de ressources entre vos villages</h3>
    <p class="small muted">Transfert instantané (aucun trajet, aucun marchand) : choisissez le village source et le village de destination parmi TOUS les vôtres, sans avoir à basculer dessus au préalable. Plafonné par la capacité d'entrepôt du village de destination.</p>
    <div style="display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; margin-bottom:10px;">
      <div><label class="small muted" for="empireTransferSource">Depuis</label><br><select id="empireTransferSource">${sourceOptions}</select></div>
      <div><label class="small muted" for="empireTransferTarget">Vers</label><br><select id="empireTransferTarget">${targetOptions}</select></div>
    </div>
    <div class="inputs" style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:8px;">
      ${["wood","clay","iron"].map(r=>`<div class="inp">${RES_ICON[r]}<input type="number" min="0" value="0" id="empireTransfer_${r}"></div>`).join("")}
    </div>
    <button id="btnEmpireTransfer" class="primary">🚚 Transférer</button>
  </div>`;
}

function empireQueueBuild(villageId, key){
  doAction(()=>apiCall("/api/build","POST",{key, villageId}), "🏗️ Construction lancée.", null);
}
function empireCancelBuild(villageId, index){
  doAction(()=>apiCall("/api/build/cancel","POST",{index, villageId}), "Construction annulée, ressources remboursées.", null);
}
function empireQueueTrain(villageId, key, count){
  doAction(()=>apiCall("/api/train","POST",{key, count, villageId}), "⚔️ Entraînement lancé.", null);
}
function empireDisbandTroops(villageId, key, count){
  doAction(()=>apiCall("/api/troops/disband","POST",{key, count, villageId}), "🗑️ Troupes licenciées.", null);
}
function empireSendResources(){
  const srcSel=document.getElementById("empireTransferSource");
  const tgtSel=document.getElementById("empireTransferTarget");
  if(!srcSel || !tgtSel || !srcSel.value || !tgtSel.value){ toast("Choisissez un village source et un village de destination."); return; }
  if(srcSel.value===tgtSel.value){ toast("Choisissez deux villages différents."); return; }
  const villages = state.myVillagesDetailed||[];
  const source = villages.find(v=>v.id===srcSel.value);
  const target = (state.myVillages||[]).find(mv=>mv.id===tgtSel.value);
  const amt={};
  let any=false;
  for(const r of ["wood","clay","iron"]){
    const el=document.getElementById("empireTransfer_"+r);
    if(!el) continue;
    let n=Math.floor(Number(el.value)||0);
    n=Math.max(0, Math.min(n, source?Math.floor(source.resources[r]||0):0));
    if(n>0){ amt[r]=n; any=true; }
  }
  if(!any){ toast("Indiquez au moins une ressource à transférer."); return; }
  doAction(
    ()=>apiCall("/api/village/transfer","POST",{sourceVillageId:srcSel.value, targetVillageId:tgtSel.value, wood:amt.wood||0, clay:amt.clay||0, iron:amt.iron||0}),
    "🚚 Ressources transférées"+(source&&target?(" de "+source.name+" vers "+target.name):"")+".",
    null
  );
}

function attachEmpireHandlers(){
  document.querySelectorAll("[data-empire-subtab]").forEach(b=>b.onclick=()=>{
    empireSubTab=b.dataset.empireSubtab;
    renderActiveTabContent();
  });
  document.querySelectorAll("[data-empire-goto-village]").forEach(el=>el.onclick=()=>{
    switchVillage(el.dataset.empireGotoVillage, true);
  });
  document.querySelectorAll("[data-empire-select-village]").forEach(el=>el.onclick=()=>{
    empireSelectedVillageId = el.dataset.empireSelectVillage;
    renderActiveTabContent();
  });
  document.querySelectorAll("[data-empire-build]").forEach(b=>b.onclick=()=>{
    empireQueueBuild(b.dataset.village, b.dataset.empireBuild);
  });
  document.querySelectorAll("[data-empire-cancel-build]").forEach(el=>el.onclick=(e)=>{
    e.preventDefault();
    empireCancelBuild(el.dataset.village, Number(el.dataset.empireCancelBuild));
  });
  document.querySelectorAll("[data-empire-train]").forEach(b=>b.onclick=()=>{
    const villageId=b.dataset.village, k=b.dataset.empireTrain;
    const inp=document.getElementById("empireTrainCount_"+villageId+"_"+k);
    empireQueueTrain(villageId, k, Number(inp.value));
  });
  document.querySelectorAll("[data-empire-disband]").forEach(b=>b.onclick=()=>{
    const villageId=b.dataset.village, k=b.dataset.empireDisband;
    const inp=document.getElementById("empireDisbandCount_"+villageId+"_"+k);
    empireDisbandTroops(villageId, k, Number(inp.value));
  });
  const transferBtn=document.getElementById("btnEmpireTransfer");
  if(transferBtn) transferBtn.onclick=empireSendResources;
}

      ${lockedReq?`<div class="req-note">Nécessite : ${Object.entries(b.requires).map(([rk,rv])=>BUILDINGS[rk].name+" niv. "+rv).join(", ")}</div>`:''}
      ${queuedCount?`<div class="unit-note">${queuedCount} déjà en file d'attente</div>`:''}
      <button data-build="${key}" class="primary" ${(!affordable||lockedReq||queueFull)?'disabled':''}>${isEmpty?'Construire':'Améliorer'} → niveau ${nextLevel}</button>
    `}
  </div>`;
}

/* Succès : mêmes catégories/paliers (Bois/Bronze/Argent/Or) que le jeu officiel, calculés côté
   serveur (computeAchievements) à partir de compteurs cumulatifs liés au COMPTE — jamais réclamés
   manuellement ni remis à zéro, contrairement aux anciens Objectifs qu'ils remplacent : ils se
   débloquent tout seuls au fil de la progression, purement indicatifs (aucune récompense en jeu). */
const ACHIEVEMENT_TIER_COLORS = ["#a9895f","#cd7f32","#c0c0c0","#e0b83c"];
function renderAchievements(){
  const list = state.achievements||[];
  const totalPoints = list.reduce((s,a)=>s+a.points,0);
  const maxPoints = list.length*10; // 1+2+3+4 par succès entièrement gravi jusqu'à l'Or

  const cards = list.map(a=>{
    const tierLabel = a.tier>0 ? ACHIEVEMENT_TIER_LABELS[a.tier-1] : null;
    const floorValue = a.tier>0 ? a.tiers[a.tier-1] : 0;
    const progressPct = a.nextThreshold!=null
      ? clamp(100*(a.value-floorValue)/(a.nextThreshold-floorValue), 0, 100)
      : 100;
    const badgesRow = a.tiers.map((t,i)=>{
      const reached = a.tier>i;
      return `<span class="tier-pip${reached?' reached':''}" style="${reached?('background:'+ACHIEVEMENT_TIER_COLORS[i]+';'):''}" title="${ACHIEVEMENT_TIER_LABELS[i]} — ${fmt(t)}"></span>`;
    }).join("");
    return `<div class="card ${a.tier>=4?'quest-done':''}">
      <div class="card-head">
        <div class="icon-mini shop-icon">${a.icon}</div>
        <h4>${a.name}<span class="small muted" style="font-weight:normal;">${tierLabel?('Palier '+tierLabel):'Non débuté'}</span></h4>
      </div>
      <div class="desc">${a.desc}</div>
      <div class="bar-bg" style="margin:8px 0 4px;"><div class="bar-fill" style="width:${progressPct}%;"></div></div>
      <div class="small muted flex-between">
        <span>${fmt(a.value)}${a.nextThreshold!=null?(' / '+fmt(a.nextThreshold)):' — maximum atteint'}</span>
        <span>${badgesRow}</span>
      </div>
    </div>`;
  }).join("");

  return `<h2>🎖️ Succès</h2>
    <p class="muted small">${totalPoints}/${maxPoints} points de succès — mêmes catégories et paliers (Bois/Bronze/Argent/Or) que le jeu officiel, purement indicatifs (pas de récompense).</p>
    <div class="grid-buildings">${cards}</div>`;
}

// Triangle de contre-unités lisible : chip de type (dérivé de INFANTRY/CAVALRY/ARCHERS, shared/gameData.js)
// + mini barres defInf/defCav/defArch (déjà présentes dans TROOPS, mêmes valeurs que celles utilisées
// par le serveur dans defensePowerOf/computePower — voir gameLogic.js). Purement client/affichage :
// aucune formule de combat n'est modifiée, ce n'est qu'une visualisation de données déjà existantes.
function troopTypeChip(k){
  if(INFANTRY.includes(k)) return `<span class="type-chip type-inf" title="Type d'attaque : Infanterie">🗡️ Infanterie</span>`;
  if(CAVALRY.includes(k)) return `<span class="type-chip type-cav" title="Type d'attaque : Cavalerie">🐎 Cavalerie</span>`;
  if(ARCHERS.includes(k)) return `<span class="type-chip type-arch" title="Type d'attaque : Archers">🏹 Archers</span>`;
  return "";
}
function troopTriangleBars(t){
  const bar=(cls,label,val)=>`<div class="ttri-row"><span class="ttri-lbl">${label}</span><div class="ttri-bar"><div class="ttri-fill ${cls}" style="width:${clamp(val,0,100)}%"></div></div><span class="ttri-val">${val}</span></div>`;
  return `<div class="ttriangle">
    ${bar("inf","🗡️ vs Inf.",t.defInf)}
    ${bar("cav","🐎 vs Cav.",t.defCav)}
    ${bar("arch","🏹 vs Arc.",t.defArch)}
  </div>`;
}

function renderBarracks(){

    return `<div class="troop-row">

      <div class="stats-mini">⚔️${t.atk} 🛡️${t.defInf}/${t.defCav}/${t.defArch} 🎒${t.carry} 🐎${t.speed}</div>

      ${home>0 ? `<div class="disband-row"><input type="number" min="0" max="${home}" value="0" id="disbandCount_${k}"><button data-disband="${k}" class="danger" title="Licencier définitivement, sans remboursement">🗑️ Licencier</button></div>` : ""}

    <p class="muted small">La puissance d'une attaque se répartit entre Infanterie/Cavalerie/Archers selon sa composition, et chaque troupe défensive résiste différemment à chacun de ces trois types (barres ci-dessous, 0-100) : ce n'est pas un triangle strict "qui bat qui", mais des résistances asymétriques — par exemple l'Archer défend très mal face à d'autres archers (🏹 5) mais bien contre l'infanterie et la cavalerie.</p>
    <div class="troops-list">${rows}</div>`;
}

/* Commandant : officier du compte (pas du village), arbre de compétences à 3 branches indépendantes
   (Attaque/Défense/Économie), 4 paliers chacune — voir COMMANDER_BRANCHES/COMMANDER_MAX_TIER
   (shared/gameData.js) et doCommanderUpgrade/grantCommanderXp (server/gameLogic.js). */
function renderCommander(){
  const c = state.commander;
  if(!c){
    return `<h2>🎖️ Commandant</h2><p class="muted">Informations de Commandant indisponibles pour le moment.</p>`;
  }
  const pct = c.xpToNext>0 ? clamp(Math.round(c.xp/c.xpToNext*100),0,100) : 0;
  const branchCols = Object.keys(COMMANDER_BRANCHES).map(bk=>{
    const branch = COMMANDER_BRANCHES[bk];
    const cur = c.skills[bk]||0;
    const tiersHtml = branch.tiers.map((tier,i)=>{
      const tierNum=i+1;
      const unlocked = cur>=tierNum;
      const canUnlock = !unlocked && cur===tierNum-1 && c.skillPoints>0;
      const isFinal = tierNum===COMMANDER_MAX_TIER;
      let action;
      if(unlocked) action = `<span class="cmd-tier-status cmd-status-done">✅ Acquis</span>`;
      else if(canUnlock) action = `<button data-commander-upgrade="${bk}">🔓 Débloquer (1 pt)</button>`;
      else action = `<span class="cmd-tier-status muted small">🔒 Verrouillé</span>`;
      return `<div class="cmd-tier ${unlocked?'unlocked':''}${isFinal?' cmd-tier-final':''}">
        <div class="cmd-tier-head"><span class="cmd-tier-num">${tierNum}</span><span class="cmd-tier-desc">${tier.desc}</span></div>
        ${action}
      </div>`;
    }).join("");
    return `<div class="cmd-branch">
      <h3>${branch.icon} ${branch.name} <span class="small muted">(palier ${cur}/${COMMANDER_MAX_TIER})</span></h3>
      ${tiersHtml}
    </div>`;
  }).join("");
  return `<h2>🎖️ Commandant</h2>
    <p class="muted small">Votre Commandant est propre à votre <b>compte</b> (pas à un village précis) : il gagne de l'expérience à chaque combat — pertes infligées à l'adversaire, aussi bien en attaque qu'en défense — et monte de niveau, ce qui octroie 1 point de compétence à répartir librement entre 3 branches indépendantes. Chaque branche a 4 paliers ; les 3 premiers accordent un bonus progressif, le 4ᵉ un bonus spécial plus marqué.</p>
    <div class="box" style="margin-bottom:14px;">
      <div class="flex-between"><h3 style="margin:0;">Niveau ${c.level}</h3><span class="small muted">${c.skillPoints} point(s) de compétence disponible(s)</span></div>
      <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;"></div></div>
      <div class="small muted" style="margin-top:4px;">${c.xp} / ${c.xpToNext} XP jusqu'au niveau ${c.level+1}</div>
    </div>
    <div class="cmd-branches">${branchCols}</div>`;
}

const TIER_CLASS=["weak","weak","medium","strong","strong"];
const TIER_LABEL=["Très faible","Faible","Moyen","Fort","Très fort"];
const BLACK_ARMY_RANK_LABEL=["I","II","III","IV","V"];
const DIPLOMACY_LABEL={pact:"Pacte de non-agression", alliance:"Alliance", war:"Guerre"};
const DIPLOMACY_LABEL_LOWER={pact:"un pacte de non-agression", alliance:"une alliance", war:"un état de guerre"};

/* Relation active de NOTRE guilde avec la guilde propriétaire d'un village (pour la couleur des
   pins sur la carte et l'avertissement avant d'attaquer). Renvoie null si sans guilde, village
   sans guilde, ou relation non active (une proposition en attente ne compte pas encore). */
function guildRelationFor(guildId){
  if(!guildId || !state.guild || !state.guild.diplomacy) return null;
  const rel = state.guild.diplomacy.find(r=>r.status==="active" && r.otherGuild.id===guildId);
  if(!rel) return null;
  const cls = rel.type==="war" ? "war" : (rel.type==="alliance" ? "ally" : "pact");
  return { type:rel.type, cls, label: DIPLOMACY_LABEL[rel.type] };
}

/* Fenêtre de mission (ouverte en cliquant sur un village de la carte) : regroupe attaque, reconnaissance,
   soutien et don dans une fenêtre modale unique, sur le même principe que la fiche joueur — plutôt qu'un
   panneau fixe sous la carte, qui obligeait à faire défiler la page et se refermait mal sur mobile. */
function closeVillageAction(){
  const modal=document.getElementById("villageActionModal");
  if(modal) modal.innerHTML="";
  if(ui.selectedVillage!=null){
    ui.selectedVillage=null;
    if(activeTab==="map") renderActiveTabContent();
  }
}

function openVillageAction(villageId){
  ui.selectedVillage=villageId;

}

  const modal=document.getElementById("villageActionModal");

        </div>

    return;
  }

  const t=state.villages.find(x=>x.id===ui.selectedVillage);
  if(!t){ modal.innerHTML=""; return; }
  const dx=t.x-v.x, dy=t.y-v.y, dist=Math.sqrt(dx*dx+dy*dy);

  if(t.owner===username){
    const isActive = t.id===v.id;
    modal.innerHTML = `
      <div class="tutorial-backdrop" id="villageActionBackdrop">
        <div class="tutorial-card village-action-card">
          <div class="flex-between" style="align-items:flex-start;">
            <h3 style="margin:0;">🚩 ${escapeHtml(t.name)}</h3>

          </div>

          ${isActive
            ? `<p class="sub small"><span class="tag strong">Village actif</span> — c'est celui que vous gérez actuellement (onglets Bâtiments/Caserne).</p>`

    : `Troupes et ressources inconnues — envoyez une reconnaissance pour les révéler.`;

    : `<span class="tag ${TIER_CLASS[t.tier]}">${TIER_LABEL[t.tier]}</span>`;
  const diplomacyWarning = (rel && (rel.type==="pact" || rel.type==="alliance"))
    ? `<p class="small" style="color:#e0c98a; background:rgba(74,63,34,.35); border:1px solid #4a3f22; border-radius:8px; padding:6px 10px; margin:8px 0;">⚠️ Votre guilde a ${rel.type==="alliance"?"une alliance":"un pacte de non-agression"} avec ce joueur. L'attaque reste possible, mais réfléchissez-y à deux fois.</p>`
    : "";

        ${t.resourceBonus?`<p class="small" style="color:var(--gold); background:rgba(193,121,62,.16); border:1px solid rgba(193,121,62,.5); border-radius:8px; padding:6px 10px; margin:0 0 8px;">${RES_ICON[t.resourceBonus.res]} Gisement riche : ce village produit +${Math.round(t.resourceBonus.pct*100)}% de ${RES_NAME[t.resourceBonus.res].toLowerCase()}${t.isPlayer?'':' une fois conquis'} — le bonus reste propre à ce village.</p>`:""}
        ${diplomacyWarning}
        <div class="send-form open">
          <div class="inputs">${troopInputs}</div>
          <button data-send="${t.id}_attack" class="primary">⚔️ Attaquer</button>

          ${t.isPlayer?`<button data-send="${t.id}_support">🤝 Envoyer en soutien</button>`:''}

  wireVillageActionModal();

/* Câble les contrôles de la fenêtre de mission : fermeture, liens "max", envoi de troupes/don,
   gestion du village conquis. Les mêmes gestionnaires que sendMission/sendGift/switchVillage. */
function wireVillageActionModal(){
  const modal=document.getElementById("villageActionModal");
  const closeBtn=document.getElementById("btnCloseVillageAction");
  if(closeBtn) closeBtn.onclick=closeVillageAction;
  const backdrop=document.getElementById("villageActionBackdrop");
  if(backdrop) backdrop.onclick=(e)=>{ if(e.target.id==="villageActionBackdrop") closeVillageAction(); };
  modal.querySelectorAll("[data-max]").forEach(a=>a.onclick=(e)=>{
    e.preventDefault();
    const id="send_"+a.dataset.max;
    const inp=document.getElementById(id);
    inp.value=inp.max;
  });
  modal.querySelectorAll("[data-send]").forEach(b=>b.onclick=()=>{
    const idx=b.dataset.send.lastIndexOf("_");
    const id=b.dataset.send.slice(0,idx), kind=b.dataset.send.slice(idx+1);
    if(sendMission(id, kind)!==false) closeVillageAction();
  });
  modal.querySelectorAll("[data-gift]").forEach(b=>b.onclick=()=>{ if(sendGift(b.dataset.gift)!==false) closeVillageAction(); });
  modal.querySelectorAll("[data-manage-village]").forEach(b=>b.onclick=()=>{ closeVillageAction(); switchVillage(b.dataset.manageVillage, true); });
}

function missionMarkerPos(m){
  if(m.kind!=="attack" && m.kind!=="scout" && m.kind!=="raid") return null;
  const v=state.village;
  const now=estimateNow();
  let t, fromX,fromY,toX,toY,frac,returning;
  if(m.kind==="raid"){
    t=state.villages.find(x=>x.id===m.sourceVillageId);
    if(!t) return null;
    if(m.resolveDone) return null; // le retour des pillards ne concerne pas la carte du joueur visé
    frac=clamp((now-m.departAt)/Math.max(1,m.travel),0,1);
    fromX=t.x; fromY=t.y; toX=v.x; toY=v.y; returning=false;
  } else {
    t=state.villages.find(x=>x.id===m.targetId);
    if(!t) return null;
    if(!m.resolveDone){
      frac=clamp((now-m.departAt)/Math.max(1,m.travel),0,1);
      fromX=v.x; fromY=v.y; toX=t.x; toY=t.y; returning=false;
    } else {
      const dur=Math.max(1, m.returnAt-m.arriveAt);
      frac=clamp((now-m.arriveAt)/dur,0,1);
      fromX=t.x; fromY=t.y; toX=v.x; toY=v.y; returning=true;
    }
  }
  return { wx: fromX+(toX-fromX)*frac, wy: fromY+(toY-fromY)*frac, returning };
}

/* Cherche un village par id, que ce soit le village actif du joueur (absent de state.villages,
   qui liste tout SAUF le village actif — voir renderMap) ou n'importe quel autre village du monde. */
function findAnyVillage(id){
  if(state.village && state.village.id===id) return state.village;
  return (state.villages||[]).find(x=>x.id===id) || null;
}

/* Position d'un marqueur "monde" (attaque/reconnaissance en approche lancée par un AUTRE joueur) :
   contrairement à missionMarkerPos, ne connaît que le trajet aller (le serveur ne renvoie jamais
   ces missions une fois arrivées — voir buildSnapshot) et ne suppose pas que la source ou la
   cible soit le village du joueur actif. */
function worldMissionMarkerPos(m){
  const from=findAnyVillage(m.sourceVillageId), to=findAnyVillage(m.targetId);
  if(!from || !to) return null;
  const now=estimateNow();
  const frac=clamp((now-m.departAt)/Math.max(1,m.travel),0,1);
  return { wx: from.x+(to.x-from.x)*frac, wy: from.y+(to.y-from.y)*frac, returning:false };
}

function mapMarkerHTML(m, pos, minX, minY, ppf, foreign){
  const left=(pos.wx-minX)*ppf, top=(pos.wy-minY)*ppf;
  const kindCls = m.kind==="scout" ? "marker-scout" : "marker-attack";
  const icon = m.kind==="scout" ? "🔭" : (m.kind==="raid" ? "⚠️" : "⚔️");
  const domId = "marker_"+(foreign?"w_":"")+m.id;
  let label;
  if(foreign){
    label = (m.kind==="scout" ? "Reconnaissance" : "Attaque")+" en approche (autre joueur — composition inconnue)";
  } else {
    label = (m.kind==="scout" ? "Reconnaissance" : (m.kind==="raid" ? "Raid barbare" : "Attaque"))+" "+(pos.returning?"(retour)":"(aller)");
  }
  return `<div class="troop-marker ${kindCls} ${foreign?'marker-foreign':''} ${pos.returning?'marker-returning':''}" id="${domId}" style="left:${left}px; top:${top}px;" title="${label}">
    <div class="tdot">${icon}</div>
  </div>`;
}

function updateMapMarkers(){
  const world=document.getElementById("mapWorld");
  if(!world) return;
  const minX=Number(world.dataset.minx), minY=Number(world.dataset.miny);
  const ppf=mapView.ppf;
  const activeIds=new Set();
  for(const m of state.missions){
    const pos=missionMarkerPos(m);
    if(!pos) continue;
    const domId="marker_"+m.id;
    activeIds.add(domId);
    const left=(pos.wx-minX)*ppf, top=(pos.wy-minY)*ppf;
    let el=document.getElementById(domId);
    if(!el){
      world.insertAdjacentHTML("beforeend", mapMarkerHTML(m, pos, minX, minY, ppf, false));
      continue;
    }
    el.style.left=left+"px";
    el.style.top=top+"px";
    el.classList.toggle("marker-returning", pos.returning);
  }
  for(const m of (state.worldMissions||[])){
    const pos=worldMissionMarkerPos(m);
    if(!pos) continue;
    const domId="marker_w_"+m.id;
    activeIds.add(domId);
    const left=(pos.wx-minX)*ppf, top=(pos.wy-minY)*ppf;
    let el=document.getElementById(domId);
    if(!el){
      world.insertAdjacentHTML("beforeend", mapMarkerHTML(m, pos, minX, minY, ppf, true));
      continue;
    }
    el.style.left=left+"px";
    el.style.top=top+"px";
  }
  world.querySelectorAll(".troop-marker").forEach(el=>{
    if(!activeIds.has(el.id)) el.remove();
  });
}

function renderMap(){
  if(!mapView) mapView={cx:state.village.x, cy:state.village.y, ppf:26};
  const v=state.village, mv=mapView, ppf=mv.ppf;
  const others=state.villages.filter(t=>t.id!==v.id);
  const xs=others.map(t=>t.x).concat(v.x), ys=others.map(t=>t.y).concat(v.y);
  const minX=Math.min(...xs)-3, maxX=Math.max(...xs)+3;
  const minY=Math.min(...ys)-3, maxY=Math.max(...ys)+3;
  const worldW=(maxX-minX)*ppf, worldH=(maxY-minY)*ppf;

  const pins = others.map(t=>{
    const left=(t.x-minX)*ppf, top=(t.y-minY)*ppf;
    const sel = ui.selectedVillage===t.id;
    const mine = t.owner===username;
    const rel = !mine && t.isPlayer ? guildRelationFor(t.guildId) : null;
    // Campement de l'Armée Noire (évènement de lancement) : reste un village barbare ordinaire
    // (owner:"barbarian") côté serveur, mais marqué "faction" pour recevoir un pin NOIR distinct
    // sur la carte, impossible à confondre avec un barbare classique. Une fois conquis, t.isPlayer
    // devient true et ce branchement ne s'applique plus (pin normal du nouveau propriétaire).
    const isBlackArmy = !mine && !t.isPlayer && t.faction==="blackArmy";
    const cls = mine ? "player" : (rel ? rel.cls : (isBlackArmy ? "blackarmy" : (t.isPlayer ? "medium" : TIER_CLASS[t.tier])));
    const iconKind = mine ? "mine" : (isBlackArmy ? "blackarmy" : (t.isPlayer ? "player" : "barbarian"));
    const icon = villageMapIconSvg(iconKind, villageIconLevel(t, mine), (t.wallLevel||0)>0);
    const bonusTxt = t.resourceBonus ? (" · gisement riche : +"+Math.round(t.resourceBonus.pct*100)+"% "+RES_NAME[t.resourceBonus.res].toLowerCase()) : "";
    const blackArmyTxt = isBlackArmy ? (" · 🏴 Armée Noire — Rang "+BLACK_ARMY_RANK_LABEL[t.tier||0]) : "";
    const title = t.name+" ("+t.x+"|"+t.y+")"+(mine?' — vous':(t.isPlayer?(' — '+t.owner):''))+(rel?(' · '+rel.label):'')+bonusTxt+blackArmyTxt;
    const badge = t.resourceBonus ? `<span class="resbonus-badge">${RES_ICON[t.resourceBonus.res]}</span>` : "";
    return `<div class="villagePin ${cls} ${sel?'selected':''}" data-village-pin="${t.id}" style="left:${left}px; top:${top}px;" title="${title}">
      <div class="dot">${icon}${badge}</div>
      ${ppf>=20?`<div class="plabel">${t.x}|${t.y}</div>`:''}
    </div>`;
  }).join("");
  const playerLeft=(v.x-minX)*ppf, playerTop=(v.y-minY)*ppf;
  const playerSel = ui.selectedVillage==="home";
  const playerBonusTxt = v.resourceBonus ? (" · gisement riche : +"+Math.round(v.resourceBonus.pct*100)+"% "+RES_NAME[v.resourceBonus.res].toLowerCase()) : "";
  const playerBadge = v.resourceBonus ? `<span class="resbonus-badge">${RES_ICON[v.resourceBonus.res]}</span>` : "";
  const homeWallLvl = (v.buildings && v.buildings.wall)||0;
  const homeIcon = villageMapIconSvg("mine", homeWallLvl>=10?2:1, homeWallLvl>0);
  const playerPin = `<div class="villagePin player ${playerSel?'selected':''}" data-village-pin="home" style="left:${playerLeft}px; top:${playerTop}px;" title="${v.name} (${v.x}|${v.y})${playerBonusTxt}">
    <div class="dot">${homeIcon}${playerBadge}</div>
    ${ppf>=20?`<div class="plabel">${v.name}</div>`:''}
  </div>`;

  const markers = state.missions.map(m=>{
    const pos=missionMarkerPos(m);
    return pos ? mapMarkerHTML(m, pos, minX, minY, ppf, false) : "";
  }).join("");
  const foreignMarkers = (state.worldMissions||[]).map(m=>{
    const pos=worldMissionMarkerPos(m);
    return pos ? mapMarkerHTML(m, pos, minX, minY, ppf, true) : "";
  }).join("");

  const gridBg = `
    background-image:
      linear-gradient(to right, rgba(255,255,255,.06) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.06) 1px, transparent 1px),
      linear-gradient(to right, rgba(255,255,255,.16) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.16) 1px, transparent 1px);
    background-size:${ppf}px ${ppf}px, ${ppf}px ${ppf}px, ${ppf*10}px ${ppf*10}px, ${ppf*10}px ${ppf*10}px;`;

  const influenceCanvas = `<canvas id="mapInfluence" width="${Math.round(worldW)}" height="${Math.round(worldH)}"></canvas>`;
  const attackLinesCanvas = `<canvas id="mapAttackLines" width="${Math.round(worldW)}" height="${Math.round(worldH)}"></canvas>`;
  const occupiedTiles = new Set(others.map(t=>t.x+","+t.y).concat([v.x+","+v.y]));
  const decor = mapDecorHtml(minX, maxX, minY, maxY, ppf, occupiedTiles);

  return `<h2>Carte du monde</h2>
    <p class="muted small">Glissez la carte pour explorer, molette pour zoomer, cliquez sur un village pour ouvrir ses informations et lui envoyer des troupes. 👤 = village d'un autre joueur.</p>
    <p class="muted small">🗺️ Zones d'influence (purement visuelles, sans effet sur le jeu) :</p>
    <div class="legend-row">
      <span class="legend-chip" style="color:var(--gold);"><i style="background:currentColor;"></i>vous</span>
      <span class="legend-chip" style="color:var(--green);"><i style="background:currentColor;"></i>allié</span>
      <span class="legend-chip" style="color:var(--blue);"><i style="background:currentColor;"></i>pacte</span>
      <span class="legend-chip" style="color:var(--red);"><i style="background:currentColor;"></i>guerre</span>
      <span class="legend-chip" style="color:#9a7526;"><i style="background:currentColor;"></i>autre joueur</span>
    </div>
    <p class="muted small">⚔️/🔭 pleins et animés = vos propres troupes en mouvement. ⚔️/🔭 pointillés et discrets = attaque ou reconnaissance d'un <b>autre joueur</b> actuellement en approche (composition et identité de l'attaquant non révélées, comme partout ailleurs tant qu'aucune reconnaissance n'a réussi). Une ligne pointillée rouge relie l'origine et la cible de chaque attaque en cours.</p>
    ${renderMapToolbar()}
    <div id="mapCanvas">
      <div id="mapWorld" data-minx="${minX}" data-miny="${minY}" style="width:${worldW}px; height:${worldH}px;${gridBg}">
        ${influenceCanvas}${attackLinesCanvas}${decor}${pins}${playerPin}${markers}${foreignMarkers}
      </div>
    </div>`;
}

function positionMapWorld(){
  const canvas=document.getElementById("mapCanvas");
  const world=document.getElementById("mapWorld");
  if(!canvas||!world||!mapView) return;
  const mv=mapView;
  const minX=Number(world.dataset.minx), minY=Number(world.dataset.miny);
  world.style.left = (canvas.clientWidth/2 - (mv.cx-minX)*mv.ppf) + "px";
  world.style.top = (canvas.clientHeight/2 - (mv.cy-minY)*mv.ppf) + "px";
}

/* Couleurs des zones d'influence (RGB, sans le "rgb()") — reprennent exactement la palette déjà
   utilisée pour colorer les pins de village selon la diplomatie (voir guildRelationFor), pour que
   la carte reste cohérente. "Autre joueur" (sans relation ni guilde en commun) reste une teinte
   neutre unique : on ne cherche pas à distinguer chaque guilde adverse par sa propre couleur, afin
   de ne pas transformer la carte en bruit arc-en-ciel — l'objectif est purement décoratif. */
const ZONE_RGB = { mine:"193,121,62", ally:"107,171,94", pact:"91,147,176", war:"193,91,70", other:"154,117,38" };

/* Dessine les zones d'influence (halos semi-transparents) autour de chaque village de joueur sur
   le canvas #mapInfluence, en superposition sous les pins. Purement cosmétique : rayon fixe, ne
   révèle aucune information cachée (troupes/ressources restent soumises à reconnaissance comme
   partout ailleurs) — seule la relation diplomatique déjà publique (carte, onglet Guilde) et
   l'appartenance à une guilde (déjà visible via le pin) déterminent la couleur. Appelé après
   chaque rendu complet de la carte (positionMapWorld) ; pas besoin de redessiner pendant un
   glissé, le canvas étant un enfant de #mapWorld qui se déplace avec lui automatiquement. */
function drawMapInfluence(){
  const canvas=document.getElementById("mapInfluence");
  const world=document.getElementById("mapWorld");
  if(!canvas||!world||!mapView) return;
  const ctx=canvas.getContext("2d");
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const minX=Number(world.dataset.minx), minY=Number(world.dataset.miny);
  const ppf=mapView.ppf;
  const v=state.village;
  const radius=ppf*3.2;

  const zoneOf=(t, mine)=>{
    if(mine) return ZONE_RGB.mine;
    const rel = t.isPlayer ? guildRelationFor(t.guildId) : null;
    return rel ? ZONE_RGB[rel.type==="war"?"war":(rel.type==="alliance"?"ally":"pact")] : ZONE_RGB.other;
  };
  const drawZone=(x, y, rgb)=>{
    const cx=(x-minX)*ppf, cy=(y-minY)*ppf;
    const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,radius);
    grad.addColorStop(0, "rgba("+rgb+",.30)");
    grad.addColorStop(1, "rgba("+rgb+",0)");
    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.arc(cx,cy,radius,0,Math.PI*2);
    ctx.fill();
  };

  ctx.globalCompositeOperation="lighter"; // les zones qui se chevauchent s'illuminent, pour montrer la densité de territoire
  for(const t of state.villages){
    if(t.id===v.id || !t.isPlayer) continue;
    drawZone(t.x, t.y, zoneOf(t, t.owner===username));
  }
  drawZone(v.x, v.y, ZONE_RGB.mine); // village actif : toujours "vous", même s'il a été conquis récemment
  ctx.globalCompositeOperation="source-over";
}

/* Extrémités (village source -> village cible, en coordonnées monde) du trajet complet d'une
   attaque/raid du joueur actif, pour tracer la ligne pointillée qui cible le village attaqué (voir
   drawMapAttackLines). Reprend la même logique source/cible que missionMarkerPos ci-dessus, mais
   renvoie le segment entier plutôt que la position interpolée du marqueur le long de ce segment. */
function missionLineEndpoints(m){
  if(m.kind!=="attack" && m.kind!=="raid") return null;
  const v=state.village;
  if(m.kind==="raid"){
    if(m.resolveDone) return null; // le retour des pillards ne concerne pas la carte du joueur visé
    const t=state.villages.find(x=>x.id===m.sourceVillageId);
    if(!t) return null;
    return { x1:t.x, y1:t.y, x2:v.x, y2:v.y };
  }
  const t=state.villages.find(x=>x.id===m.targetId);
  if(!t) return null;
  return { x1:v.x, y1:v.y, x2:t.x, y2:t.y };
}

/* Idem missionLineEndpoints, mais pour une attaque "monde" lancée par un AUTRE joueur (voir
   worldMissionMarkerPos) : uniquement les attaques (pas les reconnaissances, invisibles sur la
   carte tant qu'elles n'ont pas été détectées) — composition et identité restent masquées, seule
   la trajectoire (déjà publique via le marqueur pointillé existant) est soulignée. */
function worldMissionLineEndpoints(m){
  if(m.kind!=="attack") return null;
  const from=findAnyVillage(m.sourceVillageId), to=findAnyVillage(m.targetId);
  if(!from || !to) return null;
  return { x1:from.x, y1:from.y, x2:to.x, y2:to.y };
}

/* Trace, sur le canvas #mapAttackLines, une ligne pointillée reliant l'origine et la cible de
   chaque attaque/raid actuellement en cours (les nôtres et celles des autres joueurs visibles sur
   la carte) — permet de repérer d'un coup d'œil quel village est visé, en plus du marqueur mobile
   qui progresse déjà le long de ce trajet. Purement visuel, ne révèle aucune information qui ne
   soit pas déjà publique via les marqueurs existants. */
function drawMapAttackLines(){
  const canvas=document.getElementById("mapAttackLines");
  const world=document.getElementById("mapWorld");
  if(!canvas||!world||!mapView) return;
  const ctx=canvas.getContext("2d");
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const minX=Number(world.dataset.minx), minY=Number(world.dataset.miny);
  const ppf=mapView.ppf;

  const drawLine=(x1,y1,x2,y2,color)=>{
    ctx.beginPath();
    ctx.setLineDash([6,5]);
    ctx.strokeStyle=color;
    ctx.lineWidth=1.5;
    ctx.moveTo((x1-minX)*ppf,(y1-minY)*ppf);
    ctx.lineTo((x2-minX)*ppf,(y2-minY)*ppf);
    ctx.stroke();
  };

  for(const m of state.missions){
    const seg=missionLineEndpoints(m);
    if(seg) drawLine(seg.x1,seg.y1,seg.x2,seg.y2,"rgba(201,92,74,.75)");
  }
  for(const m of (state.worldMissions||[])){
    const seg=worldMissionLineEndpoints(m);
    if(seg) drawLine(seg.x1,seg.y1,seg.x2,seg.y2,"rgba(201,92,74,.35)");
  }
  ctx.setLineDash([]);
}

function attachMapHandlers(){
  const canvas=document.getElementById("mapCanvas");
  const world=document.getElementById("mapWorld");
  if(!canvas||!world) return;
  positionMapWorld();

  let dragging=false, moved=false, startX=0, startY=0, baseLeft=0, baseTop=0;
  canvas.onpointerdown=(e)=>{
    dragging=true; moved=false; mapDragging=true; startX=e.clientX; startY=e.clientY;
    baseLeft=parseFloat(world.style.left)||0; baseTop=parseFloat(world.style.top)||0;
    canvas.classList.add("dragging");
    canvas.setPointerCapture(e.pointerId);
  };
  canvas.onpointermove=(e)=>{
    if(!dragging) return;
    const dx=e.clientX-startX, dy=e.clientY-startY;
    if(Math.abs(dx)+Math.abs(dy)>4) moved=true;
    world.style.left=(baseLeft+dx)+"px";
    world.style.top=(baseTop+dy)+"px";
  };
  const endDrag=(e)=>{
    if(!dragging) return;
    dragging=false;
    mapDragging=false;
    canvas.classList.remove("dragging");
    if(e && e.pointerId!=null){ try{ canvas.releasePointerCapture(e.pointerId); }catch(err){} }
    if(moved){
      const left=parseFloat(world.style.left)||0, top=parseFloat(world.style.top)||0;
      const minX=Number(world.dataset.minx), minY=Number(world.dataset.miny);
      mapView.cx = minX + (canvas.clientWidth/2-left)/mapView.ppf;
      mapView.cy = minY + (canvas.clientHeight/2-top)/mapView.ppf;
      mapJustDragged=true;
      renderActiveTabContent(); // re-synchronise avec les données reçues pendant le glissé (bloqué le temps du drag)
    } else if(e){
      // simple tap (no drag): select whichever village pin is under the pointer.
      // pointer capture retargets the native click to the canvas itself, so we
      // resolve the actual element manually instead of relying on that click event.
      const el=document.elementFromPoint(e.clientX, e.clientY);
      const pinEl = el && el.closest ? el.closest("[data-village-pin]") : null;
      if(pinEl){
        const raw=pinEl.dataset.villagePin;
        openVillageAction(raw==="home" ? "home" : raw);
      } else {
        renderActiveTabContent();
      }
    }
  };
  canvas.onpointerup=endDrag;
  canvas.onpointercancel=endDrag;

  // Molette de la souris : zoom centré sur le curseur, pour une carte plus interactive.
  canvas.onwheel=(e)=>{
    e.preventDefault();
    const rect=canvas.getBoundingClientRect();
    const minX=Number(world.dataset.minx), minY=Number(world.dataset.miny);
    const oldPpf=mapView.ppf;
    const newPpf=Math.max(12, Math.min(48, oldPpf + (e.deltaY<0?4:-4)));
    if(newPpf===oldPpf) return;
    // garde le point du monde sous le curseur immobile pendant le zoom
    const cursorX=e.clientX-rect.left, cursorY=e.clientY-rect.top;
    const worldX = mapView.cx + (cursorX-canvas.clientWidth/2)/oldPpf;
    const worldY = mapView.cy + (cursorY-canvas.clientHeight/2)/oldPpf;
    mapView.ppf=newPpf;
    mapView.cx = worldX - (cursorX-canvas.clientWidth/2)/newPpf;
    mapView.cy = worldY - (cursorY-canvas.clientHeight/2)/newPpf;
    renderActiveTabContent();
  };

  document.getElementById("btnZoomIn").onclick=()=>{ mapView.ppf=Math.min(48, mapView.ppf+6); renderActiveTabContent(); };
  document.getElementById("btnZoomOut").onclick=()=>{ mapView.ppf=Math.max(12, mapView.ppf-6); renderActiveTabContent(); };
  document.getElementById("btnRecenter").onclick=()=>{ mapView.cx=state.village.x; mapView.cy=state.village.y; renderActiveTabContent(); };
  document.getElementById("btnJump").onclick=()=>{
    const x=Number(document.getElementById("jumpX").value), y=Number(document.getElementById("jumpY").value);
    if(Number.isFinite(x) && Number.isFinite(y)){ mapView.cx=x; mapView.cy=y; renderActiveTabContent(); }
  };
}

function renderReportFilters(){
  return `<div class="report-filters">${REPORT_FILTERS.map(f=>{
    const count = f.key==="all" ? state.reports.length : state.reports.filter(r=>reportMatchesFilter(r,f)).length;
    return `<button class="filter-btn ${reportFilter===f.key?'active':''}" data-report-filter="${f.key}">${f.label} (${count})</button>`;
  }).join("")}</div>`;
}

function reportActions(r){
  return `<span class="actions"><span class="small muted">${fmtTime(Math.max(0,estimateNow()-r.time))}</span><button class="report-del" data-delete-report="${r.id}" title="Supprimer ce rapport">🗑️</button></span>`;
}

/* ===================== Graphiques de combat (rapports "attack"/"defense") =====================
   Avant : les rapports de combat n'étaient que du texte compact (une ligne par info). Remplacé par
   trois petits graphiques SVG en ligne (sans dépendance externe, cohérents avec le thème du jeu) :
   comparaison des puissances, composition détaillée de l'armée attaquante (envoyés/survivants/
   perdus, connue en intégralité côté serveur — voir resolveAttack), et pertes du camp défenseur
   (connues seulement en nombre, jamais l'effectif total défenseur, qui reste secret). Les deux
   rapports "attack" et "defense" partagent exactement les mêmes champs de combat (voir
   gameLogic.js/resolveAttack et resolveRaid), donc une seule implémentation sert aux deux — ainsi
   qu'aux raids de pillards, qui produisent eux aussi un rapport de kind "defense". */
const COMBAT_CHART_COLOR = { attack:"#c15b46", defense:"#5b93b0", survive:"#6bab5e", loss:"#c15b46" };

function combatPowerChartSvg(r){
  const W=460, barX=96, barW=270, barH=16, rowGap=36;
  const maxPower = Math.max(r.attackPower||0, r.effAttack||0, r.defensePower||0, 1);
  const scale = v => Math.max(0, Math.min(barW, (v/maxPower)*barW));
  const attackWon = r.winner==="attacker";
  const effX = barX + scale(r.effAttack);
  const luckPct = Math.round((r.luck||0)*100);
  const luckLabel = (luckPct>=0?"+":"")+luckPct+"% chance";
  const H = rowGap*2+14;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; max-width:460px; height:auto; display:block;" role="img" aria-label="Comparaison de la puissance d'attaque et de défense">
    <text x="0" y="13" font-size="12" fill="${COMBAT_CHART_COLOR.attack}" font-weight="bold">⚔️ Attaque${attackWon?' 🏆':''}</text>
    <rect x="${barX}" y="3" width="${barW}" height="${barH}" rx="4" fill="#000" opacity="0.2"></rect>
    <rect x="${barX}" y="3" width="${scale(r.attackPower)}" height="${barH}" rx="4" fill="${COMBAT_CHART_COLOR.attack}" opacity="0.55"></rect>
    <line x1="${effX}" y1="0" x2="${effX}" y2="${3+barH+4}" stroke="#f2e6c8" stroke-width="2"></line>
    <text x="${Math.max(20,Math.min(W-20,effX))}" y="${3+barH+15}" font-size="9" fill="#f2e6c8" text-anchor="middle">${luckLabel}</text>
    <text x="${barX+barW+8}" y="15" font-size="11" fill="#f2e6c8">${fmt(r.attackPower)}</text>
    <text x="0" y="${rowGap+13}" font-size="12" fill="${COMBAT_CHART_COLOR.defense}" font-weight="bold">🛡️ Défense${!attackWon?' 🏆':''}</text>
    <rect x="${barX}" y="${rowGap+3}" width="${barW}" height="${barH}" rx="4" fill="#000" opacity="0.2"></rect>
    <rect x="${barX}" y="${rowGap+3}" width="${scale(r.defensePower)}" height="${barH}" rx="4" fill="${COMBAT_CHART_COLOR.defense}"></rect>
    <text x="${barX+barW+8}" y="${rowGap+15}" font-size="11" fill="#f2e6c8">${fmt(r.defensePower)}</text>
  </svg>`;
}

function combatTroopsChartSvg(r){
  const rows = TROOP_ORDER.filter(k=>(r.troopsSent&&r.troopsSent[k]>0));
  if(!rows.length) return "";
  const W=460, barX=92, barW=230, barH=14, rowH=22;
  const maxSent = Math.max(1, ...rows.map(k=>r.troopsSent[k]||0));
  const scale = v => Math.max(0, Math.min(barW, (v/maxSent)*barW));
  const H = rows.length*rowH+4;
  const bars = rows.map((k,i)=>{
    const sent=r.troopsSent[k]||0;
    const survived=(r.attackerSurvivors&&r.attackerSurvivors[k])||0;
    const survivedW=scale(survived);
    const lostW=Math.max(0, scale(sent)-survivedW);
    const y=i*rowH;
    return `<text x="0" y="${y+11}" font-size="10" fill="#f2e6c8">${TROOPS[k].name}</text>
      <rect x="${barX}" y="${y+1}" width="${scale(sent)}" height="${barH}" rx="3" fill="#000" opacity="0.2"></rect>
      <rect x="${barX}" y="${y+1}" width="${survivedW}" height="${barH}" rx="3" fill="${COMBAT_CHART_COLOR.survive}"></rect>
      <rect x="${barX+survivedW}" y="${y+1}" width="${lostW}" height="${barH}" fill="${COMBAT_CHART_COLOR.loss}"></rect>
      <text x="${barX+barW+8}" y="${y+11}" font-size="9" fill="#bfa878">${fmt(sent)} env. · ${fmt(survived)} vivants</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; max-width:460px; height:auto; display:block;" role="img" aria-label="Composition de l'armée attaquante : envoyés, survivants et perdus par type de troupe">${bars}</svg>`;
}

function combatDefenderLossesChartSvg(r){
  const rows = TROOP_ORDER.filter(k=>(r.defenderLosses&&r.defenderLosses[k]>0));
  if(!rows.length) return "";
  const W=460, barX=92, barW=230, barH=14, rowH=22;
  const maxLoss = Math.max(1, ...rows.map(k=>r.defenderLosses[k]||0));
  const scale = v => Math.max(0, Math.min(barW, (v/maxLoss)*barW));
  const H = rows.length*rowH+4;
  const bars = rows.map((k,i)=>{
    const lost=r.defenderLosses[k]||0;
    const y=i*rowH;
    return `<text x="0" y="${y+11}" font-size="10" fill="#f2e6c8">${TROOPS[k].name}</text>
      <rect x="${barX}" y="${y+1}" width="${barW}" height="${barH}" rx="3" fill="#000" opacity="0.2"></rect>
      <rect x="${barX}" y="${y+1}" width="${scale(lost)}" height="${barH}" rx="3" fill="${COMBAT_CHART_COLOR.loss}"></rect>
      <text x="${barX+barW+8}" y="${y+11}" font-size="9" fill="#bfa878">-${fmt(lost)}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; max-width:460px; height:auto; display:block;" role="img" aria-label="Pertes subies par le camp défenseur, par type de troupe">${bars}</svg>`;
}

function combatChartsHtml(r, defenderLossesTitle){
  const troopsChart = combatTroopsChartSvg(r);
  const defLossesChart = combatDefenderLossesChartSvg(r);
  return `<div class="combat-chart">
    <div class="chart-block"><div class="chart-title">Puissance de combat${r.attackShare?(' — répartition infanterie '+r.attackShare.inf+'% / cavalerie '+r.attackShare.cav+'% / archers '+r.attackShare.arch+'%'):''}</div>${combatPowerChartSvg(r)}</div>
    ${troopsChart?`<div class="chart-block"><div class="chart-title">Armée attaquante</div>${troopsChart}</div>`:''}
    ${defLossesChart?`<div class="chart-block"><div class="chart-title">${defenderLossesTitle||"Pertes côté défense"}</div>${defLossesChart}</div>`:''}
  </div>`;
}

  const filterBar = renderReportFilters();

  const activeFilterObj = REPORT_FILTERS.find(f=>f.key===reportFilter);
  const filtered = reportFilter==="all" ? state.reports : state.reports.filter(r=>reportMatchesFilter(r, activeFilterObj));
  const bulkLabel = reportFilter==="all" ? "tous les rapports" : "les rapports affichés";
  const bulkBar = `<div class="flex-between" style="margin-bottom:10px;">
    <span class="small muted">${filtered.length} rapport${filtered.length>1?'s':''} affiché${filtered.length>1?'s':''}</span>
    <button id="btnClearReports" class="small" ${filtered.length?'':'disabled'} data-clear-kind="${reportFilter==="all"?"":reportFilter}">🗑️ Supprimer ${bulkLabel}</button>
  </div>`;
  if(!filtered.length) return `<h2>Rapports</h2>${filterBar}${bulkBar}<p class="muted">Aucun rapport dans cette catégorie.</p>`;
  const items=filtered.map((r)=>{
    const open=ui.openReport.has(r.id);
    if(r.kind==="attack"){
      const win=r.winner==="attacker";
      const titleLabel = r.conquered ? "👑 Village conquis" : (win?'🏆 Victoire':'💀 Défaite');
      return `<div class="report ${win?'win':'lose'}">
        <div class="title" data-toggle="${r.id}"><span><span class="report-pill ${win?'win':'lose'}">${titleLabel}</span> contre ${r.target} (${r.coord})${r.targetIsPlayer?(' — joueur '+r.targetOwner):''}</span>${reportActions(r)}</div>
        <div class="details ${open?'open':''}">
          ${combatChartsHtml(r, "Pertes infligées au défenseur")}
          ${r.nobleSent?`<div class="small muted" style="margin-top:4px;">Noble(s) envoyé(s) : ${r.nobleSent}, ayant survécu au combat : ${r.nobleSurvived}${r.nobleSurvivalChancePct!=null?(' (chance de survie '+r.nobleSurvivalChancePct+'%)'):''}${r.conquered?' — a pris possession du village !':(r.nobleSurvived>0?' — consommé (pas de retour).':'')}</div>`:""}
          ${win?`<div class="small muted" style="margin-top:4px;">Butin : 🪵${r.loot.wood} 🧱${r.loot.clay} ⛏️${r.loot.iron}</div>`:""}
          ${r.wallDamage?`<div class="small muted" style="margin-top:4px;">Muraille adverse endommagée : -${r.wallDamage} niveau(x)${r.targetWallLevelAfter!=null?(' (reste niveau '+r.targetWallLevelAfter+')'):''}</div>`:""}
          ${r.storageDamageFrac?`<div class="small muted" style="margin-top:4px;">Entrepôt adverse endommagé : -${Math.round(r.storageDamageFrac*100)}% de capacité</div>`:""}
          ${r.loyaltyReduced?`<div class="small muted" style="margin-top:4px;">Loyauté réduite de ${r.loyaltyReduced}% (reste ${Math.round(r.targetLoyalty)}%)${r.conquered?" — village conquis !":""}</div>`:""}
        </div>
      </div>`;
    } else if(r.kind==="defense"){
      const win=r.winner==="attacker";
      return `<div class="report defense">
        <div class="title" data-toggle="${r.id}"><span><span class="report-pill ${win?'lose':'win'}">${win?'💀 Raid subi':'🛡️ Repoussé'}</span> de ${r.source}</span>${reportActions(r)}</div>
        <div class="details ${open?'open':''}">
          ${combatChartsHtml(r, "Vos pertes")}
          ${r.wallDamage?`<div class="small muted" style="margin-top:4px;">Votre muraille a été endommagée : -${r.wallDamage} niveau(x)${r.targetWallLevelAfter!=null?(' (reste niveau '+r.targetWallLevelAfter+')'):''}</div>`:""}
          <div class="small muted" style="margin-top:4px;">${win?`Ressources pillées : 🪵${r.loot.wood} 🧱${r.loot.clay} ⛏️${r.loot.iron}`:"Aucune perte de ressources."}</div>

    } else if(r.kind==="scout"){

        // Reconnaissance perdue : soit le village a disparu entre-temps, soit un contre-espionnage

          <div class="title" data-toggle="${r.id}"><span>🔭 Reconnaissance échouée${r.target?(' contre '+r.target+' ('+r.coord+')'):''}</span>${reportActions(r)}</div>

        <div class="details ${open?'open':''}">

          Troupes : ${TROOP_ORDER.map(k=>TROOPS[k].name+" "+(r.troops[k]||0)).join(", ")}<br>

        <div class="title" data-toggle="${r.id}"><span>⚠️ Raid de pillards</span>${reportActions(r)}</div>
        <div class="details ${open?'open':''}">Ressources perdues : 🪵${(r.lost&&r.lost.wood)||0} 🧱${(r.lost&&r.lost.clay)||0} ⛏️${(r.lost&&r.lost.iron)||0}</div>

        <div class="title"><span>🤝 Renfort reçu de ${escapeHtml(r.from)}</span>${reportActions(r)}</div>
        <div class="details open">${fmtTroops(r.troops)}</div>
      </div>`;
    } else if(r.kind==="supportOut"){
      return `<div class="report support">
        <div class="title"><span>🤝 Renfort envoyé${r.lost?'':(' vers '+r.target+' ('+r.coord+')')}</span>${reportActions(r)}</div>
        <div class="details open">${r.lost?escapeHtml(r.text||''):fmtTroops(r.troops)}</div>
      </div>`;
    } else if(r.kind==="giftIn"){
      return `<div class="report gift">
        <div class="title"><span>🎁 Don reçu de ${escapeHtml(r.from)}</span>${reportActions(r)}</div>
        <div class="details open">🪵${fmt(r.wood)} 🧱${fmt(r.clay)} ⛏️${fmt(r.iron)}</div>
      </div>`;
    } else if(r.kind==="giftOut"){
      return `<div class="report gift">
        <div class="title"><span>🎁 Don envoyé à ${escapeHtml(r.target)}</span>${reportActions(r)}</div>
        <div class="details open">🪵${fmt(r.wood)} 🧱${fmt(r.clay)} ⛏️${fmt(r.iron)}</div>
      </div>`;
    } else if(r.kind==="marketSold"){
      return `<div class="report market">
        <div class="title"><span>🏪 Offre acceptée par ${escapeHtml(r.other)}</span>${reportActions(r)}</div>
        <div class="details open">Vous avez donné ${RES_ICON[r.giveRes]} ${fmt(r.giveAmount)} ${RES_NAME[r.giveRes].toLowerCase()} contre ${RES_ICON[r.wantRes]} ${fmt(r.wantAmount)} ${RES_NAME[r.wantRes].toLowerCase()} reçu(e)(s).</div>
      </div>`;
    } else if(r.kind==="marketBought"){
      return `<div class="report market">
        <div class="title"><span>🏪 Échange conclu avec ${escapeHtml(r.other)}</span>${reportActions(r)}</div>
        <div class="details open">Vous avez donné ${RES_ICON[r.wantRes]} ${fmt(r.wantAmount)} ${RES_NAME[r.wantRes].toLowerCase()} contre ${RES_ICON[r.giveRes]} ${fmt(r.giveAmount)} ${RES_NAME[r.giveRes].toLowerCase()} reçu(e)(s).</div>
      </div>`;
    } else if(r.kind==="guildInvite"){
      return `<div class="report guild">
        <div class="title"><span>👥 Invitation de guilde : [${escapeHtml(r.guildTag)}] ${escapeHtml(r.guildName)} (par ${escapeHtml(r.from)})</span>${reportActions(r)}</div>

      return `<div class="report guild">
        <div class="title"><span>🤝 [${escapeHtml(r.fromGuildTag)}] ${escapeHtml(r.fromGuildName)} a accepté ${DIPLOMACY_LABEL_LOWER[r.relType]}</span>${reportActions(r)}</div>
      </div>`;
    } else if(r.kind==="diplomacyDeclined"){
      return `<div class="report guild">
        <div class="title"><span>❌ [${escapeHtml(r.fromGuildTag)}] ${escapeHtml(r.fromGuildName)} a refusé ${DIPLOMACY_LABEL_LOWER[r.relType]}</span>${reportActions(r)}</div>
      </div>`;
    } else if(r.kind==="diplomacyEnded"){
      return `<div class="report guild">
        <div class="title"><span>💔 [${escapeHtml(r.fromGuildTag)}] ${escapeHtml(r.fromGuildName)} a ${r.wasPending?"retiré sa proposition de ":"mis fin à "}${DIPLOMACY_LABEL_LOWER[r.relType]}</span>${reportActions(r)}</div>
      </div>`;
    } else if(r.kind==="diplomacyWar"){
      return `<div class="report defense">
        <div class="title"><span>⚔️ [${escapeHtml(r.fromGuildTag)}] ${escapeHtml(r.fromGuildName)} vous a déclaré la guerre !</span>${reportActions(r)}</div>
      </div>`;
    } else if(r.kind==="announcement"){
      return `<div class="report announcement">
        <div class="title"><span>📢 Annonce${r.author?(' de '+escapeHtml(r.author)):''}</span>${reportActions(r)}</div>
        <div class="details open" style="white-space:pre-wrap;">${escapeHtml(r.text||'')}</div>
      </div>`;
    }
    return `<div class="report"><div class="title"><span>${r.text||''}</span>${reportActions(r)}</div></div>`;
  }).join("");
  return `<h2>Rapports</h2>${filterBar}${bulkBar}${items}`;
}

/* Marché : offres d'échange publiques entre joueurs. La ressource proposée est mise en dépôt dès
   la publication (voir doMarketCreateOffer côté serveur) ; ce tableau se contente d'afficher
   state.market (déjà trié du plus récent au plus ancien par buildSnapshot) et de proposer les
   actions Annuler (sur ses propres offres) / Échanger (sur celles des autres). */
function renderMarket(){
  const v = state.village;
  const offers = state.market||[];
  const mine = offers.filter(o=>o.seller===username);
  const others = offers.filter(o=>o.seller!==username);

  const resOptionsHtml = (selected) => ["wood","clay","iron"].map(r=>
    `<option value="${r}" ${r===selected?'selected':''}>${RES_ICON[r]} ${RES_NAME[r]}</option>`).join("");

  const stockLine = `<p class="small muted">Votre stock actuel : ${["wood","clay","iron"].map(r=>`${RES_ICON[r]} ${fmt(v.resources[r])}`).join(" · ")}</p>`;

  const createBox = `
    <div class="box">
      <h3>➕ Publier une offre</h3>
      <p class="small muted">La ressource proposée est mise en dépôt immédiatement (retirée de votre village) ; elle vous est rendue si vous annulez l'offre avant qu'un autre joueur ne l'accepte. Échange instantané, sans marchand ni délai de trajet.</p>
      ${stockLine}
      <form id="marketCreateForm" style="display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end;">
        <div>
          <label class="small muted">Je donne</label><br>
          <select id="marketGiveRes">${resOptionsHtml("wood")}</select>
          <input type="number" id="marketGiveAmount" min="1" max="1000000" value="500" style="width:110px;">
        </div>
        <div>
          <label class="small muted">Je veux en échange</label><br>
          <select id="marketWantRes">${resOptionsHtml("clay")}</select>
          <input type="number" id="marketWantAmount" min="1" max="1000000" value="500" style="width:110px;">
        </div>
        <button type="submit" class="primary">📣 Publier l'offre</button>
      </form>
    </div>`;

  const offerRow = (o, isMine) => `
    <div class="flex-between" style="background:rgba(0,0,0,0.15); padding:8px 12px; border-radius:8px; margin-bottom:6px;">
      <span>
        ${isMine?'':`<span class="player-link" data-open-profile="${escapeHtml(o.seller)}">${escapeHtml(o.seller)}</span> — `}donne
        ${RES_ICON[o.giveRes]} <b>${fmt(o.giveAmount)}</b> ${RES_NAME[o.giveRes].toLowerCase()}
        contre ${RES_ICON[o.wantRes]} <b>${fmt(o.wantAmount)}</b> ${RES_NAME[o.wantRes].toLowerCase()}
      </span>
      ${isMine
        ? `<button data-market-cancel="${o.id}">🗑️ Annuler</button>`
        : `<button class="primary" data-market-accept="${o.id}">🤝 Échanger</button>`}
    </div>`;

  const othersBox = `
    <div class="box">
      <h3>🌍 Offres des autres joueurs (${others.length})</h3>
      ${others.length ? others.map(o=>offerRow(o,false)).join("") : `<p class="small muted">Aucune offre disponible pour l'instant.</p>`}
    </div>`;

  const mineBox = `
    <div class="box">
      <h3>📋 Mes offres (${mine.length})</h3>
      ${mine.length ? mine.map(o=>offerRow(o,true)).join("") : `<p class="small muted">Vous n'avez publié aucune offre.</p>`}
    </div>`;

  return `<h2>🏪 Marché</h2>
    <p class="muted small">Échangez vos surplus de ressources contre ce qui vous manque. Publiez une offre ou acceptez celle d'un autre joueur.</p>
    ${createBox}
    ${othersBox}
    ${mineBox}`;
}

function attachMarketHandlers(){
  const form=document.getElementById("marketCreateForm");
  if(form) form.onsubmit=(e)=>{
    e.preventDefault();
    const giveRes=document.getElementById("marketGiveRes").value;
    const giveAmount=Number(document.getElementById("marketGiveAmount").value);
    const wantRes=document.getElementById("marketWantRes").value;
    const wantAmount=Number(document.getElementById("marketWantAmount").value);
    if(giveRes===wantRes){ toast("⚠️ Choisissez deux ressources différentes."); return; }
    if(!giveAmount || giveAmount<=0 || !wantAmount || wantAmount<=0){ toast("⚠️ Indiquez des quantités valides."); return; }
    doAction(()=>apiCall("/api/market/offer","POST",{giveRes, giveAmount, wantRes, wantAmount}), "📣 Offre publiée sur le marché.", null);
  };
}
