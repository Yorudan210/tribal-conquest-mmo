    const clay=Number(document.getElementById("adminGiveAll_clay").value)||0;
    const iron=Number(document.getElementById("adminGiveAll_iron").value)||0;
    if(!wood && !clay && !iron){ toast("⚠️ Indiquez au moins une ressource à donner."); return; }
    adminAction(()=>apiCall("/api/admin/give-all","POST",{wood, clay, iron}), "Ressources données à tous les joueurs.");
  };
  const filterInput=document.getElementById("adminPlayerFilter");
  if(filterInput) filterInput.oninput=()=>{
    adminPlayerFilter = filterInput.value;
    rerenderPreservingInputs(document.getElementById("tabContent"), renderActiveTabContent);
  };
  const toggleBtn=document.getElementById("btnToggleAdmin");
  if(toggleBtn) toggleBtn.onclick=()=>{
    const u=toggleBtn.dataset.user, flag=toggleBtn.dataset.flag==="1";
    adminAction(()=>apiCall("/api/admin/setadmin","POST",{username:u, isAdmin:flag}), flag?("Droits admin accordés à "+u+"."):("Droits admin retirés à "+u+"."));
  };
  document.querySelectorAll("[data-finish-mission]").forEach(b=>b.onclick=()=>{
    adminAction(()=>apiCall("/api/admin/finish-mission","POST",{missionId:b.dataset.finishMission}), "Mission résolue instantanément.");
  });
  const finishBuildBtn=document.getElementById("btnFinishBuild");
  if(finishBuildBtn) finishBuildBtn.onclick=()=>{
    adminAction(()=>apiCall("/api/admin/finish-build","POST",{username:finishBuildBtn.dataset.user}), "Construction(s) terminée(s) instantanément.");
  };
  const finishTrainBtn=document.getElementById("btnFinishTrain");
  if(finishTrainBtn) finishTrainBtn.onclick=()=>{
    adminAction(()=>apiCall("/api/admin/finish-train","POST",{username:finishTrainBtn.dataset.user}), "Entraînement(s) terminé(s) instantanément.");
  };
  const setResBtn=document.getElementById("btnSetResources");
  if(setResBtn) setResBtn.onclick=()=>{
    const u=setResBtn.dataset.user;
    const resources={
      wood:Number(document.getElementById("adminRes_wood").value)||0,
      clay:Number(document.getElementById("adminRes_clay").value)||0,
      iron:Number(document.getElementById("adminRes_iron").value)||0
    };
    adminAction(()=>apiCall("/api/admin/village","POST",{username:u, resources}), "Ressources mises à jour pour "+u+".");
  };
  const giveResBtn=document.getElementById("btnGiveResources");
  if(giveResBtn) giveResBtn.onclick=()=>{
    const u=giveResBtn.dataset.user;
    const wood=Number(document.getElementById("adminRes_wood").value)||0;
    const clay=Number(document.getElementById("adminRes_clay").value)||0;
    const iron=Number(document.getElementById("adminRes_iron").value)||0;
    adminAction(()=>apiCall("/api/admin/give","POST",{username:u, wood, clay, iron}), "Ressources données à "+u+".");
  };
  const setBuildBtn=document.getElementById("btnSetBuildings");
  if(setBuildBtn) setBuildBtn.onclick=()=>{
    const u=setBuildBtn.dataset.user;
    const buildings={};
    BUILD_ORDER.forEach(k=>{ const el=document.getElementById("adminBuild_"+k); if(el) buildings[k]=Number(el.value)||0; });
    adminAction(()=>apiCall("/api/admin/village","POST",{username:u, buildings}), "Bâtiments mis à jour pour "+u+".");
  };
  const setTroopBtn=document.getElementById("btnSetTroops");
  if(setTroopBtn) setTroopBtn.onclick=()=>{
    const u=setTroopBtn.dataset.user;
    const troops={};
    TROOP_ORDER.forEach(k=>{ const el=document.getElementById("adminTroop_"+k); if(el) troops[k]=Number(el.value)||0; });
    adminAction(()=>apiCall("/api/admin/village","POST",{username:u, troops}), "Troupes mises à jour pour "+u+".");
  };
}

function renderHelp(){
  return `<h2>Aide &amp; règles du jeu</h2>
  <div class="flex-between" style="margin-bottom:10px;">
    <p style="margin:0;">Conquête Tribale est un jeu de gestion de village médiéval type <i>Tribal Wars</i>, qui tourne désormais dans un <b>monde partagé en temps réel</b> : les autres joueurs sont de vraies personnes, connectées avec leur propre compte, et vous pouvez les attaquer comme ils peuvent vous attaquer. Les « villages barbares » de la carte restent contrôlés par le jeu et servent de cibles faciles pour démarrer.</p>
    <button id="btnReplayTutorial">🔰 Revoir le tutoriel</button>
  </div>
  <h3>Principes</h3>
  <p>Améliorez vos bâtiments dans l'onglet <b>Bâtiments</b> pour augmenter la production de ressources, la capacité de stockage et la population disponible. Construisez une <b>Caserne</b> pour entraîner des troupes dans l'onglet du même nom. Utilisez la <b>Carte</b> pour envoyer vos troupes reconnaître ou attaquer des villages — qu'ils soient barbares ou détenus par un autre joueur — afin de piller leurs ressources ; les rapports de bataille apparaissent dans l'onglet <b>Rapports</b>.</p>
  <h3>Reconnaissance et renseignement</h3>
  <p>Contrairement à un jeu solo, le serveur ne révèle jamais les troupes ni les ressources d'un village qui n'est pas le vôtre : vous devez d'abord y envoyer une <b>reconnaissance</b> (au moins un Éclaireur) pour en apprendre le contenu. Ce renseignement reste affiché tant que vous n'avez pas refait de reconnaissance plus récente — il peut donc devenir obsolète si le village a changé entre-temps. Le niveau de muraille, lui, est toujours visible.</p>
  <h3>Sièges et conquête</h3>
  <p>Le <b>Bélier</b> et la <b>Catapulte</b> sont des unités de siège : envoyées dans une attaque victorieuse contre un village barbare, elles endommagent respectivement sa muraille et sa capacité de stockage (l'entrepôt d'un vrai joueur ne peut pas être endommagé ainsi). Construisez une <b>Académie</b> (dès Hôtel de ville niveau 20 — coûteuse et longue, elle ne peut être bâtie qu'une seule fois) pour former des <b>Nobles</b> : chaque noble survivant à une attaque victorieuse contre un village barbare réduit sa loyauté d'environ 20 à 35% et est alors consommé ; à 0% le village est conquis et devient vôtre. La conquête d'un village appartenant à un autre joueur n'est pas possible dans cette version.</p>
  <h3>Un monde vivant, avec de vrais joueurs</h3>
  <p>Les villages barbares se développent tout seuls avec le temps (nouvelles troupes, muraille renforcée, réserves agrandies), surtout les plus éloignés du centre, et peuvent riposter par un raid si vous les attaquez trop souvent. Les autres joueurs, eux, agissent quand ils le souhaitent : soyez prêt à défendre votre village (troupes en garnison, muraille) à tout moment, même hors ligne — l'économie et les combats continuent en votre absence, le monde tourne en temps réel 24h/24.</p>
  <h3>Objectifs et Classement</h3>
  <p>L'onglet <b>Objectifs</b> propose des jalons de progression (améliorer vos bâtiments, entraîner une armée, remporter une bataille, conquérir un village...) qui rapportent chacun une récompense unique en ressources ou en troupes. L'onglet <b>Classement</b> affiche les meilleurs joueurs du monde par nombre de points.</p>
  <h3>Compte et progression</h3>
  <p>Votre village est sauvegardé automatiquement sur le serveur à chaque action : aucune sauvegarde manuelle n'est nécessaire, et vous pouvez vous reconnecter à tout moment avec votre pseudo et votre mot de passe, depuis n'importe quel appareil.</p>
  ${state.isAdmin ? "" : `
  <div class="box" style="margin-top:16px;">
    <h3>🔑 Devenir administrateur</h3>
    <p class="small muted">Si vous disposez du code d'accès administrateur, saisissez-le ici pour débloquer le panneau d'administration sur votre compte.</p>
    <form id="adminClaimForm" style="display:flex; gap:8px; flex-wrap:wrap;">
      <input type="password" id="adminClaimCode" placeholder="Code administrateur" style="flex:1 1 200px;">
      <button type="submit" class="primary">Valider</button>
    </form>
  </div>`}`;
}

function attachTabHandlers(){
  document.querySelectorAll("[data-plot]").forEach(el=>el.onclick=()=>{
    ui.selectedBuilding = el.dataset.plot;
    renderActiveTabContent();
  });
  document.querySelectorAll("[data-build]").forEach(b=>b.onclick=()=>queueBuild(b.dataset.build));
  document.querySelectorAll("[data-train]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.train;
    const inp=document.getElementById("trainCount_"+k);
    queueTrain(k, Number(inp.value));
  });
  document.querySelectorAll("[data-claim-quest]").forEach(b=>b.onclick=()=>claimQuest(b.dataset.claimQuest));
  const replayBtn=document.getElementById("btnReplayTutorial");
  if(replayBtn) replayBtn.onclick=showTutorial;
  const claimForm=document.getElementById("adminClaimForm");
  if(claimForm) claimForm.onsubmit=(e)=>{
    e.preventDefault();
    const code=document.getElementById("adminClaimCode").value;
    if(!code) return;
    doAction(()=>apiCall("/api/admin/claim","POST",{code}), "🛠️ Accès administrateur accordé !", null);
  };
  document.querySelectorAll("[data-village-pin]").forEach(el=>el.onclick=()=>{
    if(mapJustDragged){ mapJustDragged=false; return; }
    const raw=el.dataset.villagePin;
    ui.selectedVillage = raw==="home" ? "home" : raw;
    renderActiveTabContent();
  });
  document.querySelectorAll("[data-max]").forEach(a=>a.onclick=(e)=>{
    e.preventDefault();
    const id="send_"+a.dataset.max;
    const inp=document.getElementById(id);
    inp.value=inp.max;
  });
  document.querySelectorAll("[data-send]").forEach(b=>b.onclick=()=>{
    const idx=b.dataset.send.lastIndexOf("_");
    const id=b.dataset.send.slice(0,idx), kind=b.dataset.send.slice(idx+1);
    sendMission(id, kind);
  });
  document.querySelectorAll("[data-gift]").forEach(b=>b.onclick=()=>{ sendGift(b.dataset.gift); });
  document.querySelectorAll("[data-manage-village]").forEach(b=>b.onclick=()=>{ switchVillage(b.dataset.manageVillage, true); });
  document.querySelectorAll("[data-open-profile]").forEach(el=>el.onclick=(e)=>{
    e.stopPropagation();
    openPlayerProfile(el.dataset.openProfile);
  });
  document.querySelectorAll("[data-toggle]").forEach(el=>el.onclick=()=>{
    const i=el.dataset.toggle;
    if(ui.openReport.has(i)) ui.openReport.delete(i); else ui.openReport.add(i);
    renderActiveTabContent();
  });
  document.querySelectorAll("[data-delete-report]").forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const id=b.dataset.deleteReport;
    doAction(()=>apiCall("/api/reports/delete","POST",{ids:[id]}), "🗑️ Rapport supprimé", null);
  });
  const clearBtn=document.getElementById("btnClearReports");
  if(clearBtn) clearBtn.onclick=()=>{
    const kind=clearBtn.dataset.clearKind||undefined;
    const label=kind?"les rapports affichés":"tous les rapports";
    if(!confirm("Supprimer "+label+" ? Cette action est irréversible.")) return;
    doAction(()=>apiCall("/api/reports/clear","POST",{kind}), "🗑️ Rapports supprimés", null);
  };
  document.querySelectorAll("[data-report-filter]").forEach(b=>b.onclick=()=>{
    reportFilter = b.dataset.reportFilter;
    renderActiveTabContent();
  });
  document.querySelectorAll("[data-guild-invite-accept]").forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    doAction(()=>apiCall("/api/guild/accept","POST",{guildId:b.dataset.guildInviteAccept}), "👥 Vous avez rejoint la guilde !", null);
  });
  document.querySelectorAll("[data-guild-invite-decline]").forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    doAction(()=>apiCall("/api/guild/decline","POST",{guildId:b.dataset.guildInviteDecline}), "Invitation refusée.", null);
  });
}

  document.getElementById("gameRoot").style.display="none";
  window.addEventListener("resize", ()=>{ if(activeTab==="map") positionMapWorld(); });
  tryResumeSession();
}

start();
