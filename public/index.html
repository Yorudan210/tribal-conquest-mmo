    <div class="desc">${b.desc}</div>
    ${lockedReq?`<div class="req-note">Nécessite : ${Object.entries(b.requires).map(([rk,rv])=>BUILDINGS[rk].name+" niv. "+rv).join(", ")}</div>`
      : maxed ? `<p class="muted small">Niveau maximum atteint.</p>` : `
      <div class="cost" style="margin:8px 0;">
        <span class="${v.resources.wood<cost.wood?'short':''}">🪵 ${fmt(cost.wood)}</span>
        <span class="${v.resources.clay<cost.clay?'short':''}">🧱 ${fmt(cost.clay)}</span>
        <span class="${v.resources.iron<cost.iron?'short':''}">⛏️ ${fmt(cost.iron)}</span>
        <span>⏱ ${fmtTime(time)}</span>
      </div>
      ${pendingHall?`<div class="unit-note">${pendingHall} déjà en file d'attente</div>`:''}
      <button id="btnBuildGuildHall" class="primary" ${!affordable?'disabled':''}>${hallLvl<=0?'Construire':'Améliorer'} → niveau ${nextLevel}</button>
    `}
  </div>`;

  const donateBox = hallLvl>0 ? `
    <div class="box">
      <h3>🎁 Faire un don à la guilde</h3>
      <p class="small muted">Chaque don augmente définitivement le bonus de production de TOUS les membres (plafonné à ${GUILD_MAX_BONUS_PERCENT_CLIENT}%). Votre Hall de guilde (niveau ${hallLvl}) limite chaque don à ${1000*hallLvl} ressources au total.</p>
      <div class="inputs" style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:8px;">
        ${["wood","clay","iron"].map(r=>`<div class="inp">${RES_ICON[r]}<input type="number" min="0" value="0" id="guildDonate_${r}"></div>`).join("")}
      </div>
      <button id="btnGuildDonate" class="primary">Donner</button>
    </div>` : `<p class="muted small">Construisez le Hall de guilde ci-dessus pour pouvoir faire des dons.</p>`;

  const membersRows = g.members.map(m=>`<tr>
    <td class="player-link" data-open-profile="${escapeHtml(m)}">${escapeHtml(m)}${m===g.leader?' <span class="tag strong">CHEF</span>':''}${m===username?' (vous)':''}</td>
    <td>${g.isLeader && m!==username ? `<button data-guild-kick="${escapeHtml(m)}">Exclure</button>` : ''}</td>
  </tr>`).join("");

  const donationRows = (g.donations||[]).slice(0,15).map(d=>`
    <div class="donation-row">
      <span>${escapeHtml(d.username)}</span>
      <span class="muted">🪵${fmt(d.wood)} 🧱${fmt(d.clay)} ⛏️${fmt(d.iron)}</span>
      <span class="muted">${fmtTime(Math.max(0,estimateNow()-d.time))}</span>
    </div>`).join("") || `<p class="muted small">Aucun don pour l'instant.</p>`;

  const donorTotalsSorted = Object.entries(g.donorTotals||{}).sort((a,b)=>b[1]-a[1]);
  const donorTotalsRows = donorTotalsSorted.map(([u,total])=>`<tr><td>${escapeHtml(u)}</td><td>${fmt(total)}</td></tr>`).join("")
    || `<tr><td colspan="2" class="muted">Aucun don pour l'instant.</td></tr>`;

  const donationHistoryBox = `
    <div class="box">
      <h3>🎁 Historique des dons</h3>
      <div style="display:flex; gap:16px; flex-wrap:wrap; align-items:flex-start;">
        <div style="flex:1 1 260px; min-width:220px;">
          <div class="small muted" style="margin-bottom:4px;">Dons récents</div>
          ${donationRows}
        </div>
        <div style="flex:1 1 200px; min-width:180px;">
          <div class="small muted" style="margin-bottom:4px;">Total cumulé par membre</div>
          <table style="width:100%;"><thead><tr><th>Membre</th><th>Total</th></tr></thead><tbody>${donorTotalsRows}</tbody></table>
        </div>
      </div>
    </div>`;

  const activeBoosts = g.activeBoosts||[];
  const activeBoostsBox = activeBoosts.length ? `
    <div class="small muted" style="margin:8px 0;">Bonus actifs : ${activeBoosts.map(b=>`${b.icon} ${escapeHtml(b.name)} (encore ${fmtTime(b.secondsLeft)})`).join(" · ")}</div>
  ` : `<div class="small muted" style="margin:8px 0;">Aucun bonus actif pour l'instant.</div>`;

  const shopCards = GUILD_BOOSTS.map(b=>{
    const active = activeBoosts.find(x=>x.key===b.key);
    const affordable = g.bank.wood>=b.cost.wood && g.bank.clay>=b.cost.clay && g.bank.iron>=b.cost.iron;
    return `<div class="shop-card ${active?'active':''}">
      <h4>${b.icon} ${b.name}</h4>
      <div class="small muted" style="margin-bottom:6px;">${b.desc}</div>
      <div class="cost small" style="margin-bottom:8px;">
        <span class="${g.bank.wood<b.cost.wood?'short':''}">🪵 ${fmt(b.cost.wood)}</span>
        <span class="${g.bank.clay<b.cost.clay?'short':''}">🧱 ${fmt(b.cost.clay)}</span>
        <span class="${g.bank.iron<b.cost.iron?'short':''}">⛏️ ${fmt(b.cost.iron)}</span>
      </div>
      ${g.isLeader
        ? `<button data-guild-buy-boost="${b.key}" class="primary" ${affordable?'':'disabled'}>${active?'Racheter (prolonger)':'Acheter'}</button>`
        : `<p class="muted small">Seul le chef de guilde peut acheter dans la boutique.</p>`}
    </div>`;
  }).join("");

  const shopBox = `
    <div class="box">
      <h3>🛒 Boutique de guilde</h3>
      <p class="small muted">Dépensez les ressources de la <b>banque de guilde</b> (alimentée par les dons ci-dessus) pour offrir un bonus temporaire à TOUS les membres. Banque actuelle : 🪵${fmt(g.bank.wood)} 🧱${fmt(g.bank.clay)} ⛏️${fmt(g.bank.iron)}.</p>
      ${activeBoostsBox}
      <div class="shop-grid">${shopCards}</div>
    </div>`;

  const inviteBox = g.isLeader ? `
    <div class="box">
      <h3>✉️ Inviter un joueur</h3>
      <form id="guildInviteForm" style="display:flex; gap:8px;">
        <input type="text" id="guildInviteUsername" placeholder="Pseudo du joueur">
        <button type="submit" class="primary">Inviter</button>
      </form>
      ${g.invites.length?`<p class="small muted" style="margin-top:8px;">Invitations en attente : ${g.invites.map(escapeHtml).join(", ")}</p>`:''}
    </div>` : '';

  const relTypeCls = r => r.type==="war" ? "war" : (r.type==="alliance" ? "ally" : "pact");
  const diplomacy = g.diplomacy||[];
  const activeRelations = diplomacy.filter(r=>r.status==="active");
  const incomingPending = diplomacy.filter(r=>r.status==="pending" && r.direction==="incoming");
  const outgoingPending = diplomacy.filter(r=>r.status==="pending" && r.direction==="outgoing");

  const activeRelationsRows = activeRelations.map(r=>`
    <div class="donation-row">
      <span class="tag ${relTypeCls(r)}">${DIPLOMACY_LABEL[r.type]}</span>
      <span>[${escapeHtml(r.otherGuild.tag)}] ${escapeHtml(r.otherGuild.name)}</span>
      ${g.isLeader?`<button data-diplomacy-cancel="${r.id}">${r.type==="war"?"🕊️ Faire la paix":"💔 Rompre"}</button>`:''}
    </div>`).join("") || `<p class="muted small">Aucune relation active pour l'instant.</p>`;

  const incomingRows = incomingPending.map(r=>`
    <div class="donation-row">
      <span class="tag pact">Reçue</span>
      <span>[${escapeHtml(r.otherGuild.tag)}] ${escapeHtml(r.otherGuild.name)} propose ${DIPLOMACY_LABEL_LOWER[r.type]}</span>
      ${g.isLeader?`<span><button data-diplomacy-respond-accept="${r.id}" class="primary">Accepter</button> <button data-diplomacy-respond-decline="${r.id}">Refuser</button></span>`:''}
    </div>`).join("");

  const outgoingRows = outgoingPending.map(r=>`
    <div class="donation-row">
      <span class="tag pact">Envoyée</span>
      <span>Proposition de ${DIPLOMACY_LABEL_LOWER[r.type]} envoyée à [${escapeHtml(r.otherGuild.tag)}] ${escapeHtml(r.otherGuild.name)}</span>
      ${g.isLeader?`<button data-diplomacy-cancel="${r.id}">Annuler</button>`:''}
    </div>`).join("");

  const directoryOptions = (guildDirectory||[]).map(og=>`<option value="${og.id}">[${escapeHtml(og.tag)}] ${escapeHtml(og.name)} (${og.memberCount} membre${og.memberCount>1?'s':''})</option>`).join("");
  const proposeBox = g.isLeader ? `
    <div class="box">
      <div class="flex-between" style="align-items:flex-start;">
        <h3 style="margin:0;">🕊️ Proposer une relation</h3>
        <button type="button" id="btnRefreshGuildDirectory" title="Actualiser la liste des guildes" style="padding:4px 8px;">🔄</button>
      </div>
      <p class="small muted">Un pacte ou une alliance doit être accepté par l'autre chef de guilde. Une déclaration de guerre est immédiate et unilatérale. Ces relations sont purement informatives : elles s'affichent sur la carte et avertissent avant une attaque, mais n'empêchent aucun combat.</p>
      ${guildDirectory===null ? `<p class="muted small">Chargement de l'annuaire des guildes…</p>` :
        (guildDirectory.length===0 ? `<p class="muted small">Aucune autre guilde dans le monde pour l'instant.</p>` : `
        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end;">
          <label class="small">Guilde<br><select id="diplomacyTargetGuild">${directoryOptions}</select></label>
          <button type="button" data-diplomacy-propose="pact">🕊️ Proposer un pacte</button>
          <button type="button" data-diplomacy-propose="alliance" class="primary">🤝 Proposer une alliance</button>
          <button type="button" data-diplomacy-declare-war>⚔️ Déclarer la guerre</button>
        </div>`)}
    </div>` : '';

  const diplomacyBox = `
    <div class="box">
      <h3>🕊️ Diplomatie</h3>
      ${incomingRows ? `<div style="margin-bottom:10px;"><div class="small muted" style="margin-bottom:4px;">Propositions reçues</div>${incomingRows}</div>` : ''}
      ${outgoingRows ? `<div style="margin-bottom:10px;"><div class="small muted" style="margin-bottom:4px;">Propositions envoyées</div>${outgoingRows}</div>` : ''}
      <div class="small muted" style="margin-bottom:4px;">Relations actives</div>
      ${activeRelationsRows}
    </div>
    ${proposeBox}`;

  // Boutique et Diplomatie séparées de l'Aperçu par des sous-onglets (même mécanisme que
  // infoSubTab pour l'onglet Informations) : chacune a son propre contenu (souvent long, formulaires
  // compris), les regrouper toutes sur une seule page rendait l'onglet Guilde difficile à parcourir.
  const guildSubTabs = [["overview","🏰 Aperçu"], ["shop","🛒 Boutique"], ["diplomacy","🕊️ Diplomatie"]];
  if(!guildSubTabs.some(([k])=>k===guildSubTab)) guildSubTab = "overview";
  const subNav = `<div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;">
    ${guildSubTabs.map(([k,label])=>`<button data-guild-subtab="${k}" class="${guildSubTab===k?'primary':''}">${label}</button>`).join("")}
  </div>`;

  let subContent;
  if(guildSubTab==="shop") subContent = shopBox;
  else if(guildSubTab==="diplomacy") subContent = diplomacyBox;
  else subContent = `
    <div class="box">
      <h3>👥 Membres (${g.members.length})</h3>
      <table><thead><tr><th>Pseudo</th><th></th></tr></thead><tbody>${membersRows}</tbody></table>
    </div>
    ${inviteBox}
    ${hallCard}
    ${donateBox}
    ${donationHistoryBox}
    <div class="box">
      <button id="btnGuildLeave">🚪 Quitter la guilde</button>
      ${g.isLeader?`<button id="btnGuildDisband" style="margin-left:8px;">💥 Dissoudre la guilde</button>`:''}
    </div>`;

  const guildBanner = `<div class="guild-banner">
    <svg class="guild-banner-bg" viewBox="0 0 1200 100" preserveAspectRatio="none"><rect width="1200" height="100" fill="url(#tex-cloth-burgundy)"></rect></svg>
    <div class="guild-banner-content">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="#f6ecd3" stroke="#f6ecd3" stroke-width="0.5"><path d="M4 18H20L18 9L14 13L12 7L10 13L6 9L4 18Z"></path></svg>
      <div>
        <div class="guild-banner-title">[${escapeHtml(g.tag)}] ${escapeHtml(g.name)}</div>
        <div class="guild-banner-sub">+${g.bonusPercent}% de production partagée · ${fmt(g.totalDonated)} ressources données au total</div>
      </div>
    </div>
  </div>`;

  return `<h2>👥 [${escapeHtml(g.tag)}] ${escapeHtml(g.name)}</h2>
    <p class="muted small">Bonus de production actuel : <b>+${g.bonusPercent}%</b> pour tous les membres (basé sur ${fmt(g.totalDonated)} ressources données au total).</p>
    ${guildBanner}
    ${subNav}
    ${subContent}`;
}

const GUILD_MAX_BONUS_PERCENT_CLIENT = 25;

function attachGuildHandlers(){
  document.querySelectorAll("[data-guild-subtab]").forEach(b=>b.onclick=()=>{
    guildSubTab = b.dataset.guildSubtab;
    renderActiveTabContent();
  });
  const createForm=document.getElementById("guildCreateForm");
  if(createForm) createForm.onsubmit=(e)=>{
    e.preventDefault();
    const name=document.getElementById("guildCreateName").value.trim();
    const tag=document.getElementById("guildCreateTag").value.trim();
    if(!name || !tag){ toast("⚠️ Indiquez un nom et un tag."); return; }
    doAction(()=>apiCall("/api/guild/create","POST",{name, tag}), "👥 Guilde fondée !", null);
  };
  const buildHallBtn=document.getElementById("btnBuildGuildHall");
  if(buildHallBtn) buildHallBtn.onclick=()=>queueBuild("guildHall");
  const donateBtn=document.getElementById("btnGuildDonate");
  if(donateBtn) donateBtn.onclick=()=>{
    const wood=Number(document.getElementById("guildDonate_wood").value)||0;
    const clay=Number(document.getElementById("guildDonate_clay").value)||0;
    const iron=Number(document.getElementById("guildDonate_iron").value)||0;
    if(!wood && !clay && !iron){ toast("⚠️ Indiquez au moins une ressource à donner."); return; }
    doAction(()=>apiCall("/api/guild/donate","POST",{wood, clay, iron}), "🎁 Don envoyé à la guilde !", null);
  };
  const inviteForm=document.getElementById("guildInviteForm");
  if(inviteForm) inviteForm.onsubmit=(e)=>{
    e.preventDefault();
    const inp=document.getElementById("guildInviteUsername");
    const u=inp.value.trim();
    if(!u){ toast("⚠️ Indiquez un pseudo."); return; }
    doAction(()=>apiCall("/api/guild/invite","POST",{username:u}), "✉️ Invitation envoyée à "+u+".", null);
    inp.value="";
  };
  document.querySelectorAll("[data-guild-kick]").forEach(b=>b.onclick=()=>{
    doAction(()=>apiCall("/api/guild/kick","POST",{username:b.dataset.guildKick}), b.dataset.guildKick+" exclu de la guilde.", null);
  });
  document.querySelectorAll("[data-guild-buy-boost]").forEach(b=>b.onclick=()=>{
    const key=b.dataset.guildBuyBoost;
    const boost=GUILD_BOOSTS.find(x=>x.key===key);
    doAction(()=>apiCall("/api/guild/buy-boost","POST",{key}), boost?("🛒 "+boost.icon+" "+boost.name+" activé pour toute la guilde !"):"🛒 Bonus activé.", null);
  });
  const leaveBtn=document.getElementById("btnGuildLeave");
  if(leaveBtn) leaveBtn.onclick=()=>{
    if(!confirm("Quitter la guilde ?")) return;
    doAction(()=>apiCall("/api/guild/leave","POST"), "Vous avez quitté la guilde.", null);
  };
  const disbandBtn=document.getElementById("btnGuildDisband");
  if(disbandBtn) disbandBtn.onclick=()=>{
    if(!confirm("Dissoudre définitivement la guilde pour tous les membres ?")) return;
    doAction(()=>apiCall("/api/guild/disband","POST"), "Guilde dissoute.", null);
  };
  const refreshDirBtn=document.getElementById("btnRefreshGuildDirectory");
  if(refreshDirBtn) refreshDirBtn.onclick=()=>refreshGuildDirectory();
  document.querySelectorAll("[data-diplomacy-cancel]").forEach(b=>b.onclick=()=>{
    if(!confirm("Confirmer ?")) return;
    doAction(()=>apiCall("/api/guild/diplomacy/cancel","POST",{relationId:b.dataset.diplomacyCancel}), "Relation mise à jour.", null);
  });
  document.querySelectorAll("[data-diplomacy-respond-accept]").forEach(b=>b.onclick=()=>{
    doAction(()=>apiCall("/api/guild/diplomacy/respond","POST",{relationId:b.dataset.diplomacyRespondAccept, accept:true}), "🕊️ Proposition acceptée.", null);
  });
  document.querySelectorAll("[data-diplomacy-respond-decline]").forEach(b=>b.onclick=()=>{
    doAction(()=>apiCall("/api/guild/diplomacy/respond","POST",{relationId:b.dataset.diplomacyRespondDecline, accept:false}), "Proposition refusée.", null);
  });
  document.querySelectorAll("[data-diplomacy-propose]").forEach(b=>b.onclick=()=>{
    const sel=document.getElementById("diplomacyTargetGuild");
    if(!sel || !sel.value){ toast("⚠️ Choisissez une guilde."); return; }
    const type=b.dataset.diplomacyPropose;
    doAction(()=>apiCall("/api/guild/diplomacy/propose","POST",{targetGuildId:sel.value, type}), "🕊️ Proposition envoyée.", null);
  });
  const warBtn=document.querySelector("[data-diplomacy-declare-war]");
  if(warBtn) warBtn.onclick=()=>{
    const sel=document.getElementById("diplomacyTargetGuild");
    if(!sel || !sel.value){ toast("⚠️ Choisissez une guilde."); return; }
    if(!confirm("Déclarer la guerre à cette guilde ?")) return;
    doAction(()=>apiCall("/api/guild/diplomacy/declare-war","POST",{targetGuildId:sel.value}), "⚔️ Guerre déclarée.", null);
  };
}

function renderAdmin(){
  const filter = adminPlayerFilter.trim().toLowerCase();
  const filteredPlayers = (adminPlayers||[]).filter(p=>!filter || p.username.toLowerCase().includes(filter) || (p.villageName||"").toLowerCase().includes(filter));
  const rows = filteredPlayers.map(p=>{
    const sel = adminSelected===p.username;
    return `<tr class="${sel?'admin-selected':''}" data-admin-select="${p.username}">
      <td>${escapeHtml(p.username)}${p.isAdmin?' <span class="tag strong">ADMIN</span>':''}</td>
      <td>${p.villageName?escapeHtml(p.villageName):'-'}</td>
      <td>${p.coord||'-'}</td>
      <td>🪵${fmt(p.resources?p.resources.wood:0)} 🧱${fmt(p.resources?p.resources.clay:0)} ⛏️${fmt(p.resources?p.resources.iron:0)}</td>
      <td>🏛️ ${p.buildings?p.buildings.hq||0:0}</td>
      <td>${p.buildQueueLen||0} / ${p.trainQueueLen||0}</td>

    <div class="event-badges" style="margin-bottom:12px;">

    <h3>⚡ Vitesse du monde</h3>
    <div class="flex-between">
      <span class="small">Multiplicateur actuel : <b>${adminSpeed}×</b> — s'applique immédiatement à tout : ressources, files de construction et d'entraînement déjà en cours <i>et</i> nouvelles (temps divisé par ce facteur).</span>
      <div style="display:flex; gap:6px;">
        <input type="number" id="adminSpeedInput" min="0.01" max="1000" step="0.1" value="${adminSpeed}">
        <button id="btnSetSpeed" class="primary">Appliquer</button>
      </div>
    </div>
  </div>

  <div class="box" style="margin-bottom:14px;">
    <h3>📢 Annonce à tous les joueurs</h3>
    <p class="small muted">Envoie un message qui apparaît immédiatement dans la boîte de rapports de tous les joueurs actuels.</p>
    <form id="adminAnnounceForm" style="display:flex; gap:8px; flex-wrap:wrap; align-items:flex-start;">
      <textarea id="adminAnnounceText" rows="2" maxlength="500" placeholder="Message de l'administration…" style="flex:1 1 260px;"></textarea>
      <button type="submit" class="primary">Publier</button>
    </form>
  </div>

  <div class="box" style="margin-bottom:14px;">

    <p class="small muted">Ajoute ces montants au stock actuel de chaque joueur, en une seule fois.</p>
    <div class="inputs" style="display:flex; gap:14px; margin-bottom:8px; flex-wrap:wrap;">
      ${["wood","clay","iron"].map(r=>`<div class="inp">${RES_ICON[r]}<input type="number" id="adminGiveAll_${r}" min="0" value="0"></div>`).join("")}
      <button id="btnGiveAll" class="primary">➕ Donner à tous</button>
    </div>
  </div>

  ${renderAdminBulkVillagesBox()}

  <div class="box" style="margin-bottom:14px;">
    <h3>🎉 Évènements du serveur</h3>
    <p class="small muted">Lance un évènement temporaire visible par tous les joueurs (bannière + annonce automatique dans leurs rapports). Un seul évènement actif à la fois par type d'effet : en relancer un remplace celui en cours.</p>
    ${activeEventsBox}
    <form id="adminEventForm" style="display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end;">
      <div>
        <label class="small muted" for="adminEventKey">Type d'évènement</label><br>
        <select id="adminEventKey">${SERVER_EVENTS.map(e=>`<option value="${e.key}" data-kind="${e.kind}">${e.icon} ${e.name}</option>`).join("")}</select>
      </div>
      <div id="adminEventAmountWrap">

        <input type="number" id="adminEventMultiplier" min="1.1" max="20" step="0.1" value="2">
      </div>
      <div id="adminEventMinutesWrap">
        <label class="small muted">Durée (minutes)</label><br>
        <input type="number" id="adminEventMinutes" min="1" max="10080" value="60">
      </div>
      <button type="submit" class="primary">🚀 Lancer</button>
    </form>
    <p class="small muted" id="adminEventDesc" style="margin-top:8px;"></p>
  </div>

  ${renderAdminBlackArmyBox()}

  <div class="box" style="margin-bottom:14px;">

/* Section "Armée Noire" du panneau Admin : lance/arrête l'évènement de lancement officiel (voir

    </div>
    <p class="small muted">Encore <b>${fmtTime(ba.remainingSec)}</b> avant le retrait automatique des campements non conquis — ${fmt(ba.defeatedCount)} victoire${ba.defeatedCount>1?'s':''} enregistrée${ba.defeatedCount>1?'s':''} jusqu'ici.</p>

        <input type="number" id="adminBlackArmyMinutes" min="60" max="10080" value="4320">
      </div>
      <button type="submit" class="primary" ${(ba && ba.active)?'disabled':''}>🏴 Lancer l'Armée Noire</button>
    </form>
  </div>`;
}

/* Section "gestion groupée" du panneau Admin : applique une action à TOUS les villages d'une
   portée choisie (tous / joueurs seulement / barbares seulement) en un seul clic — contrairement
   au reste du panneau qui n'agit que sur le village d'origine d'UN seul joueur à la fois. Les
   champs de bâtiments/troupes sont volontairement laissés VIDES par défaut (pas de valeur "0"
   pré-remplie comme dans l'éditeur d'un village précis) : un champ vide = "ne pas toucher à ce
   bâtiment/cette troupe précis", ce qui permet de ne changer qu'un seul champ sur des centaines de
   villages sans écraser le reste à zéro. */
function renderAdminBulkVillagesBox(){
  const buildingInputs = BUILD_ORDER.map(k=>`<div class="troop-row"><span class="tname">${BUILDINGS[k].name}</span><input type="number" id="adminBulkBuild_${k}" min="0" max="${BUILDINGS[k].max}" placeholder="—"></div>`).join("");
  const troopInputs = TROOP_ORDER.map(k=>`<div class="troop-row"><span class="tname">${TROOPS[k].name}</span><input type="number" id="adminBulkTroop_${k}" min="0" placeholder="—"></div>`).join("");
  return `<div class="box" style="margin-bottom:14px;">
    <h3>🌍 Gestion groupée de tous les villages</h3>
    <p class="small muted">Applique une action à plusieurs villages à la fois. Choisissez d'abord la portée ci-dessous ; pour les bâtiments et les troupes, ne remplissez que les champs que vous voulez réellement changer — un champ laissé vide n'est pas touché.</p>
    <div style="margin-bottom:12px;">
      <label class="small muted" for="adminBulkScope">Portée de l'action</label><br>
      <select id="adminBulkScope">
        <option value="all" ${adminBulkScope==="all"?"selected":""}>🌐 Tous les villages (joueurs + barbares)</option>
        <option value="players" ${adminBulkScope==="players"?"selected":""}>👥 Villages de joueurs uniquement (origine + conquêtes)</option>
        <option value="barbarians" ${adminBulkScope==="barbarians"?"selected":""}>🏚️ Villages barbares uniquement</option>
      </select>
    </div>

    <h4>Ressources</h4>
    <p class="small muted" style="margin-top:0;">Ajoute ces montants au stock actuel de chaque village de la portée (pas de plafond d'entrepôt).</p>
    <div class="inputs" style="display:flex; gap:14px; margin-bottom:8px; flex-wrap:wrap; align-items:center;">
      ${["wood","clay","iron"].map(r=>`<div class="inp">${RES_ICON[r]}<input type="number" id="adminBulkGive_${r}" min="0" placeholder="0"></div>`).join("")}
      <button id="btnBulkGive" class="primary">➕ Donner à la portée sélectionnée</button>
    </div>

    <h4>Bâtiments <span class="small muted" style="font-weight:normal;">(niveau exact — ignoré pour les villages barbares, qui n'en ont pas)</span></h4>
    <div class="grid-buildings" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); margin-bottom:8px;">${buildingInputs}</div>
    <button id="btnBulkSetBuildings" class="primary" style="margin-bottom:14px;">Appliquer les bâtiments remplis à la portée</button>

    <h4>Troupes <span class="small muted" style="font-weight:normal;">(nombre exact)</span></h4>
    <div class="grid-buildings" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); margin-bottom:8px;">${troopInputs}</div>
    <button id="btnBulkSetTroops" class="primary" style="margin-bottom:14px;">Appliquer les troupes remplies à la portée</button>

    <h4>Files d'attente</h4>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button id="btnBulkFinishBuild">✅ Terminer toutes les constructions en cours (portée)</button>
      <button id="btnBulkFinishTrain">✅ Terminer tous les entraînements en cours (portée)</button>
    </div>
  </div>`;
}

/* Section "sélection individuelle" : liste CHAQUE village du monde (contrairement au tableau des
   joueurs ci-dessus, qui n'affiche que le village d'ORIGINE de chacun) — permet de retrouver et
   éditer directement une conquête précise d'un joueur, ou même un village barbare. */
function renderAdminVillagesTable(){
  const vfilter = adminVillageFilter.trim().toLowerCase();
  const filteredVillages = (adminVillages||[]).filter(v=>!vfilter
    || v.name.toLowerCase().includes(vfilter)
    || (v.x+"|"+v.y).includes(vfilter)
    || (v.owner||"").toLowerCase().includes(vfilter));
  const rows = filteredVillages.map(v=>{
    const sel = adminSelectedVillageId===v.id;
    return `<tr class="${sel?'admin-selected':''}" data-admin-select-village="${v.id}">
      <td>${escapeHtml(v.name)}</td>
      <td>${v.x}|${v.y}</td>
      <td>${v.isPlayer?escapeHtml(v.owner):'🏚️ barbare'}</td>
      <td>${v.hq!=null?v.hq:'—'}</td>
      <td>🪵${fmt(v.resources.wood)} 🧱${fmt(v.resources.clay)} ⛏️${fmt(v.resources.iron)}</td>
      <td>${v.buildQueueLen}/${v.trainQueueLen}</td>
    </tr>`;
  }).join("") || `<tr><td colspan="6" class="muted">${(adminVillages||[]).length?'Aucun village ne correspond à la recherche.':'Chargement…'}</td></tr>`;
  const selV = (adminVillages||[]).find(v=>v.id===adminSelectedVillageId);
  return `<div class="box" style="margin-bottom:14px;">
    <div class="flex-between">
      <h3 style="margin:0;">🏘️ Tous les villages (${filteredVillages.length}${filteredVillages.length!==(adminVillages||[]).length?(' / '+(adminVillages||[]).length):''})</h3>
      <input type="text" id="adminVillageFilter" placeholder="🔎 Filtrer par nom, coord. ou propriétaire…" value="${escapeHtml(adminVillageFilter)}" style="max-width:260px;">
    </div>
    <p class="small muted">Cliquez sur un village pour l'éditer individuellement, y compris une conquête d'un joueur qui n'est pas son village d'origine.</p>
    <div style="max-height:280px; overflow:auto;">
      <table><thead><tr><th>Village</th><th>Coord.</th><th>Propriétaire</th><th>HdV</th><th>Ressources</th><th>Files (constr./entr.)</th></tr></thead>
      <tbody>${rows}</tbody></table>
    </div>
  </div>
  ${selV ? `<div class="box">${renderAdminVillageEditor(selV)}</div>` : `<p class="muted small">Sélectionnez un village ci-dessus pour l'éditer.</p>`}`;
}

function attachAdminHandlers(){
  document.querySelectorAll("[data-admin-select]").forEach(tr=>tr.onclick=()=>{
    adminSelected = tr.dataset.adminSelect;
    renderActiveTabContent();
  });
  const speedBtn=document.getElementById("btnSetSpeed");
  if(speedBtn) speedBtn.onclick=()=>{
    const v=Number(document.getElementById("adminSpeedInput").value);
    if(!v || v<=0){ toast("⚠️ Valeur invalide."); return; }
    adminAction(()=>apiCall("/api/admin/speed","POST",{multiplier:v}), "Vitesse du monde réglée sur "+v+"×.");
  };
  const announceForm=document.getElementById("adminAnnounceForm");
  if(announceForm) announceForm.onsubmit=(e)=>{
    e.preventDefault();
    const inp=document.getElementById("adminAnnounceText");
    const text=(inp.value||"").trim();
    if(!text){ toast("⚠️ Message vide."); return; }
    doAction(()=>apiCall("/api/admin/announce","POST",{text}), "📢 Annonce publiée à tous les joueurs.", null);
    inp.value="";
  };
  const eventForm=document.getElementById("adminEventForm");
  if(eventForm){
    const keySel=document.getElementById("adminEventKey");
    const amountWrap=document.getElementById("adminEventAmountWrap");
    const multWrap=document.getElementById("adminEventMultWrap");
    const minutesWrap=document.getElementById("adminEventMinutesWrap");
    const descEl=document.getElementById("adminEventDesc");
    const syncEventFormVisibility=()=>{
      const def = SERVER_EVENTS.find(x=>x.key===keySel.value) || SERVER_EVENTS[0];
      const isInstant = def.kind==="instant";
      amountWrap.style.display = isInstant?"":"none";
      multWrap.style.display = isInstant?"none":"";
      minutesWrap.style.display = isInstant?"none":"";
      if(descEl) descEl.textContent = def.desc;
    };
    keySel.onchange = syncEventFormVisibility;
    syncEventFormVisibility();
    eventForm.onsubmit=(e)=>{
      e.preventDefault();
      const key=keySel.value;
      const def=SERVER_EVENTS.find(x=>x.key===key);
      if(!def) return;
      if(def.kind==="instant"){
        const amount=Number(document.getElementById("adminEventAmount").value);
        if(!amount || amount<=0){ toast("⚠️ Montant invalide."); return; }
        adminAction(()=>apiCall("/api/admin/event/start","POST",{key, amount}), def.icon+" "+def.name+" envoyé à tous les joueurs.");
      } else {
        const multiplier=Number(document.getElementById("adminEventMultiplier").value);
        const minutes=Number(document.getElementById("adminEventMinutes").value);
        if(!multiplier || multiplier<=1){ toast("⚠️ Le multiplicateur doit être supérieur à 1."); return; }
        if(!minutes || minutes<=0){ toast("⚠️ Durée invalide."); return; }
        adminAction(()=>apiCall("/api/admin/event/start","POST",{key, multiplier, minutes}), def.icon+" "+def.name+" lancé pour "+minutes+" min.");
      }
    };
  }
  document.querySelectorAll("[data-stop-event]").forEach(b=>b.onclick=()=>{
    adminAction(()=>apiCall("/api/admin/event/stop","POST",{id:b.dataset.stopEvent}), "Évènement arrêté.");
  });
  const blackArmyForm=document.getElementById("adminBlackArmyForm");
  if(blackArmyForm) blackArmyForm.onsubmit=(e)=>{
    e.preventDefault();
    const count=Number(document.getElementById("adminBlackArmyCount").value);
    const minutes=Number(document.getElementById("adminBlackArmyMinutes").value);
    if(!count || count<=0){ toast("⚠️ Nombre de campements invalide."); return; }
    if(!minutes || minutes<=0){ toast("⚠️ Durée invalide."); return; }
    adminAction(()=>apiCall("/api/admin/blackarmy/start","POST",{count, minutes}), "🏴 L'Armée Noire envahit le monde !");
  };
  document.querySelectorAll("[data-stop-blackarmy]").forEach(b=>b.onclick=()=>{
    adminAction(()=>apiCall("/api/admin/blackarmy/stop","POST",{}), "Évènement Armée Noire arrêté.");
  });
  const giveAllBtn=document.getElementById("btnGiveAll");
  if(giveAllBtn) giveAllBtn.onclick=()=>{
    const wood=Number(document.getElementById("adminGiveAll_wood").value)||0;
    const clay=Number(document.getElementById("adminGiveAll_clay").value)||0;
    const iron=Number(document.getElementById("adminGiveAll_iron").value)||0;
    if(!wood && !clay && !iron){ toast("⚠️ Indiquez au moins une ressource à donner."); return; }
    adminAction(()=>apiCall("/api/admin/give-all","POST",{wood, clay, iron}), "Ressources données à tous les joueurs.");
  };
  const filterInput=document.getElementById("adminPlayerFilter");
  if(filterInput) filterInput.oninput=()=>{
    adminPlayerFilter = filterInput.value;
    rerenderPreservingInputs(document.getElementById("tabContent"), renderActiveTabContent);
  };
  const toggleBtn=document.getElementById("btnToggleAdmin");
  if(toggleBtn) toggleBtn.onclick=()=>{
    const u=toggleBtn.dataset.user, flag=toggleBtn.dataset.flag==="1";
    adminAction(()=>apiCall("/api/admin/setadmin","POST",{username:u, isAdmin:flag}), flag?("Droits admin accordés à "+u+"."):("Droits admin retirés à "+u+"."));
  };
  document.querySelectorAll("[data-finish-mission]").forEach(b=>b.onclick=()=>{
    adminAction(()=>apiCall("/api/admin/finish-mission","POST",{missionId:b.dataset.finishMission}), "Mission résolue instantanément.");
  });
  const deletePlayerBtn=document.getElementById("btnDeletePlayer");
  if(deletePlayerBtn) deletePlayerBtn.onclick=()=>{
    const u=deletePlayerBtn.dataset.user;
    if(u===username){ toast("⚠️ Vous ne pouvez pas supprimer votre propre compte."); return; }
    if(!confirm("Supprimer définitivement le compte « "+u+" » ? Cette action est irréversible : son compte, ses rapports, son adhésion à sa guilde et ses offres au marché seront supprimés, et son ou ses village(s) redeviendront des villages barbares.")) return;
    adminSelected=null;
    adminAction(()=>apiCall("/api/admin/delete-player","POST",{username:u}), "🗑️ Compte « "+u+" » supprimé.");
  };
  const finishBuildBtn=document.getElementById("btnFinishBuild");
  if(finishBuildBtn) finishBuildBtn.onclick=()=>{
    adminAction(()=>apiCall("/api/admin/finish-build","POST",{username:finishBuildBtn.dataset.user}), "Construction(s) terminée(s) instantanément.");
  };
  const finishTrainBtn=document.getElementById("btnFinishTrain");
  if(finishTrainBtn) finishTrainBtn.onclick=()=>{
    adminAction(()=>apiCall("/api/admin/finish-train","POST",{username:finishTrainBtn.dataset.user}), "Entraînement(s) terminé(s) instantanément.");
  };
  const setResBtn=document.getElementById("btnSetResources");
  if(setResBtn) setResBtn.onclick=()=>{
    const u=setResBtn.dataset.user;
    const resources={
      wood:Number(document.getElementById("adminRes_wood").value)||0,
      clay:Number(document.getElementById("adminRes_clay").value)||0,
      iron:Number(document.getElementById("adminRes_iron").value)||0
    };
    adminAction(()=>apiCall("/api/admin/village","POST",{username:u, resources}), "Ressources mises à jour pour "+u+".");
  };
  const giveResBtn=document.getElementById("btnGiveResources");
  if(giveResBtn) giveResBtn.onclick=()=>{
    const u=giveResBtn.dataset.user;
    const wood=Number(document.getElementById("adminRes_wood").value)||0;
    const clay=Number(document.getElementById("adminRes_clay").value)||0;
    const iron=Number(document.getElementById("adminRes_iron").value)||0;
    adminAction(()=>apiCall("/api/admin/give","POST",{username:u, wood, clay, iron}), "Ressources données à "+u+".");
  };
  const setBuildBtn=document.getElementById("btnSetBuildings");

/* Onglet "Informations" : regroupe Aide, Succès, Admin (si administrateur) et Mises à jour derrière
   une petite navigation secondaire (infoSubTab), plutôt que de leur laisser chacun une place dans la
   navigation principale de gauche — ce sont des pages consultées ponctuellement, pas des outils de
   jeu courants comme Bâtiments/Caserne/Carte. */
function renderInformation(){
  const achievementPoints=(state.achievements||[]).reduce((s,a)=>s+a.points,0);
  const subTabs=[["help","❓ Aide"],["achievements","🎖️ Succès ("+achievementPoints+" pts)"]];
  if(state.isAdmin) subTabs.push(["admin","🛠️ Admin"]);
  subTabs.push(["changelog","🗞️ Mises à jour"]);
  if(!subTabs.some(([k])=>k===infoSubTab)) infoSubTab="help"; // ex. droits admin perdus entre-temps
  const nav = `<div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;">
    ${subTabs.map(([k,label])=>`<button data-info-subtab="${k}" class="${infoSubTab===k?'primary':''}">${label}</button>`).join("")}
  </div>`;
  let content;
  if(infoSubTab==="achievements") content=renderAchievements();
  else if(infoSubTab==="admin" && state.isAdmin) content=renderAdmin();
  else if(infoSubTab==="changelog") content=renderChangelogIngame();
  else content=renderHelp();
  return `${nav}${content}`;
}

function renderHelp(){
  return `<h2>Aide &amp; règles du jeu</h2>
  <div class="flex-between" style="margin-bottom:10px;">
    <p style="margin:0;">Conquête Tribale est un jeu de gestion de village médiéval type <i>Tribal Wars</i>, qui tourne désormais dans un <b>monde partagé en temps réel</b> : les autres joueurs sont de vraies personnes, connectées avec leur propre compte, et vous pouvez les attaquer comme ils peuvent vous attaquer. Les « villages barbares » de la carte restent contrôlés par le jeu et servent de cibles faciles pour démarrer.</p>
    <button id="btnReplayTutorial">🔰 Revoir le tutoriel</button>
  </div>
  <h3>Principes</h3>
  <p>Améliorez vos bâtiments dans l'onglet <b>Bâtiments</b> pour augmenter la production de ressources, la capacité de stockage et la population disponible. Construisez une <b>Caserne</b> pour entraîner des troupes dans l'onglet du même nom. Utilisez la <b>Carte</b> pour envoyer vos troupes reconnaître ou attaquer des villages — qu'ils soient barbares ou détenus par un autre joueur — afin de piller leurs ressources ; les rapports de bataille apparaissent dans l'onglet <b>Rapports</b>.</p>
  <h3>Reconnaissance et renseignement</h3>
  <p>Contrairement à un jeu solo, le serveur ne révèle jamais les troupes ni les ressources d'un village qui n'est pas le vôtre : vous devez d'abord y envoyer une <b>reconnaissance</b> (au moins un Éclaireur) pour en apprendre le contenu. Ce renseignement reste affiché tant que vous n'avez pas refait de reconnaissance plus récente — il peut donc devenir obsolète si le village a changé entre-temps. Le niveau de muraille, lui, est toujours visible.</p>
  <p><b>Contre-espionnage :</b> une reconnaissance ne réussit que si le nombre d'Éclaireurs envoyés dépasse strictement le nombre d'Éclaireurs présents en défense dans le village visé (troupes du village + renforts alliés stationnés confondus). En cas d'égalité ou d'infériorité, tous les Éclaireurs envoyés sont repérés et éliminés, sans aucun renseignement obtenu. Une reconnaissance réussie reste totalement furtive (la victime n'est jamais prévenue) ; une reconnaissance repoussée, elle, prévient son propriétaire.</p>
  <h3>Sièges et conquête</h3>
  <p>Le <b>Bélier</b> et la <b>Catapulte</b> sont des unités de siège : envoyées dans une attaque victorieuse contre un village barbare, elles endommagent respectivement sa muraille et sa capacité de stockage (l'entrepôt d'un vrai joueur ne peut pas être endommagé ainsi). Construisez une <b>Académie</b> (dès Hôtel de ville niveau 20 — coûteuse et longue, elle ne peut être bâtie qu'une seule fois) pour former des <b>Nobles</b> : chaque noble survivant à une attaque victorieuse contre un village barbare réduit sa loyauté d'environ 20 à 35% et est alors consommé ; à 0% le village est conquis et devient vôtre. La conquête d'un village appartenant à un autre joueur n'est pas possible dans cette version.</p>
  <h3 id="helpBlackArmy">🏴 Évènement : l'Armée Noire</h3>
  <p>Pour marquer l'ouverture officielle du jeu, une vague de campements de l'<b>Armée Noire</b> peut apparaître sur la carte pendant une durée limitée (bannière noire et rouge dans la colonne de gauche tant que l'évènement est actif). Ce sont des campements PNJ hostiles, en tout point semblables à des villages barbares pour le combat et la conquête, mais reconnaissables entre mille : <b>leur pin sur la Carte est noir</b>, avec une lueur rouge, jamais la couleur d'un barbare classique ni celle d'un autre joueur.</p>
  <p>Chaque campement a un <b>Rang</b> (de I à V, indiqué au survol de son pin) qui détermine sa force :</p>
  <p><b>Rang I-II</b> (les plus nombreux) sont volontairement accessibles à un tout nouveau village avec seulement quelques troupes entraînées — un bon premier objectif après vos toutes premières troupes. <b>Rang III-IV</b> demandent une petite armée dédiée et une muraille à entamer. <b>Rang V</b> (rares) sont redoutables : garnison conséquente et muraille haute, à réserver aux joueurs multi-villages avec béliers et catapultes en nombre.</p>
  <p>Chaque victoire contre un campement de l'Armée Noire rapporte un <b>butin nettement plus riche</b> qu'un barbare ordinaire, et compte pour le succès <b>Chasseur de l'Armée Noire</b> (sous-onglet Succès). Conquérir un campement (comme pour un barbare classique, via un Noble) est encore plus intéressant : contrairement aux barbares normaux (1 sur 8 seulement), un campement de l'Armée Noire garantit <b>toujours</b> un gisement riche (+10% de production sur une ressource, définitivement) une fois conquis, et son niveau de développement initial reflète son Rang — un Rang V conquis démarre avec des bâtiments déjà bien avancés, pas au niveau 1.</p>
  <p>L'évènement est temporaire : passé son délai, les campements pas encore conquis se retirent automatiquement du monde (une annonce prévient de son lancement et de sa fin). Aucun risque à s'y frotter au-delà du combat lui-même : comme pour un barbare, si vous perdez, vous ne perdez que les troupes envoyées.</p>
  <h3>Gisements riches</h3>
  <p>Environ 1 village barbare sur 8 recèle un <b>gisement riche</b> en une ressource tirée au hasard (bois, argile ou fer), repérable sur la Carte par un petit badge ${RES_ICON.iron} sur son pin (survolez ou touchez le pin pour voir laquelle). Une fois ce village conquis par un Noble, il produit <b>+10%</b> de cette ressource — un bonus propre à ce village précis, qui ne s'applique jamais à vos autres villages.</p>
  <h3>Un monde vivant, avec de vrais joueurs</h3>
  <p>Les villages barbares se développent tout seuls avec le temps (nouvelles troupes, muraille renforcée, réserves agrandies), surtout les plus éloignés du centre, et peuvent riposter par un raid si vous les attaquez trop souvent. Les autres joueurs, eux, agissent quand ils le souhaitent : soyez prêt à défendre votre village (troupes en garnison, muraille) à tout moment, même hors ligne — l'économie et les combats continuent en votre absence, le monde tourne en temps réel 24h/24.</p>
  <h3>Succès et Classement</h3>
  <p>Le sous-onglet <b>Succès</b> (dans Informations, à côté d'Aide) reprend les mêmes catégories que le jeu officiel (points, conquêtes, pillage, troupes ennemies détruites, soutien, échanges au Marché, murailles démolies, nombre d'adversaires distincts attaqués...), chacune avec 4 paliers — Bois, Bronze, Argent, Or — qui se débloquent automatiquement au fil de votre progression, sans réclamation ni récompense en jeu : c'est purement indicatif. L'onglet <b>Classement</b> affiche les meilleurs joueurs du monde par nombre de points.</p>
  <h3>Licencier des troupes</h3>
  <p>Dans l'onglet <b>Caserne</b>, chaque type de troupe présent dans le village affiche un encart « 🗑️ Licencier » : indiquez un nombre et validez pour détruire définitivement ces troupes (aucun remboursement de ressources). Seules les troupes actuellement stationnées dans le village peuvent être licenciées — impossible pour celles en formation ou déjà parties en mission.</p>
  <h3>Compte et progression</h3>
  <p>Votre village est sauvegardé automatiquement sur le serveur à chaque action : aucune sauvegarde manuelle n'est nécessaire, et vous pouvez vous reconnecter à tout moment avec votre pseudo et votre mot de passe, depuis n'importe quel appareil.</p>
  ${state.isAdmin ? "" : `
  <div class="box" style="margin-top:16px;">
    <h3>🔑 Devenir administrateur</h3>
    <p class="small muted">Si vous disposez du code d'accès administrateur, saisissez-le ici pour débloquer le panneau d'administration sur votre compte.</p>
    <form id="adminClaimForm" style="display:flex; gap:8px; flex-wrap:wrap;">
      <input type="password" id="adminClaimCode" placeholder="Code administrateur" style="flex:1 1 200px;">
      <button type="submit" class="primary">Valider</button>
    </form>
  </div>`}`;
}

function attachTabHandlers(){
  document.querySelectorAll("[data-plot]").forEach(el=>el.onclick=()=>{
    ui.selectedBuilding = el.dataset.plot;
    renderActiveTabContent();
  });
  // Navigation générique vers un autre onglet (utilisé par la liste de bâtiments du thème
  // Parchemin pour la ligne "Hall de guilde", qui se gère depuis l'onglet Guilde et non ici).
  document.querySelectorAll("[data-goto-tab]").forEach(el=>el.onclick=()=>{
    closeVillageAction();
    activeTab = el.dataset.gotoTab; renderTabs(); renderActiveTabContent();
  });
  document.querySelectorAll("[data-build]").forEach(b=>b.onclick=()=>queueBuild(b.dataset.build));
  const transferBtn=document.getElementById("btnVillageTransfer");
  if(transferBtn) transferBtn.onclick=sendVillageTransfer;
  document.querySelectorAll("[data-train]").forEach(b=>b.onclick=()=>{

  });
  document.querySelectorAll("[data-disband]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.disband;
    const inp=document.getElementById("disbandCount_"+k);
    disbandTroops(k, Number(inp.value));
  });
  document.querySelectorAll("[data-commander-upgrade]").forEach(b=>b.onclick=()=>{
    const branch=b.dataset.commanderUpgrade;
    const name=(COMMANDER_BRANCHES[branch]||{}).name || branch;
    doAction(()=>apiCall("/api/commander/upgrade","POST",{branch}), "🎖️ Palier débloqué : "+name+" !", null);
  });
  document.querySelectorAll("[data-info-subtab]").forEach(b=>b.onclick=()=>{
    infoSubTab=b.dataset.infoSubtab;
    renderActiveTabContent();
  });
  const replayBtn=document.getElementById("btnReplayTutorial");
  if(replayBtn) replayBtn.onclick=showTutorial;
  const claimForm=document.getElementById("adminClaimForm");
  if(claimForm) claimForm.onsubmit=(e)=>{
    e.preventDefault();
    const code=document.getElementById("adminClaimCode").value;

  document.querySelectorAll("[data-village-pin]").forEach(el=>el.onclick=()=>{

    openPlayerProfile(el.dataset.openProfile);

  document.querySelectorAll("[data-delete-report]").forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const id=b.dataset.deleteReport;
    doAction(()=>apiCall("/api/reports/delete","POST",{ids:[id]}), "🗑️ Rapport supprimé", null);
  });
  const clearBtn=document.getElementById("btnClearReports");
  if(clearBtn) clearBtn.onclick=()=>{
    const kind=clearBtn.dataset.clearKind||undefined;

  document.querySelectorAll("[data-report-filter]").forEach(b=>b.onclick=()=>{

    doAction(()=>apiCall("/api/market/accept","POST",{offerId:b.dataset.marketAccept}), "🤝 Échange effectué !", null);
  });
}

/* ---- Thème visuel (Bois sombre / Parchemin) : bouton en bas de page, persisté par joueur ---- */
const THEME_KEY = "ct_theme";
function applyTheme(theme){
  document.body.classList.toggle("theme-maquette", theme==="maquette");
  const btn=document.getElementById("btnThemeToggle");
  if(btn) btn.textContent = theme==="maquette" ? "🪵 Thème : Bois sombre" : "📜 Thème : Parchemin";
  localStorage.setItem(THEME_KEY, theme);
}
function initTheme(){
  applyTheme(localStorage.getItem(THEME_KEY) || "classic");
  const btn=document.getElementById("btnThemeToggle");
  if(btn) btn.onclick=()=>{
    const current = document.body.classList.contains("theme-maquette") ? "maquette" : "classic";
    applyTheme(current==="maquette" ? "classic" : "maquette");
  };
}

function start(){
  document.getElementById("gameRoot").style.display="none";
  window.addEventListener("resize", ()=>{ if(activeTab==="map") positionMapWorld(); });
  initTheme();
  tryResumeSession();
}

start();
})();
